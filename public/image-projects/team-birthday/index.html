<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Birthday card</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- public/video-projects/birthday held at its final frame, in the welcome card's portrait layout: the Slack
         desktop dimmed under the character-sheet card, the birthday line below, confetti frozen mid-burst. The
         LEVEL UP stamp, its glow and shockwave are motion only and left out. backdrop-filter is left out: it
         doesn't come through the export. -->
    <style>
      #canvas {
        width: 1080px;
        height: 1350px;
      }

      /* ---- Desktop (01-desktop), dimmed under the card ---- */
      .wallpaper {
        position: absolute;
        inset: -40px;
        background: #e9e7e4 url("assets/wallpaper.jpg") center / cover no-repeat;
      }
      .menubar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
        display: flex;
        align-items: center;
        gap: 34px;
        padding: 0 28px;
        background: rgba(10, 10, 15, 0.45);
        color: rgba(250, 244, 236, 0.92);
        font-size: 21px;
        font-weight: 500;
      }
      .menubar img {
        height: 17px;
      }
      .menubar .app {
        font-weight: 700;
      }
      .menubar .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 25px;
      }
      .menubar svg {
        width: 24px;
        height: 24px;
      }
      .dock {
        position: absolute;
        left: 167px;
        bottom: 24px;
        width: 746px;
        height: 134px;
        padding: 14px;
        display: flex;
        gap: 16px;
        border-radius: 38px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      .dock .tile {
        position: relative;
        width: 106px;
        height: 106px;
        flex-shrink: 0;
      }
      .dock .tile img {
        width: 106px;
        height: 106px;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
      }
      .dock .tile img.slack-icon {
        padding: 9px;
      }
      .running {
        position: absolute;
        left: 596px;
        bottom: 12px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(250, 244, 236, 0.85);
      }
      .dim {
        position: absolute;
        inset: 0;
        background: rgba(6, 6, 10, 0.62);
      }

      /* The card and the birthday line, centred between the menubar and the dock. */
      .stage {
        position: absolute;
        left: 0;
        right: 0;
        top: 50px;
        bottom: 158px;
        --portrait: 260px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      /* Lucide icons (lucide.dev, ISC). */
      svg.ic {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* Labels: Outfit, uppercase and tracked (the video's were mono). */
      .k {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-cream-dim);
      }

      /* ---- Card (03-card) in the welcome card's portrait stack ---- */
      .card {
        position: relative;
        width: 780px;
        border-radius: 24px;
        background: rgba(26, 29, 33, 0.87);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(215, 73, 57, 0.12);
        overflow: hidden;
      }
      .chrome {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .chrome span {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25);
      }
      .chrome .close {
        background: #ff5f57;
      }
      .chrome .min {
        background: #febc2e;
      }
      .chrome .max {
        background: #28c840;
      }
      .body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 46px 40px 40px;
      }
      .portrait {
        position: relative;
        width: var(--portrait);
        height: var(--portrait);
      }
      /* Gradient ring, clipped to a rounded frame around the photo; held where the video's spin ends (581°). */
      .ring-frame {
        position: absolute;
        inset: -8px;
        border-radius: 36px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(215, 73, 57, 0.35);
      }
      .ring {
        position: absolute;
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(from 0deg, #d74939, #ff8163, rgba(215, 73, 57, 0.1), #d74939);
        transform: rotate(581deg);
      }
      .photo {
        position: absolute;
        inset: 0;
        width: var(--portrait);
        height: var(--portrait);
        object-fit: cover;
        border-radius: 30px;
        border: 4px solid #1a1d21;
      }
      .badge {
        position: absolute;
        left: 50%;
        bottom: -20px;
        transform: translateX(-50%);
        min-width: 200px;
        text-align: center;
        padding: 9px 22px;
        border-radius: 999px;
        background: var(--m-red);
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
        box-shadow: 0 8px 24px rgba(215, 73, 57, 0.45);
      }
      /* Fitted to the card's 700px column in onFields: one line down to 56px, then two balanced lines. */
      .name {
        margin-top: 44px;
        max-width: 700px;
        text-align: center;
        text-wrap: balance;
        font-size: 80px;
        font-weight: 900;
        line-height: 1.15;
        padding-bottom: 4px;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }
      /* Status line: a cake slice where the welcome card has the green "Available" dot. */
      .presence {
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 24px;
        font-weight: 500;
        color: var(--m-cream-mid);
      }
      .presence svg.ic {
        width: 24px;
        height: 24px;
        color: var(--m-red-light);
      }
      .meta {
        margin-top: 22px;
        width: 700px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px 26px;
        font-size: 24px;
      }
      /* Role pill: the small Massive mark where the video has its ROLE label, then the role. */
      .org {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 16px 7px 13px;
        border-radius: 10px;
        background: rgba(215, 73, 57, 0.14);
        border: 1px solid rgba(215, 73, 57, 0.45);
        color: var(--m-red-light);
        font-weight: 600;
        white-space: nowrap;
      }
      .org img {
        height: 15px;
      }
      .loc {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--m-cream-mid);
        font-weight: 500;
        white-space: nowrap;
      }
      .loc svg.ic {
        width: 24px;
        height: 24px;
      }
      .divider {
        align-self: stretch;
        margin: 32px 0 24px;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }
      .stat {
        align-self: stretch;
        display: grid;
        grid-template-columns: 50px 150px 1fr;
        align-items: center;
        gap: 14px;
        min-height: 60px;
      }
      .stat + .stat {
        margin-top: 12px;
      }
      .stat .tile {
        width: 50px;
        height: 50px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(215, 73, 57, 0.14);
        color: var(--m-red-light);
      }
      /* The quest: one line at 26px, or two, shrinking past that (onFields). */
      .v {
        font-size: 26px;
        font-weight: 500;
        line-height: 1.25;
      }
      .xp {
        grid-template-columns: 50px 150px 1fr 64px;
      }
      .track {
        position: relative;
        height: 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--m-red), var(--m-red-light));
      }
      .num {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--m-red-light);
        text-align: right;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(215, 73, 57, 0.14);
        border: 1px solid rgba(215, 73, 57, 0.45);
        color: var(--m-red-light);
        font-size: 21px;
        font-weight: 600;
        white-space: nowrap;
      }

      /* ---- Outro (04-outro): the wordmark over the birthday line, fitted to the frame in onFields ----
           Positioned so it paints above the card's drop shadow. */
      .outro {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .outro .logo {
        height: 28px;
      }
      .hello {
        font-size: 58px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .hello .who {
        color: var(--m-red-light);
      }
      .confetti {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div class="wallpaper"></div>
      <div class="menubar">
        <img src="../_brand/icon-massive-white.svg" alt="Massive" />
        <span class="app">Slack</span>
        <span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
        <div class="right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0" /><path d="M1.42 9a16 16 0 0 1 21.16 0" /><path d="M8.53 16.11a6 6 0 0 1 6.95 0" /><line x1="12" x2="12.01" y1="20" y2="20" /></svg>
        </div>
      </div>
      <div class="dock">
        <div class="tile"><img src="assets/dock/safari.png" alt="Safari" /></div>
        <div class="tile"><img src="assets/dock/mail.png" alt="Mail" /></div>
        <div class="tile"><img src="assets/dock/facetime.png" alt="FaceTime" /></div>
        <div class="tile"><img class="slack-icon" src="assets/slack.svg" alt="Slack" /></div>
        <div class="tile"><img src="assets/dock/notes.png" alt="Notes" /></div>
        <div class="tile"><img src="assets/dock/app-store.png" alt="App Store" /></div>
      </div>
      <div class="running"></div>
      <div class="dim"></div>

      <div class="stage">
        <div class="card">
          <div class="chrome"><span class="close"></span><span class="min"></span><span class="max"></span></div>
          <div class="body">
            <div class="portrait">
              <div class="ring-frame"><div class="ring"></div></div>
              <img class="photo" data-field-src="photo" src="assets/franklin.jpg" alt="" />
              <div class="badge">Birthday</div>
            </div>
            <div class="name" data-field="name">Franklin Uche</div>
            <div class="presence">
              <svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="7" r="2" /><path d="M7.2 7.9 3 11v9c0 .6.4 1 1 1h16c.6 0 1-.4 1-1v-9c0-2-3-6-7-8l-3.6 2.6" /><path d="M16 13H3" /><path d="M16 17H3" /></svg>
              <span>Celebrating today</span>
            </div>
            <div class="meta">
              <span class="org"><img src="../_brand/icon-massive.svg" alt="Massive" /><span data-field="role">Community Lead</span></span>
              <span class="loc">
                <svg class="ic" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></svg>
                <span data-field="location">Lagos, Nigeria</span>
              </span>
            </div>
            <div class="divider"></div>
            <div class="stat quest">
              <div class="tile"><svg class="ic" viewBox="0 0 24 24"><path d="M5.8 11.3 2 22l10.7-3.79" /><path d="M4 3h.01" /><path d="M22 8h.01" /><path d="M15 2h.01" /><path d="M22 20h.01" /><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10" /><path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17" /><path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7" /><path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2Z" /></svg></div>
              <span class="k">Quest</span>
              <div class="v" data-field="quest">Eat cake. Make a wish.</div>
            </div>
            <div class="stat xp">
              <div class="tile"><svg class="ic" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" /><path d="M20 3v4" /><path d="M22 5h-4" /><path d="M4 17v2" /><path d="M5 18H3" /></svg></div>
              <span class="k">Birthday XP</span>
              <div class="track"><div class="fill"></div></div>
              <span class="num">MAX</span>
            </div>
            <div class="stat rewards">
              <div class="tile"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1" /><path d="M12 8v13" /><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" /><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5" /></svg></div>
              <span class="k">Rewards</span>
              <div class="chips"><span class="chip">+1 Wisdom</span><span class="chip">+1 Cake</span><span class="chip">+100 Good vibes</span></div>
            </div>
          </div>
        </div>

        <div class="outro">
          <img class="logo" src="../_brand/logo-massive.svg" alt="Massive" />
          <div class="hello">Happy birthday, <span class="who" data-field="firstName">Franklin</span>!</div>
        </div>
      </div>

      <div class="confetti" data-field-show="confetti"></div>
    </div>

    <script src="../_lib/confetti.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const fit = (el, max, from, min) => {
        el.style.fontSize = `${from}px`;
        for (let size = from; el.scrollWidth > max && size > min; size -= 2) el.style.fontSize = `${size - 2}px`;
      };
      // The name: one line from 80px down to 56px; longer names wrap to two balanced lines, from 64px down.
      const fitName = (el) => {
        el.style.whiteSpace = "nowrap";
        el.style.lineHeight = "";
        fit(el, 700, 80, 56);
        if (el.scrollWidth <= 700) return;
        el.style.whiteSpace = "normal";
        el.style.lineHeight = "1.05";
        for (let size = 64; size >= 40; size -= 2) {
          el.style.fontSize = `${size}px`;
          if (el.scrollWidth <= 700 && el.offsetHeight <= size * 2.2 + 4) break;
        }
      };
      // Shrinks a wrapping block until it fits in `lines` lines.
      const fitLines = (el, lines, from, min) => {
        for (let size = from; size >= min; size -= 1) {
          el.style.fontSize = `${size}px`;
          if (el.offsetHeight <= size * 1.25 * lines + 2) break;
        }
      };
      let burstY = null;

      // A long name or long answers make the card taller: the portrait gives up room, down to 180px, until the
      // stack fits between the menubar and the dock with 24px to spare on each side.
      const fitStage = (from) => {
        const stage = $(".stage");
        const gap = parseFloat(getComputedStyle(stage).rowGap) || 0;
        const need = () => [...stage.children].reduce((h, el) => h + el.offsetHeight, 0) + gap * (stage.children.length - 1);
        for (let p = from; p >= 180; p -= 10) {
          stage.style.setProperty("--portrait", `${p}px`);
          if (need() <= stage.clientHeight - 48) break;
        }
      };

      window.onFields = (values) => {
        // Rewards arrive as one field, comma-separated (one per line also works), up to five chips. A comma
        // inside a number ("+1,000 XP") doesn't split.
        const rewards = String(values.rewards ?? "").split(/\n|,(?!\d)/).map((s) => s.trim()).filter(Boolean).slice(0, 5);
        $(".chips").replaceChildren(
          ...rewards.map((text) => Object.assign(document.createElement("span"), { className: "chip", textContent: text })),
        );
        $(".rewards").style.display = rewards.length ? "" : "none";

        fitName($(".name"));
        // Role and location share a line, shrinking to 20px; past that they wrap.
        const meta = $(".meta");
        meta.style.flexWrap = "nowrap";
        fit(meta, 700, 24, 20);
        if (meta.scrollWidth > 700) meta.style.flexWrap = "wrap";
        fitLines($(".quest .v"), 2, 26, 20);
        fit($(".hello"), 920, 58, 40);
        fitStage(260);

        // The level-up burst from behind the portrait, frozen 1.3 s in. The card's height varies, so aim at
        // wherever the portrait landed.
        const canvas = $("#canvas").getBoundingClientRect();
        const portrait = $(".portrait").getBoundingClientRect();
        const y = Math.round(portrait.top + portrait.height / 2 - canvas.top);
        if (y !== burstY) {
          burstY = y;
          massiveConfetti($(".confetti"), { mode: "burst", count: 120, at: 1.3, x: 540, y });
        }
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
