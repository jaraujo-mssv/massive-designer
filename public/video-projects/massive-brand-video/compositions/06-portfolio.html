<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #root .pill {
          position: absolute;
          top: 96px;
          left: 100px;
          z-index: 2;
        }
        #root .split {
          display: flex;
          width: 100%;
          height: 100%;
        }
        #root .left {
          width: 50%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 60px 0 100px;
        }
        #root .stack {
          display: flex;
          flex-direction: column;
          gap: 30px;
        }
        #root .title {
          color: #faf4ec;
          font-size: 82px;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.04em;
        }
        #root .divider {
          height: 2px;
          background-color: #d74939;
          opacity: 0.55;
        }
        #root .bullets {
          display: flex;
          flex-direction: column;
          gap: 22px;
        }
        #root .bullet {
          display: flex;
          align-items: center;
          gap: 20px;
        }
        #root .bullet .dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background-color: #d74939;
          flex-shrink: 0;
        }
        #root .bullet .txt {
          color: rgba(250, 244, 236, 0.55);
          font-size: 36px;
          font-weight: 400;
          line-height: 1.3;
        }
        #root .right {
          width: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .chips {
          position: absolute;
          bottom: 96px;
          left: 100px;
          display: flex;
          gap: 12px;
        }
        #root .chip {
          background-color: #d7493922;
          border: 1px solid #d7493955;
          color: #faf4ec;
          padding: 6px 18px;
          border-radius: 20px;
          font-size: 22px;
          font-weight: 500;
        }
      </style>
      <div id="root" data-composition-id="bv-portfolio" data-width="1920" data-height="1080" data-duration="4">
        <div class="af fill">
          <div class="af dotgrid"></div>
          <div class="af brackets">
            <div class="corner" style="top: 52px; left: 52px"><div class="bw" style="top: 0; left: 0"></div><div class="bh" style="top: 0; left: 0"></div></div>
            <div class="corner" style="top: 52px; right: 52px"><div class="bw" style="top: 0; right: 0"></div><div class="bh" style="top: 0; right: 0"></div></div>
            <div class="corner" style="bottom: 52px; left: 52px"><div class="bw" style="bottom: 0; left: 0"></div><div class="bh" style="bottom: 0; left: 0"></div></div>
            <div class="corner" style="bottom: 52px; right: 52px"><div class="bw" style="bottom: 0; right: 0"></div><div class="bh" style="bottom: 0; right: 0"></div></div>
          </div>
          <div class="pill" data-up="0"><div class="eyebrow"><div class="rule"></div><div class="label">Use Case 03</div></div></div>
          <div class="split">
            <div class="left">
              <div class="stack">
                <div class="title display" data-up="8">Portfolio Management</div>
                <div class="divider"></div>
                <div class="bullets">
                  <div class="bullet" data-up="28"><div class="dot"></div><div class="txt display">Track companies via search &amp; LLM news</div></div>
                  <div class="bullet" data-up="40"><div class="dot"></div><div class="txt display">Weekly auto-reports, no repeat stories</div></div>
                  <div class="bullet" data-up="52"><div class="dot"></div><div class="txt display">Prioritized by importance of news</div></div>
                </div>
              </div>
            </div>
            <div class="right">
              <svg class="icon" viewBox="0 0 340 280" style="width: 820px; height: 676px">
                <line class="axis" x1="10" y1="258" y2="258" stroke="rgba(250, 244, 236, 0.55)" stroke-width="2" opacity="0.4" />
                <g class="bars"></g>
                <line class="trend" x1="18" stroke="#ff8163" stroke-width="2.5" stroke-linecap="round" />
              </svg>
            </div>
          </div>
        </div>
      </div>
      <script>
        BrandScene.mount("bv-portfolio", 120, (h) => {
          const { svg, attrs } = FrameKit;
          const rule = h.$(".stack .divider");
          const right = h.$(".right");
          const chips = h.$$(".chip");
          const BARS = [
            { x: 22, maxH: 150, delay: 2, color: "#d74939" },
            { x: 102, maxH: 210, delay: 10, color: "#ff8163" },
            { x: 182, maxH: 110, delay: 18, color: "#d74939" },
            { x: 262, maxH: 185, delay: 6, color: "#ff8163cc" },
          ];
          const axis = h.$(".icon .axis");
          const trend = h.$(".icon .trend");
          const barsG = h.$(".icon .bars");
          const bars = BARS.map((b) => {
            const g = svg("g", {}, barsG);
            return [
              svg("rect", { x: b.x - 2, width: 68, fill: b.color, opacity: 0.15, rx: 4 }, g),
              svg("rect", { x: b.x, width: 64, fill: b.color, rx: 4 }, g),
            ];
          });
          const drawIcon = (f) => {
            axis.setAttribute("x2", 10 + h.interpolate(f, [0, 12], [0, 326], h.CLAMP));
            BARS.forEach((b, i) => {
              const bh = h.interpolate(f, [b.delay, b.delay + 22], [0, b.maxH], h.CLAMP);
              bars[i].forEach((el) => attrs(el, { y: 258 - bh, height: bh }));
            });
            attrs(trend, {
              y1: 258 - h.interpolate(f, [26, 46], [0, 40], h.CLAMP),
              x2: 18 + h.interpolate(f, [26, 46], [0, 300], h.CLAMP),
              y2: 258 - h.interpolate(f, [26, 46], [0, 220], h.CLAMP),
              opacity: h.fIn(f, 26),
            });
          };
          return (f) => {
            rule.style.width = `${h.interpolate(f, [10, 30], [0, 720], h.CLAMP)}px`;
            right.style.opacity = h.fIn(f, 4, 12);
            chips.forEach((el, i) => {
              const p = Math.max(0, f - 52 - i * 6);
              el.style.opacity = h.interpolate(p, [0, 8], [0, 1], h.CLAMP);
              el.style.transform = `translateY(${h.interpolate(p, [0, 8], [14, 0], h.CLAMP)}px)`;
            });
            drawIcon(f);
          };
        });
      </script>
    </template>
  </body>
</html>
