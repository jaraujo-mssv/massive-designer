<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Can ChatGPT transcribe audio?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/frame-kit.js"></script>
    <script src="js/tray-data.js"></script>
    <script src="js/tray-kit.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #ctr-ground {
        position: absolute;
        inset: 0;
        background: #000;
      }
      /* ScriptVideo's top-and-tail: the whole picture fades up over the first
         8 frames and out over the last 8, to black. */
      #ctr-toptail {
        position: absolute;
        inset: 0;
        z-index: 100;
        background: #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="sparktray-can-chatgpt-transcribe-audio"
      data-start="0"
      data-duration="146.166667"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="ctr-ground" class="clip" data-start="0" data-duration="146.166667" data-track-index="0"></div>
      <div id="ctr-01-mechanism" class="clip scene"
        data-composition-id="ctr-01-mechanism" data-composition-src="compositions/01-mechanism.html"
        data-start="0" data-duration="21.483333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ctr-02-steps" class="clip scene"
        data-composition-id="ctr-02-steps" data-composition-src="compositions/02-steps.html"
        data-start="21.483333" data-duration="17.133333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ctr-03-contrast" class="clip scene"
        data-composition-id="ctr-03-contrast" data-composition-src="compositions/03-contrast.html"
        data-start="38.616667" data-duration="26.766667" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ctr-04-app-input" class="clip scene"
        data-composition-id="ctr-04-app-input" data-composition-src="compositions/04-app-input.html"
        data-start="65.383333" data-duration="13.833333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ctr-05-app-options" class="clip scene"
        data-composition-id="ctr-05-app-options" data-composition-src="compositions/05-app-options.html"
        data-start="79.216667" data-duration="15.45" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ctr-06-app-run" class="clip scene"
        data-composition-id="ctr-06-app-run" data-composition-src="compositions/06-app-run.html"
        data-start="94.666667" data-duration="4.45" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ctr-07-app-done" class="clip scene"
        data-composition-id="ctr-07-app-done" data-composition-src="compositions/07-app-done.html"
        data-start="99.116667" data-duration="6.016667" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ctr-08-caveat" class="clip scene"
        data-composition-id="ctr-08-caveat" data-composition-src="compositions/08-caveat.html"
        data-start="105.133333" data-duration="27.133333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ctr-09-logo" class="clip scene"
        data-composition-id="ctr-09-logo" data-composition-src="compositions/09-logo.html"
        data-start="132.266667" data-duration="13.9" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ctr-toptail" data-layout-allow-overlap></div>
      <!-- One continuous take from frame 0, as ScriptVideo plays it: no lead-in offset.
           The 0.05s ramp is ScriptVideo's 3-frame click guard. -->
      <audio
        id="ctr-voice"
        src="assets/voice/take-63531328.mp3"
        data-start="0"
        data-duration="144.96"
        data-track-index="2"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.05,"v":1}]}]}'
      ></audio>
    </div>
    <script>
      (function () {
        const { interpolate, CLAMP, drive } = FrameKit;
        const FRAMES = 8770;
        const cover = document.getElementById("ctr-toptail");
        const tl = gsap.timeline({ paused: true });
        drive(tl, 60, FRAMES, (f) => {
          const fade = interpolate(f, [0, 8, FRAMES - 8, FRAMES - 1], [0, 1, 1, 0], CLAMP);
          cover.style.opacity = String(1 - fade);
        });
        window.__timelines["sparktray-can-chatgpt-transcribe-audio"] = tl;
      })();
    </script>
  </body>
</html>
