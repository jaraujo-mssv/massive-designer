<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Code reviews: the last 15 months (square)</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- Layout and chart drawing are shared by the code-reviews-* images: ../_code-reviews/ (the .cr-square rules). -->
    <link rel="stylesheet" href="../_code-reviews/charts.css" />
  </head>
  <body>
    <div id="canvas" class="cr-square">
      <img class="m-bg-dark" src="../_brand/bg-dark.jpg" alt="" />
      <div class="cr-stack">
        <div class="cr-chart">
          <svg aria-label="Code reviews: the last 15 months (square)"></svg>
          <div class="cr-text">
            <div class="cr-title" data-field="headline">When pull requests tripled, two of us couldn’t keep up. A bot could.</div>
          </div>
        </div>
        <div class="cr-foot"><img src="../_brand/logo-massive.svg" alt="Massive" /></div>
      </div>
    </div>
    <script src="../_code-reviews/data.js"></script>
    <script src="../_code-reviews/charts.js"></script>
    <script>
      window.onFields = () => {
        codeReviews.fitTitle(document.querySelector(".cr-title"), 4);
        const svg = document.querySelector(".cr-chart svg");
        codeReviews.cumulative(svg, { from: "2025-08-04", stacked: true });
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
