<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{w}}, height={{h}}" />
    <title>{{title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/loop-kit.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <link rel="stylesheet" href="lib/massive.css" />
    <style>
      /* No background on html, body or #stage: the GIF capture makes them transparent.
         The ground is the .m-ground child below. */
      html,
      body {
        width: {{w}}px;
        height: {{h}}px;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: {{w}}px;
        height: {{h}}px;
        overflow: hidden;
        color: var(--m-cream);
        font-family: var(--m-sans);
      }
      .copy {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 120px;
      }
      .copy h1 {
        margin-top: 28px;
      }
      .dots {
        position: absolute;
        left: 80px;
        bottom: 120px;
        display: flex;
        gap: 24px;
      }
      .dots span {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--m-red-light);
      }
    </style>
  </head>
  <body>
    <!-- One design, a few moving parts. Phase 0 is the still: it must read as a finished image. -->
    <div id="stage" data-composition-id="{{id}}" data-start="0" data-duration="5" data-fps="15" data-width="{{w}}" data-height="{{h}}">
      <div class="m-ground"></div>
      <div class="m-dotgrid"></div>
      <div class="copy">
        <div class="m-eyebrow">Massive</div>
        <h1 class="m-h1">{{title}}</h1>
      </div>
      <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <script>
      (() => {
        const { wave } = LoopKit;
        const dots = [...document.querySelectorAll(".dots span")];

        // A pure function of the loop phase p (0 → 1). Every motion completes whole cycles per loop.
        function render(p) {
          dots.forEach((d, i) => {
            d.style.opacity = 0.25 + 0.75 * wave(p, 1, i / dots.length);
          });
        }

        const tl = gsap.timeline({ paused: true });
        LoopKit.drive(tl, document.getElementById("stage"), render);
        window.__timelines["{{id}}"] = tl;
      })();
    </script>
  </body>
</html>
