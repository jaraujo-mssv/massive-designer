<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>195+ countries, one API</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/loop-kit.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <link rel="stylesheet" href="lib/massive.css" />
    <style>
      /* No background on html, body or #stage: the GIF capture makes them transparent.
         The ground is the .m-ground child below. */
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        color: var(--m-cream);
        font-family: var(--m-sans);
      }
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 70% 40% at 50% 92%, rgba(215, 73, 57, 0.2), transparent 70%);
      }
      .copy {
        position: absolute;
        z-index: 1;
        left: 80px;
        right: 80px;
        top: 104px;
      }
      .copy h1 {
        margin-top: 30px;
        font-size: 120px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .copy p {
        margin-top: 30px;
        max-width: 820px;
        font-size: 34px;
        line-height: 1.3;
        color: var(--m-cream-mid);
      }
      canvas {
        position: absolute;
        left: 0;
        top: 0;
      }
      .hub {
        position: absolute;
        left: 50%;
        top: 1172px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 14px;
        height: 48px;
        padding: 0 22px;
        border-radius: 24px;
        background: var(--m-red);
        font-family: var(--m-sans);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--m-cream);
        white-space: nowrap;
      }
      .hub .to {
        min-width: 30px;
        color: var(--m-bg);
      }
      .foot {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .foot img {
        height: 34px;
      }
      .foot span {
        font-family: var(--m-sans);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--m-cream-dim);
      }
    </style>
  </head>
  <body>
    <!-- "195+ countries. One API." (scripts/banners/banners.config.mjs, banner 03-scale).
         One API node at the bottom fans requests out to countries on a dotted world map:
         a packet rides each arc, the country rings on arrival, and the hub names where it's routing.
         Phase 0 is the still: every arc, node and the headline are already drawn. -->
    <div id="stage" data-composition-id="gif-195-countries" data-start="0" data-duration="5" data-fps="15" data-width="1080" data-height="1350">
      <div class="m-ground"></div>
      <div class="glow"></div>
      <div class="copy">
        <div class="m-eyebrow">Real-time web access for AI</div>
        <h1><span class="m-accent">195+</span> countries.<br />One API.</h1>
        <p>Every market your AI needs to reach, through a single endpoint.</p>
      </div>
      <canvas id="map" width="1080" height="1350"></canvas>
      <canvas id="fx" width="1080" height="1350"></canvas>
      <div class="hub"><span>ONE API</span><span>→</span><span class="to" id="to">BR</span></div>
      <div class="foot">
        <img src="assets/brand/logo-white.svg" alt="Massive" />
        <span>joinmassive.com</span>
      </div>
    </div>
    <script src="js/world-paths.js"></script>
    <script>
      (() => {
        const { since, ease, clamp } = LoopKit;

        // The map: WORLD_PATHS (a 1009.67 × 665.96 Mercator canvas) scaled into this box.
        const MAP = { x: 60, y: 520, w: 960 };
        const S = MAP.w / WORLD_MAP.w;
        MAP.h = WORLD_MAP.h * S;
        const HUB = { x: 540, y: 1172 };
        // Firing order, spread around the globe so consecutive packets go different ways.
        const TARGETS = ["BR", "DE", "JP", "US", "IN", "ZA", "GB", "AU", "MX", "KR", "FR", "NG", "CA", "ID", "AR", "ES"];
        const TRAVEL = 0.6; // seconds from the hub to a country
        const RING = 0.9; // seconds a ring takes to fade

        // Build once: land mask, dot grid, each target's centre, the arcs.
        const mask = document.createElement("canvas");
        mask.width = Math.ceil(MAP.w);
        mask.height = Math.ceil(MAP.h);
        const mctx = mask.getContext("2d", { willReadFrequently: true });
        mctx.setTransform(S, 0, 0, S, 0, 0);
        const paths = Object.fromEntries(WORLD_PATHS.map(([iso, d]) => [iso, new Path2D(d)]));

        function centre(iso) {
          mctx.clearRect(0, 0, WORLD_MAP.w, WORLD_MAP.h);
          mctx.fill(paths[iso]);
          const { data, width, height } = mctx.getImageData(0, 0, mask.width, mask.height);
          let sx = 0, sy = 0, n = 0;
          for (let y = 0; y < height; y += 2) {
            for (let x = 0; x < width; x += 2) {
              if (data[(y * width + x) * 4 + 3] > 127) {
                sx += x;
                sy += y;
                n++;
              }
            }
          }
          return { x: MAP.x + sx / n, y: MAP.y + sy / n };
        }
        const nodes = TARGETS.map((iso) => ({ iso, ...centre(iso) }));
        // The US centre leans towards Alaska; pull it back over the mainland.
        const us = nodes.find((n) => n.iso === "US");
        us.x += 34;
        us.y += 22;

        mctx.clearRect(0, 0, WORLD_MAP.w, WORLD_MAP.h);
        for (const p of Object.values(paths)) mctx.fill(p);
        const land = mctx.getImageData(0, 0, mask.width, mask.height);
        const isLand = (x, y) => {
          const px = Math.round(x), py = Math.round(y);
          return px >= 0 && py >= 0 && px < land.width && py < land.height && land.data[(py * land.width + px) * 4 + 3] > 127;
        };

        const arcs = nodes.map((n) => {
          const lift = 90 + 0.25 * Math.abs(n.x - HUB.x);
          return { a: HUB, c: { x: (HUB.x + n.x) / 2, y: Math.min(HUB.y, n.y) - lift }, b: n };
        });
        const at = (arc, u) => ({
          x: (1 - u) * (1 - u) * arc.a.x + 2 * (1 - u) * u * arc.c.x + u * u * arc.b.x,
          y: (1 - u) * (1 - u) * arc.a.y + 2 * (1 - u) * u * arc.c.y + u * u * arc.b.y,
        });

        // Static layer: dotted land, faint arcs, the destination dots.
        const map = document.getElementById("map").getContext("2d");
        const STEP = 11;
        map.fillStyle = "rgba(250, 244, 236, 0.2)";
        for (let row = 0, y = STEP / 2; y < MAP.h; row++, y += STEP * 0.866) {
          for (let x = (row % 2) * (STEP / 2) + STEP / 2; x < MAP.w; x += STEP) {
            if (!isLand(x, y)) continue;
            map.beginPath();
            map.arc(MAP.x + x, MAP.y + y, 2.6, 0, LoopKit.TAU);
            map.fill();
          }
        }
        map.strokeStyle = "rgba(255, 129, 99, 0.16)";
        map.lineWidth = 1.5;
        for (const arc of arcs) {
          map.beginPath();
          map.moveTo(arc.a.x, arc.a.y);
          map.quadraticCurveTo(arc.c.x, arc.c.y, arc.b.x, arc.b.y);
          map.stroke();
        }
        map.fillStyle = "#d74939";
        for (const n of nodes) {
          map.beginPath();
          map.arc(n.x, n.y, 5, 0, LoopKit.TAU);
          map.fill();
        }

        const fx = document.getElementById("fx").getContext("2d");
        const to = document.getElementById("to");

        // Packet k leaves the hub at phase k / N, lands TRAVEL seconds later and rings for RING seconds.
        function render(p) {
          fx.clearRect(0, 0, 1080, 1350);
          const N = arcs.length;
          arcs.forEach((arc, k) => {
            const s = since(p, k / N);
            if (s < TRAVEL) {
              const u = ease.inOut(s / TRAVEL);
              const tail = Math.max(0, u - 0.18);
              fx.strokeStyle = "#ff8163";
              fx.lineWidth = 3;
              fx.beginPath();
              for (let i = 0; i <= 8; i++) {
                const q = at(arc, tail + ((u - tail) * i) / 8);
                if (i === 0) fx.moveTo(q.x, q.y);
                else fx.lineTo(q.x, q.y);
              }
              fx.stroke();
              const head = at(arc, u);
              fx.fillStyle = "#ff8163";
              fx.beginPath();
              fx.arc(head.x, head.y, 7, 0, LoopKit.TAU);
              fx.fill();
            } else if (s < TRAVEL + RING) {
              const a = (s - TRAVEL) / RING;
              const n = arc.b;
              fx.strokeStyle = `rgba(255, 129, 99, ${1 - a})`;
              fx.lineWidth = 3;
              fx.beginPath();
              fx.arc(n.x, n.y, 8 + 30 * ease.out(a), 0, LoopKit.TAU);
              fx.stroke();
              fx.fillStyle = "#ff8163";
              fx.beginPath();
              fx.arc(n.x, n.y, 5 + 4 * (1 - clamp(a * 2)), 0, LoopKit.TAU);
              fx.fill();
            }
          });
          to.textContent = TARGETS[Math.floor(p * N) % N];
        }

        const tl = gsap.timeline({ paused: true });
        LoopKit.drive(tl, document.getElementById("stage"), render);
        window.__timelines["gif-195-countries"] = tl;
      })();
    </script>
  </body>
</html>
