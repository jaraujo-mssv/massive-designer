<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Everything I know about Irish food</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <style>
      /* A plain outline of Ireland (assets/ireland.js) with one pin. The pin's head holds a plate of chicken wings and
         a pot of blue cheese dip instead of a dot, and a small label sits beside it. The light register, no grid;
         the pin is paper-red. The pin goes where the lon and lat sliders put it. */
      #canvas {
        width: 1080px;
        height: 1080px;
      }
      .map {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1080px;
        overflow: visible;
      }
      .label {
        position: absolute;
        padding: 14px 22px 16px;
        background: #ffffff;
        border: 1px solid rgba(23, 22, 21, 0.14);
        border-radius: 14px;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: var(--m-ink);
        max-width: 330px;
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div id="canvas" class="soft-orange">
      <svg class="map" viewBox="0 0 1080 1080" stroke-linejoin="round" stroke-linecap="round"></svg>
      <div class="label" data-field="label">Everything I know about Irish food.</div>
    </div>
    <script src="assets/ireland.js"></script>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const INK = "#171615";
      const RED = "#d54635";
      // The map, 860 px tall, centred.
      const MAP = { scale: 0.86, top: 110 };
      MAP.left = (1080 - IRELAND.w * MAP.scale) / 2;
      // The pin: head radius and the tip's distance below the head's centre.
      const R = 106;
      const TIP = R * 1.9;

      const add = (parent, tag, attrs) => {
        const node = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
        parent.appendChild(node);
        return node;
      };

      // One wing, centred on (0, 0) and pointing right: a drumette (a meaty end and a bone knob) or a flat.
      const DRUMETTE =
        "M-20 0 C-20 -15 -5 -17 4 -9 L15 -5 C19 -9 27 -8 27 -2 C30 0 30 5 27 6 C26 11 19 11 15 7 L4 9 C-5 17 -20 15 -20 0 Z";
      const FLAT = "M-22 -6 C-22 -15 -9 -14 0 -11 C9 -14 22 -15 22 -6 L22 6 C22 15 9 14 0 11 C-9 14 -22 15 -22 6 Z";

      function plate(g) {
        // The plate, its rim, then the wings and the dip.
        add(g, "circle", { r: 88, fill: "#ffffff", stroke: INK, "stroke-width": 3 });
        add(g, "circle", { r: 72, fill: "none", stroke: "rgba(23, 22, 21, 0.12)", "stroke-width": 2 });
        const wings = [
          [FLAT, -36, -36, 28],
          [DRUMETTE, -55, 6, 82],
          [DRUMETTE, -14, 6, -18],
          [FLAT, -14, 50, -8],
          [DRUMETTE, 28, 38, 34],
          [FLAT, 52, 0, 96],
        ];
        for (const [d, x, y, rot] of wings) {
          const w = add(g, "g", { transform: `translate(${x} ${y}) rotate(${rot}) scale(1.14)` });
          add(w, "path", { d, fill: "#cf4f1f", stroke: INK, "stroke-width": 2.5 });
          // Sauce: a highlight along the top and a few dark flecks.
          add(w, "path", { d: "M-12 -6 C-6 -9 2 -8 8 -5", fill: "none", stroke: "#f08f55", "stroke-width": 3 });
          add(w, "circle", { cx: -6, cy: 4, r: 1.8, fill: "#86270e" });
          add(w, "circle", { cx: 6, cy: 2, r: 1.4, fill: "#86270e" });
        }
        // The pot of blue cheese dip, top right on the plate.
        const pot = add(g, "g", { transform: "translate(30 -40)" });
        add(pot, "circle", { r: 29, fill: "#f3f1ee", stroke: INK, "stroke-width": 2.5 });
        add(pot, "circle", { r: 22, fill: "#fbf9f3", stroke: "rgba(23, 22, 21, 0.18)", "stroke-width": 1.5 });
        // Chunks of blue cheese: small irregular blobs.
        for (const [x, y, r, rot] of [[-8, -7, 3.6, 10], [6, -10, 2.8, 50], [9, 5, 3.8, 120], [-4, 9, 3, 80], [-13, 3, 2.4, 30], [2, 0, 2.2, 160], [13, -3, 2, 70]])
          add(pot, "ellipse", { cx: x, cy: y, rx: r, ry: r * 0.72, transform: `rotate(${rot} ${x} ${y})`, fill: r > 3 ? "#4f75a8" : "#7f9fc6" });
        add(pot, "path", { d: "M-12 -14 C-7 -18 0 -19 5 -18", fill: "none", stroke: "#ffffff", "stroke-width": 2.5 });
      }

      window.onFields = (values) => {
        const svg = document.querySelector(".map");
        svg.replaceChildren();
        const map = add(svg, "g", { transform: `translate(${MAP.left} ${MAP.top}) scale(${MAP.scale})` });
        add(map, "path", { d: IRELAND.d, fill: "#ffffff", stroke: INK, "stroke-width": 3 / MAP.scale });

        const [u, v] = IRELAND.lonLat(Number(values.lon), Number(values.lat));
        const tip = [MAP.left + u * MAP.scale, MAP.top + v * MAP.scale];
        const head = [tip[0], tip[1] - TIP];
        // A soft mark where the pin meets the map, then the pin: a circle drawn down to its tip.
        add(svg, "ellipse", { cx: tip[0], cy: tip[1] + 2, rx: 20, ry: 6, fill: "rgba(23, 22, 21, 0.16)" });
        const a = Math.acos(R / TIP);
        const sx = R * Math.sin(a);
        const sy = R * Math.cos(a);
        add(svg, "path", {
          d: `M${tip[0]} ${tip[1]} L${head[0] - sx} ${head[1] + sy} A${R} ${R} 0 1 1 ${head[0] + sx} ${head[1] + sy} Z`,
          fill: RED,
          stroke: INK,
          "stroke-width": 3,
        });
        plate(add(svg, "g", { transform: `translate(${head[0]} ${head[1]})` }));

        // The label beside the pin's head: to its right, or to its left when the right is short of room.
        const label = document.querySelector(".label");
        const box = label.getBoundingClientRect();
        const right = head[0] + R + 24;
        const x = right + box.width <= 1080 - 64 ? right : head[0] - R - 24 - box.width;
        label.style.left = `${x}px`;
        label.style.top = `${head[1] - box.height / 2}px`;
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
