<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: Outfit, sans-serif;
        }
        #root .row {
          position: absolute;
          left: 0;
          right: 0;
          top: 842px;
          display: flex;
          align-items: baseline;
          justify-content: center;
          gap: 28px;
        }
        /* Wordmark caps fill the SVG's full height, so a cap-height image on the text baseline matches the
           text (Outfit caps are 0.7em: 46px × 0.7). */
        #root .row img {
          height: 32px;
        }
        #root .sep {
          align-self: center;
          width: 3px;
          height: 44px;
          border-radius: 2px;
          background: rgba(250, 244, 236, 0.55);
        }
        #root .hello {
          font-size: 46px;
          font-weight: 800;
          letter-spacing: -0.03em;
          color: #faf4ec;
          white-space: nowrap;
        }
        #root .hello .who {
          color: #ff8163;
        }
      </style>
      <div id="root" data-composition-id="wm-outro" data-width="1920" data-height="1080" data-duration="4.5">
        <div class="row">
          <img class="logo" src="assets/brand/logo-massive.svg" alt="Massive" />
          <div class="sep"></div>
          <div class="hello">Welcome to the team, <span class="who" data-var-text="firstName">Franklin</span>!</div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="wm-outro"]');
          const q = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(q(".logo"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.1);
          tl.fromTo(q(".sep"), { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power2.out" }, 0.25);
          tl.fromTo(q(".hello"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3);
          window.__timelines["wm-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
