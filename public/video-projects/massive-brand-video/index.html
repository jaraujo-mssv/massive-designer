<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Massive Brand Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/frame-kit.js"></script>
    <script src="js/brand-scene.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #stage-bg {
        position: absolute;
        inset: 0;
        background: #0a0a0f;
      }

      /* Shared pieces used by every scene sub-composition. */
      .bv .fill {
        background-color: #0a0a0f;
      }
      .bv .dotgrid {
        background-image: radial-gradient(circle, rgba(96, 118, 145, 0.7) 1.5px, transparent 1.5px);
        background-size: 72px 72px;
        opacity: 0.18;
        pointer-events: none;
      }
      .bv .brackets {
        pointer-events: none;
      }
      .bv .brackets .corner {
        position: absolute;
      }
      .bv .brackets .corner > div {
        position: absolute;
        background-color: #d74939;
      }
      .bv .brackets .bw {
        height: 3px;
      }
      .bv .brackets .bh {
        width: 3px;
      }
      .bv .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .bv .eyebrow .rule {
        width: 24px;
        height: 1px;
        background-color: #d74939;
        flex-shrink: 0;
      }
      .bv .eyebrow .label {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #d74939;
      }
      .bv .display {
        font-family: Outfit, sans-serif;
      }
      .bv .mono {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="massive-brand-video"
      data-start="0"
      data-duration="25"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage-bg" class="clip" data-start="0" data-duration="25" data-track-index="0"></div>
      <div id="bv-logo-intro" class="clip scene bv"
        data-composition-id="bv-logo-intro" data-composition-src="compositions/01-logo-intro.html"
        data-start="0" data-duration="1.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="bv-opening" class="clip scene bv"
        data-composition-id="bv-opening" data-composition-src="compositions/02-opening.html"
        data-start="1.5" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="bv-product" class="clip scene bv"
        data-composition-id="bv-product" data-composition-src="compositions/03-product.html"
        data-start="5.5" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="bv-crm" class="clip scene bv"
        data-composition-id="bv-crm" data-composition-src="compositions/04-crm.html"
        data-start="8.5" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="bv-search" class="clip scene bv"
        data-composition-id="bv-search" data-composition-src="compositions/05-search.html"
        data-start="12.5" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="bv-portfolio" class="clip scene bv"
        data-composition-id="bv-portfolio" data-composition-src="compositions/06-portfolio.html"
        data-start="16.5" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="bv-how-to" class="clip scene bv"
        data-composition-id="bv-how-to" data-composition-src="compositions/07-how-to.html"
        data-start="20.5" data-duration="3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="bv-outro" class="clip scene bv"
        data-composition-id="bv-outro" data-composition-src="compositions/08-outro.html"
        data-start="23.5" data-duration="1.5" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["massive-brand-video"] = tl;
    </script>
  </body>
</html>
