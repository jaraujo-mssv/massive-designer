<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Code reviews: the bot matched 2½ years in four months</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- Layout and chart drawing are shared by the code-reviews-* images: ../_code-reviews/. -->
    <link rel="stylesheet" href="../_code-reviews/charts.css" />
  </head>
  <body>
    <div id="canvas">
      <div class="m-dotgrid"></div>
      <div class="cr-stack">
        <div class="cr-chart">
          <svg aria-label="Code reviews: the bot matched 2½ years in four months"></svg>
          <div class="cr-text">
            <div class="cr-title" data-field="headline">Our code-review bot did in four months what took us two and a half years</div>
            <div class="cr-stats" data-field-show="showStats">
              <div class="cr-stat"><b data-field="stat1">371</b><span data-field="stat1Label">pull requests reviewed by the bot</span></div>
              <div class="cr-stat"><b data-field="stat2">374k</b><span data-field="stat2Label">lines of code merged after a bot review</span></div>
              <div class="cr-stat"><b data-field="stat3">300+</b><span data-field="stat3Label">hours of review time saved, a low estimate</span></div>
            </div>
          </div>
        </div>
        <div class="cr-foot"><img src="../_brand/logo-massive.svg" alt="Massive" /></div>
      </div>
    </div>
    <script src="../_code-reviews/data.js"></script>
    <script src="../_code-reviews/charts.js"></script>
    <script>
      window.onFields = () => {
        codeReviews.fitTitle(document.querySelector(".cr-title"));
        const svg = document.querySelector(".cr-chart svg");
        codeReviews.cumulative(svg);
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
