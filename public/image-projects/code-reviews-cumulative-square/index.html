<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Cumulative code reviews: humans and the review bot</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- Layout and chart drawing are shared by the code-reviews-* images: ../_code-reviews/ (the .cr-square rules). -->
    <link rel="stylesheet" href="../_code-reviews/charts.css" />
  </head>
  <body>
    <div id="canvas" class="cr-square">
      <img class="m-bg-dark" src="../_code-reviews/bg-glow.jpg" alt="" />
      <div class="cr-stack">
        <div class="cr-chart">
          <svg aria-label="Cumulative code reviews: humans and the review bot"></svg>
          <div class="cr-text">
            <div class="cr-title" data-field="headline">Cumulative code reviews: humans and the review bot</div>
            <div class="cr-stats cr-stats-box" data-field-show="showStats">
              <div class="cr-stat"><b data-field="stat1">371</b> <span data-field="stat1Label">PRs reviewed by the bot</span></div>
              <div class="cr-stat"><b data-field="stat2">374k</b> <span data-field="stat2Label">lines of code merged after bot review</span></div>
              <div class="cr-stat"><b data-field="stat3">≈326</b> <span data-field="stat3Label">hours of review time saved (conservative)</span></div>
            </div>
          </div>
        </div>
        <div class="cr-foot"><img src="../_brand/logo-massive.svg" alt="Massive" /></div>
      </div>
    </div>
    <script src="../_code-reviews/data.js"></script>
    <script src="../_code-reviews/charts.js"></script>
    <script>
      window.onFields = () => {
        codeReviews.fitTitle(document.querySelector(".cr-title"), 4);
        const svg = document.querySelector(".cr-chart svg");
        codeReviews.cumulative(svg, { stacked: true });
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
