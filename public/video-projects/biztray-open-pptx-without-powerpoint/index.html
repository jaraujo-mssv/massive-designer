<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>How to open a PPTX file without PowerPoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/frame-kit.js"></script>
    <script src="js/tray-data.js"></script>
    <script src="js/tray-kit.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #pptx-ground {
        position: absolute;
        inset: 0;
        background: #000;
      }
      /* ScriptVideo's top-and-tail: the whole picture fades up over the first
         8 frames and out over the last 8, to black. */
      #pptx-toptail {
        position: absolute;
        inset: 0;
        z-index: 100;
        background: #000;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="biztray-open-pptx-without-powerpoint"
      data-start="0"
      data-duration="149.766667"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="pptx-ground" class="clip" data-start="0" data-duration="149.766667" data-track-index="0"></div>
      <div id="pptx-01-scene" class="clip scene"
        data-composition-id="pptx-01-scene" data-composition-src="compositions/01-scene.html"
        data-start="0" data-duration="17.933333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pptx-02-contrast" class="clip scene"
        data-composition-id="pptx-02-contrast" data-composition-src="compositions/02-contrast.html"
        data-start="17.933333" data-duration="17.033333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pptx-03-mechanism" class="clip scene"
        data-composition-id="pptx-03-mechanism" data-composition-src="compositions/03-mechanism.html"
        data-start="34.966667" data-duration="21.033333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pptx-04-app-input" class="clip scene"
        data-composition-id="pptx-04-app-input" data-composition-src="compositions/04-app-input.html"
        data-start="56" data-duration="12.233333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pptx-05-app-options" class="clip scene"
        data-composition-id="pptx-05-app-options" data-composition-src="compositions/05-app-options.html"
        data-start="68.233333" data-duration="27.883333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pptx-06-app-run" class="clip scene"
        data-composition-id="pptx-06-app-run" data-composition-src="compositions/06-app-run.html"
        data-start="96.116667" data-duration="4.383333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pptx-07-app-done" class="clip scene"
        data-composition-id="pptx-07-app-done" data-composition-src="compositions/07-app-done.html"
        data-start="100.5" data-duration="7.366667" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pptx-08-caveat" class="clip scene"
        data-composition-id="pptx-08-caveat" data-composition-src="compositions/08-caveat.html"
        data-start="107.866667" data-duration="28.95" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pptx-09-logo" class="clip scene"
        data-composition-id="pptx-09-logo" data-composition-src="compositions/09-logo.html"
        data-start="136.816667" data-duration="12.95" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pptx-toptail" data-layout-allow-overlap></div>
      <!-- One continuous take from frame 0, as ScriptVideo plays it: no lead-in offset.
           The 0.05s ramp is ScriptVideo's 3-frame click guard. -->
      <audio
        id="pptx-voice"
        src="assets/voice/take-da762723.mp3"
        data-start="0"
        data-duration="148.56"
        data-track-index="2"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.05,"v":1}]}]}'
      ></audio>
    </div>
    <script>
      (function () {
        const { interpolate, CLAMP, drive } = FrameKit;
        const FRAMES = 8986;
        const cover = document.getElementById("pptx-toptail");
        const tl = gsap.timeline({ paused: true });
        drive(tl, 60, FRAMES, (f) => {
          const fade = interpolate(f, [0, 8, FRAMES - 8, FRAMES - 1], [0, 1, 1, 0], CLAMP);
          cover.style.opacity = String(1 - fade);
        });
        window.__timelines["biztray-open-pptx-without-powerpoint"] = tl;
      })();
    </script>
  </body>
</html>
