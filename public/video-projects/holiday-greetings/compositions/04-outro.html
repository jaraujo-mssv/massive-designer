<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: Outfit, sans-serif;
        }
        #root .row {
          position: absolute;
          left: 0;
          right: 0;
          top: 842px;
          display: flex;
          align-items: baseline;
          justify-content: center;
          gap: 28px;
        }
        /* Wordmark caps fill the SVG's full height, so a cap-height image on the text baseline matches the
           text (Outfit caps are 0.7em: 46px × 0.7). */
        #root .row img {
          height: 32px;
        }
        #root .sep {
          align-self: center;
          width: 3px;
          height: 44px;
          border-radius: 2px;
          background: rgba(250, 244, 236, 0.55);
        }
        #root .hello {
          font-size: 46px;
          font-weight: 800;
          letter-spacing: -0.03em;
          color: #faf4ec;
          white-space: nowrap;
        }
        #root .hello .who {
          color: #ff8163;
        }
        [data-holiday="rosh-hashanah"] .only-hanukkah,
        [data-holiday="hanukkah"] .only-rh {
          display: none;
        }
        #root .src {
          position: absolute;
          left: 0;
          top: 0;
          opacity: 0;
          pointer-events: none;
        }
      </style>
      <div id="root" data-holiday="hanukkah" data-composition-id="hg-outro" data-width="1920" data-height="1080" data-duration="4.5">
        <div class="src" data-var-text="holiday" data-layout-allow-overlap>hanukkah</div>
        <div class="row">
          <img class="logo" src="assets/brand/logo-massive.svg" alt="Massive" />
          <div class="sep"></div>
          <div class="hello"><span class="only-hanukkah">Happy <span class="who">Hanukkah</span> from all of us!</span><span class="only-rh"><span class="who">Shana Tova</span> from all of us!</span></div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="hg-outro"]');
          const q = (s) => root.querySelector(s);
          const src = q(".src");
          // `root` is the host clip; the inlined #root carries data-holiday too. Keep both in step.
          const setHoliday = (v) => {
            for (const el of [root, ...root.querySelectorAll("[data-holiday]")]) if (el.dataset.holiday !== v) el.dataset.holiday = v;
          };
          const tl = gsap.timeline({ paused: true });
          // Bindings land after this script runs, so re-read the holiday on every update.
          tl.to({}, { duration: 4.5, onUpdate: () => setHoliday(src.textContent.trim()) }, 0);
          tl.fromTo(q(".logo"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.1);
          tl.fromTo(q(".sep"), { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power2.out" }, 0.25);
          tl.fromTo(q(".hello"), { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.3);
          window.__timelines["hg-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
