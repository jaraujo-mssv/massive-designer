<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Prague Crawl 2027: tickets on sale</title>
    <link rel="stylesheet" href="../_prague-crawl/prague-crawl.css" />
    <style>
      #canvas {
        width: 1080px;
        height: 1350px;
      }
    </style>
  </head>
  <body>
    <div id="canvas" class="pc-poster">
      <img class="pc-photo" data-field-src="photo" src="../_prague-crawl/photo-room.jpg" alt="" />
      <div class="pc-shade"></div>
      <div class="pc-title">
        <div class="pc-eyebrow" data-field="eyebrow">Tickets on sale</div>
        <div class="pc-h" data-field="headline">Get your ticket</div>
      </div>
      <div class="pc-cta para"><span data-field="theme">One day of talks and demos on agentic infrastructure and AI.</span> Get yours at <b data-field="link">praguecrawl.com</b></div>
      <div class="pc-foot">
        <span><b data-field="date">May 13, 2027</b> · <span data-field="venue">Spojka Events, Prague</span></span>
        <img class="pc-mark" src="../_prague-crawl/wordmark-footer.png" alt="Prague Crawl 2027" />
      </div>
    </div>
    <script src="../_prague-crawl/prague-crawl.js"></script>
    <script>
      window.onFields = () => {
        pcCrop(document.querySelector(".pc-photo"));
        pcPlaceholders();
        pcFit(document.querySelector(".pc-title .pc-h"), 100, 64);
        pcFit(document.querySelector(".pc-cta"), 40, 30, 116);
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
