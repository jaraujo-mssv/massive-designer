<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: Outfit, sans-serif;
          color: #faf4ec;
        }
        /* Slack profile window × character sheet. Centred: 1120×620 at (400, 190). */
        #root .card {
          position: absolute;
          left: 400px;
          top: 190px;
          width: 1120px;
          height: 620px;
          border-radius: 20px;
          background: #1a1d21;
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(215, 73, 57, 0.12);
          overflow: hidden;
        }
        #root .chrome {
          height: 58px;
          display: flex;
          align-items: center;
          padding: 0 24px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
          font-size: 20px;
          font-weight: 700;
        }
        #root .chrome .actions {
          margin-left: auto;
          display: flex;
          gap: 18px;
          color: rgba(250, 244, 236, 0.55);
        }
        #root svg.ic {
          width: 22px;
          height: 22px;
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #root .body {
          display: flex;
          gap: 48px;
          padding: 40px 48px;
        }
        /* Left: portrait */
        #root .left {
          width: 280px;
          flex-shrink: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #root .portrait {
          position: relative;
          width: 248px;
          height: 248px;
        }
        /* Rotating gradient ring, clipped to a rounded frame around the photo. */
        #root .ring-frame {
          position: absolute;
          inset: -8px;
          border-radius: 30px;
          overflow: hidden;
          box-shadow: 0 0 40px rgba(215, 73, 57, 0.35);
        }
        #root .ring {
          position: absolute;
          left: -50%;
          top: -50%;
          width: 200%;
          height: 200%;
          background: conic-gradient(from 0deg, #d74939, #ff8163, rgba(215, 73, 57, 0.1), #d74939);
        }
        #root .photo {
          position: absolute;
          inset: 0;
          width: 248px;
          height: 248px;
          object-fit: cover;
          border-radius: 24px;
          border: 4px solid #1a1d21;
        }
        #root .badge {
          position: absolute;
          left: 50%;
          bottom: -18px;
          margin-left: -104px;
          width: 208px;
          text-align: center;
          padding: 8px 0;
          border-radius: 999px;
          background: #b8321f;
          font-family: "JetBrains Mono", monospace;
          font-size: 15px;
          font-weight: 700;
          letter-spacing: 0.08em;
          box-shadow: 0 8px 24px rgba(215, 73, 57, 0.45);
        }
        #root .status {
          margin-top: 42px;
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 19px;
          color: rgba(250, 244, 236, 0.75);
        }
        #root .online {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #2bac76;
          box-shadow: 0 0 0 4px rgba(43, 172, 118, 0.22);
        }
        /* Right: identity + stats */
        #root .right {
          flex: 1;
          min-width: 0;
        }
        #root .right .eyebrow {
          color: #ff8163;
        }
        #root .name {
          margin-top: 10px;
          font-size: 64px;
          font-weight: 900;
          line-height: 1.2;
          padding-bottom: 4px;
          letter-spacing: -0.035em;
          white-space: nowrap;
        }
        #root .meta {
          margin-top: 18px;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 12px 22px;
          font-size: 21px;
        }
        #root .class-tag {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 6px 14px 6px 8px;
          border-radius: 10px;
          background: rgba(215, 73, 57, 0.14);
          border: 1px solid rgba(215, 73, 57, 0.45);
          color: #ff8163;
          font-weight: 600;
          white-space: nowrap;
        }
        #root .k {
          font-family: "JetBrains Mono", monospace;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 0.1em;
          color: rgba(250, 244, 236, 0.5);
        }
        #root .class-tag .k {
          padding: 3px 7px;
          border-radius: 6px;
          background: #b8321f;
          color: #fff;
        }
        #root .loc {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          min-width: 0;
          max-width: 100%;
          color: rgba(250, 244, 236, 0.75);
          white-space: nowrap;
        }
        #root .loc span {
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #root .divider {
          margin: 26px 0 22px;
          height: 1px;
          background: rgba(255, 255, 255, 0.1);
          transform-origin: left center;
        }
        #root .stat {
          display: grid;
          grid-template-columns: 44px 138px 1fr;
          align-items: center;
          gap: 14px;
          min-height: 58px;
        }
        #root .stat .tile {
          width: 44px;
          height: 44px;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(215, 73, 57, 0.14);
          color: #ff8163;
        }
        #root .stat .v {
          font-size: 24px;
          font-weight: 500;
          color: #faf4ec;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #root .chips {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
        }
        #root .chip {
          padding: 7px 14px;
          border-radius: 999px;
          background: rgba(250, 244, 236, 0.07);
          border: 1px solid rgba(250, 244, 236, 0.18);
          font-size: 20px;
          font-weight: 500;
          white-space: nowrap;
        }
        #root .chip.empty {
          display: none;
        }
        #root .xp {
          margin-top: 18px;
          display: grid;
          grid-template-columns: 196px 1fr 64px;
          align-items: center;
          gap: 14px;
        }
        #root .track {
          height: 12px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.08);
          overflow: hidden;
        }
        #root .fill {
          height: 100%;
          border-radius: 999px;
          background: linear-gradient(90deg, #d74939, #ff8163);
          transform-origin: left center;
        }
        #root .num {
          font-family: "JetBrains Mono", monospace;
          font-size: 18px;
          font-weight: 700;
          color: #ff8163;
          text-align: right;
        }
        #root .src {
          position: absolute;
          left: 0;
          top: 0;
          opacity: 0;
          white-space: pre;
          pointer-events: none;
        }
      </style>
      <div id="root" data-composition-id="wm-card" data-width="1920" data-height="1080" data-duration="8.1">
        <div class="src" data-var-text="hobbies" data-layout-allow-overlap>Playing football
Playing golf
Gardening</div>
        <div class="card" data-layout-allow-occlusion>
          <div class="chrome">
            <span>Profile</span>
            <span class="actions">
              <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /><circle cx="5" cy="12" r="1" /></svg>
              <svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
            </span>
          </div>
          <div class="body">
            <div class="left">
              <div class="portrait">
                <div class="ring-frame"><div class="ring" data-layout-allow-overflow></div></div>
                <img class="photo" data-var-src="photo" src="assets/template/franklin.jpg" alt="" />
                <div class="badge">LVL 1 · NEW HIRE</div>
              </div>
              <div class="status"><span class="online"></span>Active · Joined today</div>
            </div>
            <div class="right">
              <div class="m-eyebrow eyebrow">New teammate</div>
              <div class="name" data-var-text="fullName">Franklin Uche</div>
              <div class="meta">
                <span class="class-tag"><span class="k">CLASS</span><span data-var-text="role">Community Lead</span></span>
                <span class="loc">
                  <svg class="ic" viewBox="0 0 24 24"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></svg>
                  <span data-var-text="location">Lagos, Nigeria</span>
                </span>
              </div>
              <div class="divider"></div>
              <div class="stat abilities">
                <div class="tile"><svg class="ic" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" /><path d="M20 3v4" /><path d="M22 5h-4" /><path d="M4 17v2" /><path d="M5 18H3" /></svg></div>
                <span class="k">ABILITIES</span>
                <div class="chips">
                  <span class="chip"></span><span class="chip"></span><span class="chip"></span><span class="chip"></span><span class="chip"></span>
                </div>
              </div>
              <div class="stat fuel">
                <div class="tile"><svg class="ic" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" /><path d="M7 2v20" /><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" /></svg></div>
                <span class="k">FUEL</span>
                <div class="v" data-var-text="food">Medium rare steak and rice</div>
              </div>
              <div class="stat fan">
                <div class="tile"><svg class="ic" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></svg></div>
                <span class="k">HUGE FAN OF</span>
                <div class="v" data-var-text="fanOf">Liverpool FC</div>
              </div>
              <div class="xp">
                <span class="k">ONBOARDING XP</span>
                <div class="track"><div class="fill"></div></div>
                <span class="num">0</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="wm-card"]');
          const q = (s) => root.querySelector(s);
          const qa = (s) => [...root.querySelectorAll(s)];
          const src = q(".src");
          const chips = qa(".chip");
          const num = q(".num");
          const name = q(".name");

          // Hobbies arrive as one variable ("one per line"; commas also work). Variable
          // bindings land after this script runs, so re-read the bound source on every update.
          let last = null;
          const syncHobbies = () => {
            const raw = src.textContent;
            if (raw === last) return;
            last = raw;
            const lines = raw.includes("\n") ? raw.split("\n") : raw.split(",");
            const items = lines.map((s) => s.trim()).filter(Boolean).slice(0, chips.length);
            chips.forEach((el, i) => {
              el.textContent = items[i] ?? "";
              el.classList.toggle("empty", !items[i]);
            });
          };
          syncHobbies();

          // Long names shrink to fit the ~690px column by character count (Outfit 900
          // averages ~0.56em per glyph), down to 36px; past that they wrap to two lines.
          // Estimated rather than measured: timeline callbacks must not read layout.
          let fittedFor = null;
          const fitName = () => {
            const text = name.textContent.trim();
            if (text === fittedFor) return;
            fittedFor = text;
            const est = (px) => text.length * 0.56 * px;
            const size = Math.max(36, Math.min(64, Math.floor(690 / (text.length * 0.56))));
            name.style.fontSize = `${size}px`;
            name.style.whiteSpace = est(size) > 690 ? "normal" : "nowrap";
            name.style.lineHeight = est(size) > 690 ? "1.05" : "1.2";
          };
          const sync = () => {
            syncHobbies();
            fitName();
          };

          const tl = gsap.timeline({ paused: true });
          tl.to({}, { duration: 8.1, onUpdate: sync }, 0);

          // Open from the notification: the banner hands off from the top right.
          const card = q(".card");
          tl.fromTo(card, { x: 652, y: -390, scale: 0.5 }, { x: 0, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.15)" }, 0);
          tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);

          // Portrait.
          tl.fromTo(q(".portrait"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.7);
          tl.fromTo(q(".ring"), { rotation: 0 }, { rotation: 180, duration: 7.4, ease: "none" }, 0.7);
          tl.fromTo(q(".badge"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0.95);
          tl.fromTo(q(".status"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.2);

          // Identity.
          const rise = (sel, t) => tl.fromTo(q(sel), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
          rise(".eyebrow", 0.85);
          rise(".name", 1.0);
          rise(".class-tag", 1.2);
          rise(".loc", 1.35);
          tl.fromTo(q(".divider"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 1.5);

          // Stats, character-sheet style.
          rise(".abilities", 1.7);
          chips.forEach((el, i) =>
            tl.fromTo(el, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, 1.85 + i * 0.22),
          );
          rise(".fuel", 2.9);
          rise(".fan", 3.3);

          // XP bar fills and counts up.
          rise(".xp", 3.7);
          const xp = { v: 0 };
          tl.fromTo(q(".fill"), { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.inOut" }, 3.8);
          tl.fromTo(
            xp,
            { v: 0 },
            { v: 100, duration: 1.2, ease: "power2.inOut", onUpdate: () => (num.textContent = String(Math.round(xp.v))) },
            3.8,
          );

          // Settle for the outro.
          tl.to(card, { y: -24, duration: 0.6, ease: "power2.inOut" }, 6.6);

          window.__timelines["wm-card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
