<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>JigsawStack · A ledger of every vendor incident.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/loop-kit.js"></script>
    <script src="lib/scenes.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <link rel="stylesheet" href="lib/massive.css" />
    <link rel="stylesheet" href="lib/scenes.css" />
    <style>
      /* No background on html, body or #stage: the GIF capture makes them transparent. */
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      .state {
        position: absolute;
        left: 58px;
        top: 18px;
        font-size: 21px;
        font-weight: 700;
      }
      .legend {
        position: absolute;
        right: 46px;
        top: 22px;
        font-size: 16px;
        color: rgba(23, 22, 21, 0.72);
      }
      .comp {
        position: absolute;
        left: 30px;
        font-size: 20px;
        font-weight: 600;
      }
      .chip {
        position: absolute;
        z-index: 4;
        padding: 6px 14px;
        border-radius: 10px;
        background: var(--m-ink);
        color: #ffffff;
        font-size: 17px;
      }
      .ledger .sc-head {
        position: absolute;
        left: 30px;
        top: 16px;
        white-space: nowrap;
      }
      .ledger .sc-head .path {
        margin-left: 8px;
        font-size: 16px;
        font-weight: 500;
        color: rgba(23, 22, 21, 0.76);
      }
      .cols {
        position: absolute;
        top: 58px;
        left: 0;
        right: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(23, 22, 21, 0.7);
      }
      .cols span,
      .inc span {
        position: absolute;
      }
      .inc {
        position: absolute;
        left: 0;
        right: 0;
        height: 44px;
        border-top: 2px solid rgba(23, 22, 21, 0.08);
        font-size: 18px;
      }
      .inc span {
        top: 10px;
      }
      .inc .d {
        color: rgba(23, 22, 21, 0.72);
      }
      .inc .st {
        top: 7px;
        padding: 2px 10px;
        border-radius: 8px;
        border: 2px solid rgba(23, 22, 21, 0.25);
        font-size: 15px;
        font-weight: 700;
      }
      .inc .st.open {
        border-color: var(--m-paper-red-light);
        background: var(--m-paper-red-light);
      }
    </style>
  </head>
  <body>
    <!-- Archive machines, JigsawStack. Every day JigsawStack's AI scraper (jigsawstack.com/docs/api-reference/ai/scrape)
         reads a vendor's status history through Massive (byo_proxy), pulling title, date and status from prompts; your
         code appends new incidents to a dated ledger. The status page and incidents are mock content. -->
    <div id="stage" data-composition-id="gif-archive-jigsawstack" data-start="0" data-duration="4" data-fps="15" data-width="1080" data-height="1350">
      <div class="m-ground soft-orange"></div>
      <div class="m-linegrid"></div>
    </div>
    <script>
      (() => {
        const { clamp, ease, lerp, wave } = LoopKit;
        const { div, el, svg } = Scenes;
        const stage = document.getElementById("stage");
        const INK = "#171615";
        const RED = "#d54635";
        Scenes.frame(stage, {
          title: "A ledger of every<br />vendor incident.",
          why: "Status pages forget. Keep your own record for SLA claims.",
          stack: [
            { icon: "assets/brand/partner-app.png", name: "JigsawStack", role: "Scraping from a prompt" },
            { icon: "assets/brand/massive-app.png", name: "Massive", role: "Residential IPs, 195+ countries" },
            { icon: "code", name: "Your agent", role: "Ledger, alerts" },
          ],
        });

        // The vendor's status page: three components, a strip of daily uptime bars each, today on the right.
        const win = Scenes.browser(stage, { x: 80, y: 412, w: 920, h: 330, url: "status.example.com/history", via: true });
        const top = svg(win.body, 920, 284);
        const dot = el("circle", { cx: 40, cy: 32, r: 9, fill: INK }, top);
        const state = div("state", win.body, "Investigating: API errors");
        div("legend", win.body, "Older ← → Today");
        const COMPS = ["API", "Dashboard", "Webhooks"];
        const BARS = 30, BW = 16, BG = 6, BX = 220;
        const today = COMPS.map((name, r) => {
          const y = 72 + r * 66;
          div("comp", win.body, name).style.top = `${y + 6}px`;
          for (let i = 0; i < BARS - 1; i++) {
            el("rect", { x: BX + i * (BW + BG), y, width: BW, height: 38, rx: 3, fill: "rgba(23, 22, 21, 0.16)" }, top);
          }
          return el("rect", { x: BX + (BARS - 1) * (BW + BG), y, width: BW, height: 38, rx: 3, fill: INK }, top);
        });
        const BAR0 = { x: 80 + BX + (BARS - 1) * (BW + BG), y: 412 + 46 + 72 };

        // Your ledger: newest on top. Rows are fixed; inserting the new one pushes the rest down a slot.
        const ledger = Scenes.card(stage, { x: 80, y: 762, w: 920, h: 228 });
        ledger.classList.add("ledger");
        div("sc-head", ledger, 'Your ledger<span class="path"><code>incidents/vendor.json</code> · append-only</span>');
        const COLS = { title: 30, date: 600, status: 740 };
        div("cols", ledger, `<span style="left:${COLS.title}px">Title</span><span style="left:${COLS.date}px">Date</span><span style="left:${COLS.status}px">Status</span>`);
        const ROWS = [
          ["API errors in the EU region", "today", "Investigating", true],
          ["Webhook delivery delays", "−3 d", "Resolved"],
          ["Dashboard login issues", "−9 d", "Resolved"],
          ["Scheduled maintenance", "−14 d", "Completed"],
        ].map(([t, d, s, open]) => {
          const row = div("inc", ledger);
          row.innerHTML = `<span style="left:${COLS.title}px">${t}</span><span class="d" style="left:${COLS.date}px">${d}</span>` +
            `<span class="st${open ? " open" : ""}" style="left:${COLS.status}px">${s}</span>`;
          return row;
        });
        const RY = 84, RH = 44;

        // The three prompts fly from today's red bar to the new row.
        const chips = [["title", COLS.title], ["date", COLS.date], ["status", COLS.status]].map(([name, x]) => {
          const c = div("chip", stage, `<code>${name}</code>`);
          return { c, to: { x: 80 + x, y: 762 + RY + 4 } };
        });

        Scenes.code(stage, {
          x: 80, y: 1010, w: 920, h: 176, title: 'Request <code>/v1/ai/scrape</code>',
          lines: [
            '{"url": "status.example.com/history",',
            ' "element_prompts": ["title", "date", "status"],',
            ' "byo_proxy": {"server": <span class="c">"http://network.joinmassive.com:65534"</span>,',
            '               "auth": {...}}}',
          ],
        });

        // Frame 0: the incident is open and logged. 0.2–0.28 rewinds to a calm day; at 0.5 the API bar turns red,
        // the prompts fly down and the new row slides in by 0.84.
        const at = (p, a, b) => clamp((p - a) / (b - a));
        function render(p) {
          const incident = p < 0.22 || p >= 0.5;
          const label = p < 0.24 || p >= 0.52;
          state.textContent = label ? "Investigating: API errors" : "All systems operational";
          dot.setAttribute("fill", label ? RED : INK);
          today.forEach((b, i) => {
            const red = i === 0 && incident;
            b.setAttribute("fill", red ? RED : INK);
            b.setAttribute("opacity", red ? 1 : 0.45 + 0.55 * wave(p, 4, 0.5));
          });

          chips.forEach(({ c, to }, i) => {
            const f = at(p, 0.56 + i * 0.03, 0.68 + i * 0.03);
            const v = ease.inOut(f);
            Object.assign(c.style, {
              left: `${lerp(BAR0.x - 20, to.x, v)}px`,
              top: `${lerp(BAR0.y, to.y, v)}px`,
              opacity: f > 0 && f < 1 ? 1 : 0,
            });
          });

          // The older rows make room first, then the new one fades into the top slot (and the reverse at the reset).
          const shift = p < 0.28 ? 1 - ease.inOut(at(p, 0.24, 0.28)) : ease.inOut(at(p, 0.72, 0.8));
          const fresh = p < 0.28 ? 1 - at(p, 0.2, 0.24) : at(p, 0.79, 0.85);
          ROWS.forEach((row, i) => {
            const slot = i === 0 ? 0 : i - 1 + shift;
            row.style.top = `${RY + slot * RH}px`;
            const o = i === 0 ? fresh : 1 - clamp(slot - 2);
            row.style.opacity = o;
            row.style.visibility = o > 0.01 ? "visible" : "hidden";
          });
        }

        const tl = gsap.timeline({ paused: true });
        LoopKit.drive(tl, stage, render);
        window.__timelines["gif-archive-jigsawstack"] = tl;
      })();
    </script>
  </body>
</html>
