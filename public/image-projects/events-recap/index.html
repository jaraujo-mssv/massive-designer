<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Event recap</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- One of the event cards (events-meet-us, -speaker, -sf-dinner, -recap, -webinar), which share the corner
         brackets, the eyebrow, the labels and the footer logo. -->
    <style>
      #canvas {
        width: 1080px;
        height: 1350px;
      }

      /* ---- Event-card family ---- */
      .br {
        position: absolute;
        width: 44px;
        height: 44px;
        border: 0 solid var(--m-red);
      }
      .br.tl {
        left: 52px;
        top: 52px;
        border-top-width: 3px;
        border-left-width: 3px;
      }
      .br.tr {
        right: 52px;
        top: 52px;
        border-top-width: 3px;
        border-right-width: 3px;
      }
      .br.bl {
        left: 52px;
        bottom: 52px;
        border-bottom-width: 3px;
        border-left-width: 3px;
      }
      .br.bR {
        right: 52px;
        bottom: 52px;
        border-bottom-width: 3px;
        border-right-width: 3px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-red);
        white-space: nowrap;
      }
      .eyebrow::before {
        content: "";
        flex: none;
        width: 24px;
        height: 2px;
        background: var(--m-red);
      }
      .foot {
        position: absolute;
        left: 80px;
        bottom: 116px;
        height: 32px;
      }

      /* ---- This card ---- */
      .page {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 136px;
        bottom: 200px;
        display: flex;
        flex-direction: column;
      }
      /* Three photos: one wide on top, two below. They take whatever height the text leaves. */
      .photos {
        flex: 1;
        min-height: 0;
        margin-top: 36px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1.35fr 1fr;
        gap: 16px;
      }
      .photos img {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: cover;
        border-radius: 20px;
        background: var(--m-card);
      }
      .photos img:first-child {
        grid-column: 1 / -1;
      }
      /* Fitted to two lines in onFields. */
      .headline {
        margin-top: 48px;
        font-size: 120px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.045em;
        padding-bottom: 6px;
      }
      .takeaway {
        margin-top: 20px;
        font-size: 38px;
        font-weight: 400;
        line-height: 1.3;
        color: var(--m-cream-mid);
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div class="m-dotgrid"></div>
      <div class="br tl"></div>
      <div class="br tr"></div>
      <div class="br bl"></div>
      <div class="br bR"></div>

      <div class="page">
        <div class="eyebrow"><span data-field="event">Prague Crawl 2026 · May 20, 2026</span></div>
        <div class="photos">
          <img data-field-src="photo1" src="../_prague-crawl/photo-room.jpg" alt="" />
          <img data-field-src="photo2" src="../_prague-crawl/photo-stage.jpg" alt="" />
          <img data-field-src="photo3" src="../_prague-crawl/photo-networking.jpg" alt="" />
        </div>
        <div class="headline" data-field="headline">Thank you, Prague</div>
        <div class="takeaway" data-field="takeaway">250+ attendees. 17 talks, demos and a panel.</div>
      </div>

      <img class="foot" src="../_brand/logo-massive.svg" alt="Massive" />
    </div>

    <script src="../_lib/placeholders.js"></script>
    <script>
      // Shrink an element's font size from `from` until it fits its width and, when given, `lines` lines.
      const fit = (el, from, min, lines = null) => {
        const cs = getComputedStyle(el);
        const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
        const over = () =>
          el.scrollWidth > el.clientWidth + 1 ||
          (lines !== null &&
            Math.round((el.getBoundingClientRect().height - pad) / parseFloat(getComputedStyle(el).lineHeight)) > lines);
        let size = from;
        el.style.fontSize = `${size}px`;
        while (size > min && over()) {
          size -= 2;
          el.style.fontSize = `${size}px`;
        }
      };

      // Where to crop each ready-made Prague Crawl photo: in the wide top frame and in the two frames below.
      // Uploads and links are centred a little above the middle.
      const CROPS = {
        "photo-room.jpg": ["50% 62%", "50% 60%"],
        "photo-stage.jpg": ["50% 34%", "50% 40%"],
        "photo-speaker.jpg": ["58% 40%", "62% 45%"],
        "photo-panel.jpg": ["45% 48%", "30% 50%"],
        "photo-networking.jpg": ["50% 28%", "45% 35%"],
        "photo-phone.jpg": ["50% 30%", "50% 30%"],
      };

      window.onFields = () => {
        massivePlaceholders();
        document.querySelectorAll(".photos img").forEach((img, i) => {
          const file = (img.getAttribute("src") ?? "").split("/").pop();
          img.style.objectPosition = CROPS[file]?.[i === 0 ? 0 : 1] ?? "50% 40%";
        });
        fit(document.querySelector(".eyebrow"), 24, 18);
        fit(document.querySelector(".headline"), 120, 64, 2);
        fit(document.querySelector(".takeaway"), 38, 28, 2);
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
