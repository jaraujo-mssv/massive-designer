<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>01 · Keep every version of a terms page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/loop-kit.js"></script>
    <script src="lib/machine-kit.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <link rel="stylesheet" href="lib/massive.css" />
    <link rel="stylesheet" href="lib/machine.css" />
    <style>
      /* No background on html, body or #stage: the GIF capture makes them transparent. */
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Archive machines 01/12 (Massive × Lightpanda). Commands checked against
         lightpanda.io/docs/reference/cli/fetch and /common-options on 2026-10-26. -->
    <div id="stage" data-composition-id="gif-archive-01-terms" data-start="0" data-duration="3" data-fps="15" data-width="1080" data-height="1350">
      <div class="m-ground soft-orange"></div>
      <div class="m-linegrid"></div>
    </div>
    <script>
      (() => {
        const stage = document.getElementById("stage");
        const render = MachineKit.build(stage, {
          title: "Keep every version<br />of a terms page.",
          why: "Terms change quietly. A daily diff shows exactly what moved.",
          stack: [
            { icon: "assets/brand/partner-app.png", name: "Lightpanda", role: "Browser for AI agents" },
            { icon: "assets/brand/massive-app.png", name: "Massive", role: "Residential IPs, 195+ countries" },
            { icon: "code", name: "Your agent", role: "Schedule, diff, storage" },
          ],
          room: "proxy",
          stations: [
            { kind: "clock", label: "Schedule", value: "Every day, 06:00 UTC<br /><code>0 6 * * *</code>" },
            {
              kind: "terminal",
              lines: [
                '<span class="c">$</span> lightpanda fetch --dump markdown \\',
                '  --http-proxy <span class="c">"$MASSIVE_PROXY"</span> \\',
                "  https://example.com/terms \\",
                "  > terms/$(date +%F).md",
              ],
            },
            { kind: "engine", label: "Lightpanda", value: "Runs the page's JavaScript, hands back Markdown" },
            { kind: "network", label: "Massive", value: "The request goes out from a residential IP" },
            { kind: "diff", label: "Your diff", value: "<code>git diff --word-diff</code><br />against yesterday" },
            { kind: "alert", label: "Notify", value: "A webhook when the wording changes" },
          ],
          archive: {
            label: "<code>terms/&lt;date&gt;.md</code>",
            note: "one dated copy a day",
            card: "doc",
            slots: ["today", "−1 d", "−2 d", "−3 d", "−4 d"],
          },
        });

        const tl = gsap.timeline({ paused: true });
        LoopKit.drive(tl, stage, render);
        window.__timelines["gif-archive-01-terms"] = tl;
      })();
    </script>
  </body>
</html>
