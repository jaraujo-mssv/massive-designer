<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Webinar</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- One of the event cards (events-meet-us, -speaker, -sf-dinner, -recap, -webinar), which share the corner
         brackets, the eyebrow, the labels and the footer logo. The landscape one: 100px sides, BRAND.md's 1920 sizes. -->
    <style>
      #canvas {
        width: 1920px;
        height: 1080px;
      }

      /* ---- Event-card family ---- */
      .br {
        position: absolute;
        width: 44px;
        height: 44px;
        border: 0 solid var(--m-red);
      }
      .br.tl {
        left: 52px;
        top: 52px;
        border-top-width: 3px;
        border-left-width: 3px;
      }
      .br.tr {
        right: 52px;
        top: 52px;
        border-top-width: 3px;
        border-right-width: 3px;
      }
      .br.bl {
        left: 52px;
        bottom: 52px;
        border-bottom-width: 3px;
        border-left-width: 3px;
      }
      .br.bR {
        right: 52px;
        bottom: 52px;
        border-bottom-width: 3px;
        border-right-width: 3px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-red);
        white-space: nowrap;
      }
      .eyebrow::before {
        content: "";
        flex: none;
        width: 24px;
        height: 2px;
        background: var(--m-red);
      }
      .label {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-cream-dim);
      }
      .value {
        margin-top: 14px;
        font-size: 36px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .foot {
        position: absolute;
        left: 100px;
        bottom: 116px;
        height: 32px;
      }

      /* ---- This card ---- */
      .page {
        position: absolute;
        left: 100px;
        right: 100px;
        top: 136px;
        bottom: 212px;
        display: flex;
        gap: 96px;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      /* Fitted to three lines in onFields. */
      .title {
        margin-top: 36px;
        font-size: 148px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.045em;
        padding-bottom: 8px;
      }
      .details {
        margin-top: auto;
        padding-top: 48px;
        display: grid;
        grid-template-columns: minmax(0, 0.7fr) minmax(0, 1.1fr) minmax(0, 1.2fr);
        gap: 56px;
      }
      /* The speaker, beside the title: the photo's top lines up with the title's capitals and the role with the
         details' last line. */
      .speaker {
        flex: none;
        width: 500px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .speaker img {
        display: block;
        width: 500px;
        height: 500px;
        border-radius: 20px;
        object-fit: cover;
        object-position: 50% 30%;
        background: var(--m-card);
      }
      .speaker .name {
        margin-top: 32px;
        font-size: 48px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.025em;
        white-space: nowrap;
      }
      .speaker .role {
        margin-top: 6px;
        font-size: 30px;
        font-weight: 400;
        line-height: 1.3;
        color: var(--m-cream-mid);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div class="m-dotgrid"></div>
      <div class="br tl"></div>
      <div class="br tr"></div>
      <div class="br bl"></div>
      <div class="br bR"></div>

      <div class="page">
        <div class="main">
          <div class="eyebrow"><span data-field="eyebrow">Webinar</span></div>
          <div class="title" data-field="title">Is robots.txt legally binding?</div>
          <div class="details">
            <div>
              <div class="label">Date</div>
              <div class="value fit"><span data-field="date">[Date]</span></div>
            </div>
            <div>
              <div class="label">Time</div>
              <div class="value fit"><span data-field="time">[Time and time zone]</span></div>
            </div>
            <div>
              <div class="label">Register</div>
              <div class="value fit"><span data-field="register">[Registration link]</span></div>
            </div>
          </div>
        </div>
        <div class="speaker">
          <img data-field-src="photo" src="assets/franklin.jpg" alt="" />
          <div class="name" data-field="name">Franklin Uche</div>
          <div class="role" data-field="role">Community Lead</div>
        </div>
      </div>

      <img class="foot" src="../_brand/logo-massive.svg" alt="Massive" />
    </div>

    <script src="../_lib/placeholders.js"></script>
    <script>
      // Shrink an element's font size from `from` until it fits its width and, when given, `lines` lines.
      const fit = (el, from, min, lines = null) => {
        const cs = getComputedStyle(el);
        const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
        const over = () =>
          el.scrollWidth > el.clientWidth + 1 ||
          (lines !== null &&
            Math.round((el.getBoundingClientRect().height - pad) / parseFloat(getComputedStyle(el).lineHeight)) > lines);
        let size = from;
        el.style.fontSize = `${size}px`;
        while (size > min && over()) {
          size -= 2;
          el.style.fontSize = `${size}px`;
        }
      };

      window.onFields = () => {
        massivePlaceholders();
        fit(document.querySelector(".title"), 148, 72, 3);
        // The details share one size: each fits its column, then all take the smallest.
        const values = [...document.querySelectorAll(".value.fit")];
        values.forEach((el) => fit(el, 36, 26, 2));
        const size = Math.min(...values.map((el) => parseFloat(el.style.fontSize)));
        values.forEach((el) => (el.style.fontSize = `${size}px`));
        fit(document.querySelector(".speaker .name"), 48, 30);
        fit(document.querySelector(".speaker .role"), 30, 22);
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
