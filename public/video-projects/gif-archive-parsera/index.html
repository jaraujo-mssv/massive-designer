<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Parsera · Every public tender, the day it's posted.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/loop-kit.js"></script>
    <script src="lib/scenes.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <link rel="stylesheet" href="lib/massive.css" />
    <link rel="stylesheet" href="lib/scenes.css" />
    <style>
      /* No background on html, body or #stage: the GIF capture makes them transparent. */
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
      }
      .sheet {
        position: absolute;
        top: 18px;
        width: 280px;
        height: 230px;
        padding: 18px 18px;
        border-radius: 12px;
        border: 2px solid rgba(23, 22, 21, 0.14);
        background: #ffffff;
      }
      .sheet .f {
        display: block;
        margin-bottom: 8px;
      }
      .sheet .f span {
        position: relative;
        display: inline-block;
      }
      .sheet .f b {
        position: relative; /* painted after the highlight that sits under it */
        font-weight: inherit;
      }
      .sheet .t {
        min-height: 52px;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.3;
      }
      .sheet .k {
        font-size: 16px;
        color: rgba(23, 22, 21, 0.76);
      }
      .sheet .hl {
        position: absolute;
        left: -4px;
        top: 1px;
        bottom: 1px;
        border-radius: 4px;
        background: var(--m-paper-red-light);
        opacity: 0.5;
      }
      .sheet .tick {
        position: absolute;
        right: 14px;
        top: 10px;
        font-size: 22px;
        font-weight: 800;
        color: var(--m-paper-red);
      }
      .sheet .bars {
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 18px;
      }
      .sheet .bars i {
        display: block;
        height: 8px;
        margin-top: 8px;
        border-radius: 4px;
        background: rgba(23, 22, 21, 0.12);
      }
      .lit {
        position: absolute;
        inset: -2px;
        border-radius: 12px;
        border: 3px solid var(--m-paper-red);
        opacity: 0;
      }
      .csv .sc-head {
        position: absolute;
        left: 22px;
        top: 16px;
        white-space: nowrap;
      }
      .csv .sc-head .path {
        margin-left: 8px;
        font-size: 16px;
        font-weight: 500;
        color: rgba(23, 22, 21, 0.76);
      }
      .csv .line {
        position: absolute;
        left: 22px;
        font-size: 16px;
        white-space: pre;
      }
      .csv .line.head {
        color: rgba(23, 22, 21, 0.72);
      }
      .pkt {
        position: absolute;
        z-index: 4;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        background: var(--m-paper-red);
      }
    </style>
  </head>
  <body>
    <!-- Archive machines, Parsera. Every morning the open-source Parsera library (docs.parsera.org/features/proxy)
         loads a public tenders page through Massive (proxy_settings) and has an LLM read each notice into title,
         deadline and agency; your code appends new ones to a dated CSV. The notices are mock content. -->
    <div id="stage" data-composition-id="gif-archive-parsera" data-start="0" data-duration="4" data-fps="15" data-width="1080" data-height="1350">
      <div class="m-ground soft-orange"></div>
      <div class="m-linegrid"></div>
    </div>
    <script>
      (() => {
        const { clamp, ease, lerp } = LoopKit;
        const { div } = Scenes;
        const stage = document.getElementById("stage");
        Scenes.frame(stage, {
          title: "Every public tender,<br />the day it's posted.",
          why: "Notices come and go. Keep a dated row for each one.",
          stack: [
            { icon: "assets/brand/partner-app.png", name: "Parsera", role: "LLM scraping library" },
            { icon: "assets/brand/massive-app.png", name: "Massive", role: "Residential IPs, 195+ countries" },
            { icon: "code", name: "Your agent", role: "Schedule, CSV" },
          ],
        });

        // Today's notices on the tenders portal, fetched through Massive.
        const NOTICES = [
          ["School roof repairs", "next Monday", "Education Board"],
          ["Road resurfacing, North district", "end of the month", "City Roads Dept."],
          ["Library IT equipment", "in two weeks", "Public Libraries"],
        ];
        const win = Scenes.browser(stage, { x: 80, y: 412, w: 920, h: 314, url: "tenders.example.gov/notices", via: true });
        const sheets = NOTICES.map(([t, d, a], k) => {
          const sh = div("sheet", win.body);
          sh.style.left = `${20 + k * 300}px`;
          const field = (cls, html) => div(`f ${cls}`, sh, `<span><i class="hl"></i><b>${html}</b></span>`).querySelector(".hl");
          const hls = [field("t", t), field("k", `Deadline: ${d}`), field("k", `Agency: ${a}`)];
          div("bars", sh, '<i style="width:92%"></i><i style="width:64%"></i>');
          return { hls, tick: div("tick", sh, "✓"), lit: div("lit", sh) };
        });

        // The file it grows: one CSV line per notice.
        const csv = Scenes.card(stage, { x: 80, y: 746, w: 920, h: 196 });
        csv.classList.add("csv");
        div("sc-head", csv, 'Your table<span class="path"><code>tenders.csv</code> · one dated row per notice</span>');
        div("line head", csv, "<code>title,deadline,agency</code>").style.top = "60px";
        const rows = NOTICES.map(([t, d, a], k) => {
          const line = div("line", csv, `<code>"${t}","${d}","${a}"</code>`);
          line.style.top = `${92 + k * 30}px`;
          return line;
        });

        Scenes.code(stage, {
          x: 80, y: 962, w: 920, h: 176, title: "Parsera",
          lines: [
            'proxy = {"server": <span class="c">MASSIVE_URL</span>, ...}',
            "rows = scraper.run(",
            "  url=TENDERS, elements=FIELDS,",
            "  proxy_settings=proxy)",
          ],
        });

        // Three packets, one per field, carry a notice down to its CSV line, which then types in.
        const packets = [0, 1, 2].map(() => div("pkt", stage));
        const COL_X = [40, 380, 600];

        // Frame 0: all three notices read and filed. 0.1–0.14 starts a new morning; each notice then gets a
        // highlighter pass (title, deadline, agency), its fields fly to the CSV, and its line appears.
        const WALK = [0.14, 0.9];
        const STEP = (WALK[1] - WALK[0]) / NOTICES.length;
        const at = (x, a, b) => clamp((x - a) / (b - a));
        function render(p) {
          const resetting = p >= 0.1 && p < WALK[0];
          const k = p >= WALK[0] && p < WALK[1] ? Math.floor((p - WALK[0]) / STEP) : -1;
          const u = k >= 0 ? ((p - WALK[0]) % STEP) / STEP : 0;
          const doneUpTo = p < 0.1 || p >= WALK[1] ? NOTICES.length : resetting ? 0 : k + (u >= 0.82 ? 1 : 0);

          sheets.forEach((sh, i) => {
            // Highlights stay on once read; a new morning clears them.
            sh.hls.forEach((hl, f) => {
              let w;
              if (p < 0.1 || p >= WALK[1]) w = 1;
              else if (resetting) w = 1 - at(p, 0.1, 0.13);
              else if (i < k) w = 1;
              else if (i > k) w = 0;
              else w = ease.out(at(u, f * 0.15, f * 0.15 + 0.14));
              hl.style.width = `calc((100% + 8px) * ${w.toFixed(3)})`;
            });
            sh.tick.style.opacity = i < doneUpTo ? 1 : 0;
            sh.lit.style.opacity = i === k ? 1 - at(u, 0.82, 0.95) : 0;
          });
          rows.forEach((r, i) => {
            const t = i < k || (k < 0 && i < doneUpTo) ? 1 : i === k ? ease.out(at(u, 0.74, 0.92)) : 0;
            r.style.clipPath = `inset(-4px ${((1 - t) * 100).toFixed(1)}% -4px -4px)`;
            r.style.visibility = t > 0 ? "visible" : "hidden";
          });

          // Packets fall from the notice to its CSV line.
          packets.forEach((c, f) => {
            const fu = k >= 0 ? at(u, 0.48 + f * 0.04, 0.72 + f * 0.04) : 0;
            if (fu <= 0 || fu >= 1) {
              c.style.opacity = 0;
              return;
            }
            const v = ease.inOut(fu);
            const from = { x: 80 + 20 + k * 300 + 70 + f * 70, y: 412 + 46 + 18 + 232 };
            const to = { x: 80 + COL_X[f], y: 746 + 92 + k * 30 + 6 };
            Object.assign(c.style, { left: `${lerp(from.x, to.x, v)}px`, top: `${lerp(from.y, to.y, v)}px`, opacity: 1 });
          });
        }

        const tl = gsap.timeline({ paused: true });
        LoopKit.drive(tl, stage, render);
        window.__timelines["gif-archive-parsera"] = tl;
      })();
    </script>
  </body>
</html>
