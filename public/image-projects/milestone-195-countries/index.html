<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>195+ countries</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <style>
      /* The "195+ countries. One API." GIF (video-projects/gif-195-countries) at phase 0, its still: the dotted world
         map, every arc and destination dot drawn, the hub pill, the headline. The moving packets and arrival rings
         are left out, and so is the hub's "→ BR" (it names the packet in flight). The eyebrow is raised from 14px. */
      #canvas {
        width: 1080px;
        height: 1350px;
      }
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 70% 40% at 50% 92%, rgba(215, 73, 57, 0.2), transparent 70%);
      }
      .copy {
        position: absolute;
        z-index: 1;
        left: 80px;
        right: 80px;
        top: 96px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-red);
        white-space: nowrap;
      }
      .eyebrow::before {
        content: "";
        flex-shrink: 0;
        width: 24px;
        height: 2px;
        background: var(--m-red);
      }
      h1 {
        margin-top: 30px;
        font-size: 120px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      h1 .num {
        color: var(--m-red);
      }
      .copy p {
        margin-top: 30px;
        max-width: 820px;
        font-size: 34px;
        line-height: 1.3;
        color: var(--m-cream-mid);
        text-wrap: balance;
      }
      #map {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1350px;
      }
      .hub {
        position: absolute;
        left: 50%;
        top: 1172px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        height: 48px;
        padding: 0 24px;
        border-radius: 24px;
        background: var(--m-red);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-cream);
        white-space: nowrap;
      }
      .foot {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .foot img {
        display: block;
        height: 22px;
      }
      .foot span {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--m-cream-dim);
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div class="glow"></div>
      <div class="copy">
        <div class="eyebrow" data-field="eyebrow">Real-time web access for AI</div>
        <h1><span class="num" data-field="number">195+</span> <span data-field="headline">countries. One API.</span></h1>
        <p data-field="paragraph">Every market your AI needs to reach, through a single endpoint.</p>
      </div>
      <canvas id="map" width="2160" height="2700"></canvas>
      <div class="hub" data-field="hub">One API</div>
      <div class="foot">
        <img src="../_brand/logo-massive.svg" alt="Massive" />
        <span>joinmassive.com</span>
      </div>
    </div>
    <script src="../_lib/world-paths.js"></script>
    <script src="../_lib/placeholders.js"></script>
    <script>
      // The GIF's static layer, drawn once at 2×: dotted land, faint arcs from the hub, the destination dots.
      // Same map box, dot step, targets and arcs as the GIF; nothing random, so every render matches.
      (() => {
        const MAP = { x: 60, y: 520, w: 960 };
        const S = MAP.w / WORLD_MAP.w;
        MAP.h = WORLD_MAP.h * S;
        const HUB = { x: 540, y: 1172 };
        const TARGETS = ["BR", "DE", "JP", "US", "IN", "ZA", "GB", "AU", "MX", "KR", "FR", "NG", "CA", "ID", "AR", "ES"];

        const mask = document.createElement("canvas");
        mask.width = Math.ceil(MAP.w);
        mask.height = Math.ceil(MAP.h);
        const mctx = mask.getContext("2d", { willReadFrequently: true });
        mctx.setTransform(S, 0, 0, S, 0, 0);
        const paths = Object.fromEntries(WORLD_PATHS.map(([iso, d]) => [iso, new Path2D(d)]));

        function centre(iso) {
          mctx.clearRect(0, 0, WORLD_MAP.w, WORLD_MAP.h);
          mctx.fill(paths[iso]);
          const { data, width, height } = mctx.getImageData(0, 0, mask.width, mask.height);
          let sx = 0, sy = 0, n = 0;
          for (let y = 0; y < height; y += 2) {
            for (let x = 0; x < width; x += 2) {
              if (data[(y * width + x) * 4 + 3] > 127) {
                sx += x;
                sy += y;
                n++;
              }
            }
          }
          return { x: MAP.x + sx / n, y: MAP.y + sy / n };
        }
        const nodes = TARGETS.map((iso) => ({ iso, ...centre(iso) }));
        // The US centre leans towards Alaska; pull it back over the mainland (as the GIF does).
        const us = nodes.find((n) => n.iso === "US");
        us.x += 34;
        us.y += 22;

        mctx.clearRect(0, 0, WORLD_MAP.w, WORLD_MAP.h);
        for (const p of Object.values(paths)) mctx.fill(p);
        const land = mctx.getImageData(0, 0, mask.width, mask.height);
        const isLand = (x, y) => {
          const px = Math.round(x), py = Math.round(y);
          return px >= 0 && py >= 0 && px < land.width && py < land.height && land.data[(py * land.width + px) * 4 + 3] > 127;
        };

        const TAU = Math.PI * 2;
        const map = document.getElementById("map").getContext("2d");
        map.setTransform(2, 0, 0, 2, 0, 0);
        const STEP = 11;
        map.fillStyle = "rgba(250, 244, 236, 0.2)";
        for (let row = 0, y = STEP / 2; y < MAP.h; row++, y += STEP * 0.866) {
          for (let x = (row % 2) * (STEP / 2) + STEP / 2; x < MAP.w; x += STEP) {
            if (!isLand(x, y)) continue;
            map.beginPath();
            map.arc(MAP.x + x, MAP.y + y, 2.6, 0, TAU);
            map.fill();
          }
        }
        map.strokeStyle = "rgba(255, 129, 99, 0.16)";
        map.lineWidth = 1.5;
        for (const n of nodes) {
          const lift = 90 + 0.25 * Math.abs(n.x - HUB.x);
          map.beginPath();
          map.moveTo(HUB.x, HUB.y);
          map.quadraticCurveTo((HUB.x + n.x) / 2, Math.min(HUB.y, n.y) - lift, n.x, n.y);
          map.stroke();
        }
        map.fillStyle = "#d74939";
        for (const n of nodes) {
          map.beginPath();
          map.arc(n.x, n.y, 5, 0, TAU);
          map.fill();
        }
      })();

      window.onFields = () => {
        massivePlaceholders();
        // A longer headline or paragraph steps down so the copy stays clear of the map's top (y 520).
        const h1 = document.querySelector("h1");
        const p = document.querySelector(".copy p");
        h1.style.fontSize = "120px";
        p.style.fontSize = "34px";
        const copy = document.querySelector(".copy");
        for (let size = 120; size >= 72 && copy.offsetTop + copy.offsetHeight > 520; size -= 4) h1.style.fontSize = `${size}px`;
        for (let size = 34; size >= 26 && copy.offsetTop + copy.offsetHeight > 520; size -= 2) p.style.fontSize = `${size}px`;
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
