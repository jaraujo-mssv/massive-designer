<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: Outfit, sans-serif;
          color: #faf4ec;
        }
        /* Line grid: 90px cells (12 × 15 on 1080 × 1350), drawn in line by line by the script. */
        #root .grid i {
          position: absolute;
          display: block;
          background: rgba(250, 244, 236, 0.1);
        }
        #root .grid .h {
          left: 0;
          width: 1080px;
          height: 1px;
          transform-origin: left center;
        }
        #root .grid .v {
          top: 0;
          width: 1px;
          height: 1350px;
          transform-origin: center top;
        }
        /* Soft vignette so the grid falls off toward the edges. */
        #root .vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 75% 65% at 50% 45%, rgba(10, 10, 15, 0) 40%, rgba(10, 10, 15, 0.85) 100%);
        }
        #root .glow {
          position: absolute;
          left: 30px;
          top: 30px;
          width: 900px;
          height: 900px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(215, 73, 57, 0.4) 0%, rgba(215, 73, 57, 0.12) 40%, rgba(215, 73, 57, 0) 68%);
          opacity: 0;
        }
        /* Corner brackets: 44px arms, 3px thick, 52px from each corner. */
        #root .br {
          position: absolute;
          width: 44px;
          height: 44px;
          border: 0 solid #d74939;
        }
        #root .br.tl {
          left: 52px;
          top: 52px;
          border-top-width: 3px;
          border-left-width: 3px;
          transform-origin: left top;
        }
        #root .br.tr {
          right: 52px;
          top: 52px;
          border-top-width: 3px;
          border-right-width: 3px;
          transform-origin: right top;
        }
        #root .br.bl {
          left: 52px;
          bottom: 52px;
          border-bottom-width: 3px;
          border-left-width: 3px;
          transform-origin: left bottom;
        }
        #root .br.brr {
          right: 52px;
          bottom: 52px;
          border-bottom-width: 3px;
          border-right-width: 3px;
          transform-origin: right bottom;
        }
        #root .eyebrow {
          position: absolute;
          left: 80px;
          top: 128px;
          display: flex;
          align-items: center;
          gap: 18px;
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: rgba(250, 244, 236, 0.75);
        }
        #root .eyebrow img {
          width: 44px;
          height: 44px;
        }
        /* The stat: 15,000 over "followers". Scales down and lifts for the thank-you. */
        #root .stat {
          position: absolute;
          left: 80px;
          top: 340px;
          width: 920px;
          transform-origin: left top;
        }
        #root .num {
          font-size: 280px;
          font-weight: 900;
          line-height: 0.86;
          letter-spacing: -0.05em;
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
          padding-bottom: 10px;
        }
        #root .word {
          margin-top: 44px;
          font-size: 120px;
          font-weight: 700;
          line-height: 1.05;
          letter-spacing: -0.04em;
          color: #ff8163;
          white-space: nowrap;
          padding-bottom: 8px;
        }
        #root .thanks {
          position: absolute;
          left: 80px;
          top: 540px;
          font-size: 156px;
          font-weight: 900;
          line-height: 1.05;
          letter-spacing: -0.045em;
          white-space: nowrap;
          padding-bottom: 12px;
        }
        #root .sub {
          position: absolute;
          left: 84px;
          top: 728px;
          font-size: 58px;
          font-weight: 300;
          line-height: 1.15;
          letter-spacing: -0.02em;
          color: rgba(250, 244, 236, 0.75);
          white-space: nowrap;
        }
        #root .rule-foot {
          position: absolute;
          left: 80px;
          top: 1060px;
          width: 920px;
          height: 1px;
          background: rgba(250, 244, 236, 0.16);
          transform-origin: left center;
        }
        #root .who {
          position: absolute;
          left: 80px;
          top: 1110px;
          display: flex;
          align-items: center;
          gap: 30px;
        }
        #root .who .photo {
          width: 140px;
          height: 140px;
          border-radius: 50%;
          object-fit: cover;
          border: 5px solid #0a0a0f;
          box-shadow: 0 0 0 3px #d74939, 0 0 40px rgba(215, 73, 57, 0.35);
        }
        #root .who .name {
          font-size: 54px;
          font-weight: 800;
          line-height: 1.1;
          letter-spacing: -0.03em;
          white-space: nowrap;
        }
        #root .who .role {
          margin-top: 6px;
          font-family: "JetBrains Mono", monospace;
          font-size: 20px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: rgba(250, 244, 236, 0.55);
          white-space: nowrap;
        }
        #root .logo {
          position: absolute;
          right: 80px;
          top: 1160px;
          height: 40px;
        }
        /* Confetti: pieces are placed by the script from a seeded PRNG. */
        #root .confetti {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        #root .confetti i {
          position: absolute;
          left: 0;
          top: 0;
          display: block;
          opacity: 0;
        }
      </style>
      <div id="root" data-composition-id="jg-celebrate" data-width="1080" data-height="1350" data-duration="11">
        <div class="grid" data-layout-allow-overlap data-layout-allow-occlusion></div>
        <div class="vignette" data-layout-allow-occlusion></div>
        <div class="glow" data-layout-allow-overflow data-layout-allow-occlusion></div>
        <div class="br tl"></div>
        <div class="br tr"></div>
        <div class="br bl"></div>
        <div class="br brr"></div>

        <div class="eyebrow">
          <img src="assets/template/linkedin.svg" alt="LinkedIn" />
          <span>LinkedIn milestone</span>
        </div>

        <div class="stat">
          <div class="num" data-layout-allow-overflow>0</div>
          <div class="word">followers</div>
        </div>

        <div class="thanks">Thank you.</div>
        <div class="sub">for following along.</div>

        <div class="rule-foot"></div>
        <div class="who">
          <img class="photo" src="assets/template/jason.jpg" alt="Jason Grad" />
          <div>
            <div class="name">Jason Grad</div>
            <div class="role">CEO, Massive</div>
          </div>
        </div>
        <img class="logo" src="assets/brand/icon-massive.svg" alt="Massive" />

        <div class="confetti" data-layout-allow-overlap data-layout-allow-occlusion data-layout-allow-overflow></div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="jg-celebrate"]');
          const q = (s) => root.querySelector(s);
          const qa = (s) => [...root.querySelectorAll(s)];
          const DUR = 9;
          const BURST = 3.2; // count lands, confetti fires
          const THANKS = 4.6;

          // Grid lines.
          const grid = q(".grid");
          const hLines = [];
          const vLines = [];
          for (let y = 90; y < 1350; y += 90) {
            const el = document.createElement("i");
            el.className = "h";
            el.style.top = `${y}px`;
            grid.appendChild(el);
            hLines.push(el);
          }
          for (let x = 90; x < 1080; x += 90) {
            const el = document.createElement("i");
            el.className = "v";
            el.style.left = `${x}px`;
            grid.appendChild(el);
            vLines.push(el);
          }

          // Confetti: two cannons from the bottom corners, placed in closed form from the burst's local
          // time so any seek lands on the same frame.
          const FALL = 5.6;
          const layer = q(".confetti");
          let seed = 20261008;
          const rand = () => {
            seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
          const COLORS = ["#d74939", "#ff8163", "#faf4ec", "#f1ead8", "#b8321f"];
          const pieces = Array.from({ length: 150 }, (_, i) => {
            const el = document.createElement("i");
            const kind = rand();
            const w = kind < 0.2 ? 14 : kind < 0.6 ? 11 : 7;
            const h = kind < 0.2 ? 14 : kind < 0.6 ? 18 : 26;
            el.style.width = `${w}px`;
            el.style.height = `${h}px`;
            el.style.borderRadius = kind < 0.2 ? "50%" : "2px";
            el.style.background = COLORS[Math.floor(rand() * COLORS.length)];
            layer.appendChild(el);
            const left = i % 2 === 0;
            // Aim up and in: ~62° above horizontal, ±14°.
            const elev = ((62 + (rand() - 0.5) * 28) * Math.PI) / 180;
            const speed = 1900 + rand() * 1500;
            return {
              el,
              x0: left ? -10 + rand() * 30 : 1090 - rand() * 30,
              y0: 1370 - rand() * 30,
              vx: (left ? 1 : -1) * Math.cos(elev) * speed,
              vy: -Math.sin(elev) * speed,
              r0: rand() * 360,
              vr: (rand() - 0.5) * 900,
              flip: 2 + rand() * 5,
              delay: rand() * 0.14,
            };
          });
          const DRAG = 2.2;
          const G = 900;
          const placeConfetti = (t) => {
            for (const p of pieces) {
              const s = t - BURST - p.delay;
              if (s <= 0 || s > FALL) {
                p.el.style.opacity = "0";
                continue;
              }
              const k = (1 - Math.exp(-DRAG * s)) / DRAG;
              const x = p.x0 + p.vx * k + Math.sin(s * p.flip) * 18;
              const y = p.y0 + p.vy * k + (G / DRAG) * (s - k);
              const r = p.r0 + p.vr * s;
              const sy = Math.cos(s * p.flip * 2);
              p.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${r.toFixed(1)}deg) scaleY(${sy.toFixed(3)})`;
              p.el.style.opacity = String(Math.min(1, s / 0.05, (FALL - s) / 0.8));
            }
          };

          const tl = gsap.timeline({ paused: true });
          tl.to({}, { duration: DUR, onUpdate: () => placeConfetti(tl.time()) }, 0);

          // Ground: grid lines draw in, brackets grow from their corners.
          hLines.forEach((el, i) => tl.fromTo(el, { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, i * 0.025));
          vLines.forEach((el, i) => tl.fromTo(el, { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power2.out" }, 0.05 + i * 0.03));
          qa(".br").forEach((el, i) => tl.fromTo(el, { scale: 0 }, { scale: 1, duration: 0.3, ease: "power2.out" }, 0.1 + i * 0.04));

          // Eyebrow.
          tl.fromTo(q(".eyebrow img"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, 0.25);
          tl.fromTo(q(".eyebrow span:last-child"), { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.45);

          // The count: 0 → 15,000, with "followers" wiping in beneath it.
          const num = q(".num");
          const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
          const count = { v: 0 };
          tl.fromTo(num, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.7);
          tl.fromTo(
            count,
            { v: 0 },
            { v: 15000, duration: BURST - 0.8, ease: "power2.inOut", onUpdate: () => (num.textContent = fmt(Math.round(count.v))) },
            0.8,
          );
          tl.fromTo(q(".word"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.inOut" }, 1.1);

          // Burst: the number pops, a glow blooms behind it, confetti fires (placeConfetti).
          tl.fromTo(num, { scale: 1 }, { scale: 1.08, duration: 0.1, ease: "power2.out", transformOrigin: "left center" }, BURST);
          tl.to(num, { scale: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }, BURST + 0.1);
          tl.fromTo(num, { color: "#faf4ec" }, { color: "#ff8163", duration: 0.08, ease: "none" }, BURST);
          tl.to(num, { color: "#faf4ec", duration: 0.7, ease: "power2.out" }, BURST + 0.25);
          tl.fromTo(q(".glow"), { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, BURST);
          tl.to(q(".glow"), { opacity: 0.35, duration: 1.2, ease: "power2.inOut" }, BURST + 0.6);

          // Thank-you: the stat steps back and up; the line wipes in under it.
          tl.to(q(".stat"), { scale: 0.52, y: -125, duration: 0.7, ease: "power3.inOut" }, THANKS - 0.4);
          tl.to(q(".glow"), { opacity: 0, duration: 0.6, ease: "power2.in" }, THANKS - 0.3);
          tl.fromTo(q(".thanks"), { clipPath: "inset(0 100% 0 0)", x: -10 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.55, ease: "power2.inOut" }, THANKS);
          tl.fromTo(q(".sub"), { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, THANKS + 0.45);

          // Sign-off row.
          tl.fromTo(q(".rule-foot"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 6.3);
          tl.fromTo(q(".who .photo"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, 6.55);
          tl.fromTo(q(".who .name"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.7);
          tl.fromTo(q(".who .role"), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 6.82);
          tl.fromTo(q(".logo"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 7.0);

          window.__timelines["jg-celebrate"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
