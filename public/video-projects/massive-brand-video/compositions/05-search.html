<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
        #root .pill {
          position: absolute;
          top: 96px;
          left: 100px;
          z-index: 2;
        }
        #root .split {
          display: flex;
          width: 100%;
          height: 100%;
        }
        #root .left {
          width: 50%;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 60px 0 100px;
        }
        #root .stack {
          display: flex;
          flex-direction: column;
          gap: 30px;
        }
        #root .title {
          color: #faf4ec;
          font-size: 82px;
          font-weight: 900;
          line-height: 1;
          letter-spacing: -0.04em;
        }
        #root .divider {
          height: 2px;
          background-color: #d74939;
          opacity: 0.55;
        }
        #root .bullets {
          display: flex;
          flex-direction: column;
          gap: 22px;
        }
        #root .bullet {
          display: flex;
          align-items: center;
          gap: 20px;
        }
        #root .bullet .dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background-color: #d74939;
          flex-shrink: 0;
        }
        #root .bullet .txt {
          color: rgba(250, 244, 236, 0.55);
          font-size: 36px;
          font-weight: 400;
          line-height: 1.3;
        }
        #root .right {
          width: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .chips {
          position: absolute;
          bottom: 96px;
          left: 100px;
          display: flex;
          gap: 12px;
        }
        #root .chip {
          background-color: #d7493922;
          border: 1px solid #d7493955;
          color: #faf4ec;
          padding: 6px 18px;
          border-radius: 20px;
          font-size: 22px;
          font-weight: 500;
        }
      </style>
      <div id="root" data-composition-id="bv-search" data-width="1920" data-height="1080" data-duration="4">
        <div class="af fill">
          <div class="af dotgrid"></div>
          <div class="af brackets">
            <div class="corner" style="top: 52px; left: 52px"><div class="bw" style="top: 0; left: 0"></div><div class="bh" style="top: 0; left: 0"></div></div>
            <div class="corner" style="top: 52px; right: 52px"><div class="bw" style="top: 0; right: 0"></div><div class="bh" style="top: 0; right: 0"></div></div>
            <div class="corner" style="bottom: 52px; left: 52px"><div class="bw" style="bottom: 0; left: 0"></div><div class="bh" style="bottom: 0; left: 0"></div></div>
            <div class="corner" style="bottom: 52px; right: 52px"><div class="bw" style="bottom: 0; right: 0"></div><div class="bh" style="bottom: 0; right: 0"></div></div>
          </div>
          <div class="pill" data-up="0"><div class="eyebrow"><div class="rule"></div><div class="label">Use Case 02</div></div></div>
          <div class="split">
            <div class="left">
              <div class="stack">
                <div class="title display" data-up="8">Search &amp; GEO</div>
                <div class="divider"></div>
                <div class="bullets">
                  <div class="bullet" data-up="28"><div class="dot"></div><div class="txt display">Monitor visibility across search engines &amp; LLMs</div></div>
                  <div class="bullet" data-up="40"><div class="dot"></div><div class="txt display">Research competitors in results</div></div>
                  <div class="bullet" data-up="52"><div class="dot"></div><div class="txt display">Implement findings to improve presence</div></div>
                </div>
              </div>
            </div>
            <div class="right">
              <svg class="icon" viewBox="0 0 300 300" style="width: 760px; height: 760px">
                <circle class="outer" cx="148" cy="148" r="96" fill="none" stroke="#d74939" stroke-width="2.5" stroke-linecap="round" />
                <circle class="inner" cx="148" cy="148" r="56" fill="none" stroke="#d74939" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
                <circle class="lens" cx="148" cy="148" r="96" fill="#d7493910" />
                <line class="scan" x1="148" y1="148" stroke="#ff8163" stroke-width="2.5" stroke-linecap="round" />
                <circle class="tip" r="6" fill="#ff8163" />
                <line class="handle" x1="222" y1="222" x2="278" y2="278" stroke="#d74939" stroke-width="5" stroke-linecap="round" stroke-dasharray="80" />
              </svg>
            </div>
          </div>
        </div>
      </div>
      <script>
        BrandScene.mount("bv-search", 120, (h) => {
          const { svg, attrs } = FrameKit;
          const rule = h.$(".stack .divider");
          const right = h.$(".right");
          const chips = h.$$(".chip");
          const OUTER = 2 * Math.PI * 96;
          const INNER = 2 * Math.PI * 56;
          const outer = h.$(".icon .outer");
          const inner = h.$(".icon .inner");
          const lens = h.$(".icon .lens");
          const scan = h.$(".icon .scan");
          const tip = h.$(".icon .tip");
          const handle = h.$(".icon .handle");
          outer.setAttribute("stroke-dasharray", OUTER);
          inner.setAttribute("stroke-dasharray", INNER);
          const drawIcon = (f) => {
            const rad = (f * 6 * Math.PI) / 180;
            const scanOp = h.fIn(f, 20, 8);
            outer.setAttribute("stroke-dashoffset", h.interpolate(f, [0, 22], [OUTER, 0], h.CLAMP));
            inner.setAttribute("stroke-dashoffset", h.interpolate(f, [10, 28], [INNER, 0], h.CLAMP));
            lens.setAttribute("opacity", scanOp);
            attrs(scan, { x2: 148 + 96 * Math.cos(rad), y2: 148 + 96 * Math.sin(rad), opacity: scanOp });
            attrs(tip, { cx: 148 + 96 * Math.cos(rad), cy: 148 + 96 * Math.sin(rad), opacity: scanOp });
            attrs(handle, { "stroke-dashoffset": h.interpolate(f, [26, 40], [80, 0], h.CLAMP), opacity: h.fIn(f, 26, 8) });
          };
          return (f) => {
            rule.style.width = `${h.interpolate(f, [10, 30], [0, 720], h.CLAMP)}px`;
            right.style.opacity = h.fIn(f, 4, 12);
            chips.forEach((el, i) => {
              const p = Math.max(0, f - 52 - i * 6);
              el.style.opacity = h.interpolate(p, [0, 8], [0, 1], h.CLAMP);
              el.style.transform = `translateY(${h.interpolate(p, [0, 8], [14, 0], h.CLAMP)}px)`;
            });
            drawIcon(f);
          };
        });
      </script>
    </template>
  </body>
</html>
