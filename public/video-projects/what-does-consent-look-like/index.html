<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>What does consent look like?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/frame-kit.js"></script>
    <script src="js/consent-kit.js"></script>
    <script src="js/taskbar-art.js"></script>
    <script src="js/pc-desktop.js"></script>
    <script src="js/diagram-kit.js"></script>
    <script src="js/consent-steps.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        /* The base the source frames were laid out (and their cursor targets measured) on:
           sparktray's studio page, i.e. Tailwind v4 preflight + studio/styles.css. */
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        /* BrandScope for brand "none": a deliberately unowned steel, read by the pc-* chrome. */
        --brand-accent: #5a6b87;
        --brand-accent-hover: #7c8da8;
        --brand-accent-active: #3d4a5f;
        --brand-accent-rgb: 90 107 135;
        /* `S` in sparktray brand/ui/app/shell.tsx. */
        --s-window-bg: #111117;
        --s-panel: #0a0a0f;
        --s-control: #16161d;
        --s-line: rgba(255, 255, 255, 0.08);
        --s-fg: #ededf2;
        --s-fg-mute: #bcbcca;
        --s-fg-dim: rgba(237, 242, 242, 0.55);
        --s-fg-ghost: rgba(237, 242, 242, 0.28);
        --s-accent: var(--brand-accent);
        --s-accent-text: var(--brand-accent-hover);
        --s-accent-tint: rgb(90 107 135 / 0.16);
        --s-accent-tint-soft: rgb(90 107 135 / 0.12);
        --s-success: #00bb7f;
      }
      #wc-stage-bg {
        position: absolute;
        inset: 0;
        background: #0a0a0f;
      }
      /* The top-and-tail: ScriptVideo fades the whole film up from and down to black over 8 frames. */
      #wc-toptail {
        position: absolute;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        background: #000;
      }

      /* Shared by the scene sub-compositions. */
      .wc .grid-plate {
        /* GridBackground: the Massive "market-map-bg" plate, rebuilt in CSS. */
        position: absolute;
        inset: 0;
        background-color: #0d0b10;
        background-image:
          radial-gradient(ellipse 52% 30% at 50% 104%, rgba(215, 73, 57, 0.29) 0%, rgba(215, 73, 57, 0) 70%),
          repeating-linear-gradient(to right, rgba(179, 179, 179, 0.04) 0 2.77px, transparent 2.77px 101px),
          repeating-linear-gradient(to bottom, rgba(179, 179, 179, 0.04) 0 2.77px, transparent 2.77px 101px);
      }
      .wc .diagram-plate {
        position: absolute;
        inset: 0;
      }
      .wc .diagram-inset {
        position: absolute;
        top: 7%;
        left: 9%;
        right: 9%;
        bottom: 259.2px;
      }
      .wc .diagram-center {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wc .diagram-card {
        height: 100%;
        max-width: 100%;
        background: #121117;
        border: 1px solid #252328;
        border-radius: 10px;
      }
      /* Windows 11 default wallpaper behind the pc-* scenes (js/pc-desktop.js). */
      .wc .pc-wallpaper {
        background-image: url(assets/images/wallpaper.jpg);
        background-size: cover;
        background-position: center;
      }
      /* Diagram labels. Declared here (not only inline) so the compiler bundles the face. */
      .wc .mono {
        font-family: "JetBrains Mono", monospace;
      }
      .wc svg {
        display: block;
        vertical-align: middle;
      }

      /* AppChrome from sparktray brand/ui/pc/screens.tsx: the unbranded "Video Converter"
         window, shared by pc-app (Convert active) and pc-settings (Settings active). */
      .wc .app {
        width: 1040px;
        height: 660px;
        background: var(--s-window-bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 8px;
      }
      .wc .app-title {
        height: 34px;
        background: var(--s-panel);
        display: flex;
        align-items: center;
        padding: 0 6px 0 12px;
        flex-shrink: 0;
      }
      .wc .app-logo {
        width: 15px;
        height: 15px;
        border-radius: 4px;
        background: var(--s-accent);
        margin-right: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wc .app-name {
        font-size: 12px;
        color: var(--s-fg-mute);
        flex: 1;
      }
      .wc .app-winbtn {
        width: 34px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wc .cmdbar {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--s-line);
        flex-shrink: 0;
      }
      .wc .cmd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 13px;
        border-radius: 6px;
        font-size: 13px;
        background: transparent;
        color: var(--s-fg-dim);
      }
      .wc .cmd.primary {
        background: var(--s-accent);
        color: #fff;
      }
      .wc .cmd.active {
        background: var(--s-accent-tint);
        color: var(--s-accent-text);
      }
      .wc .cmd-sep {
        width: 1px;
        height: 26px;
        background: var(--s-line);
        margin: 0 8px;
      }
      .wc .app-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="what-does-consent-look-like"
      data-start="0"
      data-duration="98.9"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="wc-stage-bg" class="clip" data-start="0" data-duration="98.9" data-track-index="0"></div>

      <!-- Beats 1-3 -->
      <div id="wc-pc-app" class="clip scene wc"
        data-composition-id="wc-pc-app" data-composition-src="compositions/01-pc-app.html"
        data-start="0" data-duration="16.85" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Beats 4-5 -->
      <div id="wc-funding-models" class="clip scene wc"
        data-composition-id="wc-funding-models" data-composition-src="compositions/02-funding-models.html"
        data-start="16.85" data-duration="10.85" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Beats 6-9 -->
      <div id="wc-consent-flow" class="clip scene wc"
        data-composition-id="wc-consent-flow" data-composition-src="compositions/03-consent-flow.html"
        data-start="27.7" data-duration="20.55" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Beat 10 -->
      <div id="wc-steps-preview" class="clip scene wc"
        data-composition-id="wc-steps-preview" data-composition-src="compositions/04-steps-preview.html"
        data-start="48.25" data-duration="3.65" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Beats 11-13 -->
      <div id="wc-pc-install" class="clip scene wc"
        data-composition-id="wc-pc-install" data-composition-src="compositions/05-pc-install.html"
        data-start="51.9" data-duration="16.35" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Beat 14 -->
      <div id="wc-pc-settings" class="clip scene wc"
        data-composition-id="wc-pc-settings" data-composition-src="compositions/06-pc-settings.html"
        data-start="68.25" data-duration="4.533333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Beats 15-16 -->
      <div id="wc-pc-uninstall" class="clip scene wc"
        data-composition-id="wc-pc-uninstall" data-composition-src="compositions/07-pc-uninstall.html"
        data-start="72.783333" data-duration="9.083333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Beat 17 -->
      <div id="wc-steps-recap" class="clip scene wc"
        data-composition-id="wc-steps-recap" data-composition-src="compositions/08-steps-recap.html"
        data-start="81.866667" data-duration="6.833333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Beats 18-19 -->
      <div id="wc-consent-settled" class="clip scene wc"
        data-composition-id="wc-consent-settled" data-composition-src="compositions/09-consent-settled.html"
        data-start="88.7" data-duration="7.7" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Silent sign-off, after the beats -->
      <div id="wc-signoff" class="clip scene wc"
        data-composition-id="wc-signoff" data-composition-src="compositions/10-signoff.html"
        data-start="96.4" data-duration="2.5" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="wc-toptail" class="clip" data-start="0" data-duration="98.9" data-track-index="2"></div>

      <!-- One continuous take from frame 0 (no lead-in: beat 1's cue starts at 0). 3-frame ramp so the first sample can't click. -->
      <audio
        id="wc-voice"
        src="assets/voice/take-91a15da5.mp3"
        data-start="0"
        data-duration="95.2"
        data-track-index="10"
        data-volume="1"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.05,"v":1}]}]}'
      ></audio>
      <!-- Music bed at MUSIC_LEVEL 0.07 (-23.1 dB), 1.5 s fades at both ends of the film. 160 s track, so no loop. -->
      <audio
        id="wc-music"
        src="assets/music/calm-lo-fi.mp3"
        data-start="0"
        data-duration="98.9"
        data-track-index="11"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1.5,"v":0.07},{"t":97.383,"v":0.07},{"t":98.883,"v":0}]}]}'
      ></audio>
    </div>
    <script>
      (function () {
        const FPS = 60;
        const FRAMES = 5934;
        const TOPTAIL = 8;
        const veil = document.querySelector("#wc-toptail");
        const tl = gsap.timeline({ paused: true });
        FrameKit.drive(tl, FPS, FRAMES, (f) => {
          const fade = FrameKit.interpolate(f, [0, TOPTAIL, FRAMES - TOPTAIL, FRAMES - 1], [0, 1, 1, 0], FrameKit.CLAMP);
          veil.style.opacity = 1 - fade;
        });
        window.__timelines["what-does-consent-look-like"] = tl;
      })();
    </script>
  </body>
</html>
