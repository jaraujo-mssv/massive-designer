<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Jason 15K: Every dot a follower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/frame-kit.js"></script>
    <script src="js/points.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <link rel="stylesheet" href="lib/massive.css" />
    <style>
      html,
      body {
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #0a0a0f;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        font-family: Outfit, sans-serif;
      }
      #stage-bg {
        position: absolute;
        inset: 0;
        background: #0a0a0f;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="jason-15k-network" data-start="0" data-duration="12" data-fps="60" data-width="1080" data-height="1350">
      <div id="stage-bg" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>

      <div id="jn-network" class="clip scene" style="z-index: 1"
        data-composition-id="jn-network" data-composition-src="compositions/01-network.html"
        data-start="0" data-duration="12" data-track-index="1" data-width="1080" data-height="1350"></div>

      <!-- UI sounds (Pixabay, see assets/template/sfx/CREDITS.md), pre-mixed into one bed from
           assets/template/sfx-15k.cues.json: sparkle as the dots start streaming in (1.6), soft rising pings while the
           portrait forms (2.2–4.6), pop + sparkle on the burst (6.4), four-ping arpeggio as "15K" lands (7.9), chime
           on "Thank you." (8.5). -->
      <audio id="sfx-bed" data-start="0" data-duration="12" data-track-index="10" data-volume="1" src="assets/template/sfx-15k.mp3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["jason-15k-network"] = tl;
    </script>
  </body>
</html>
