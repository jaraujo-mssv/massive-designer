      <script>
        ConsentKit.mount("wc-pc-app", 1011, (h) => {
          const { ease, at } = ConsentKit;
          const desk = PcDesktop.build(h.$(".pc-desktop"), "wc-pc-app");
          // Marks read off the take (PcScene.tsx APP): click the pinned app on "PC." (1.97 s),
          // the window is fully up 0.45 s later, then the pointer rests on the job table.
          const APP = { click: 0.117, open: 0.144, idle: [1420, 700], rest: [280, 407], restAt: 0.273 };
          const RUN_SECONDS = 16.85;
          const stops = [
            { t: 0, at: APP.idle, space: "frame" },
            { t: APP.click, space: "pinned", click: true },
            { t: APP.restAt, at: APP.rest },
          ];
          return (t) => {
            desk.set({ open: ease(at(t, APP.click, APP.open)), cursor: desk.cursorFor(stops, t, RUN_SECONDS) });
          };
        });
      </script>
