<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"firstName","type":"string","label":"First name","default":"Franklin","placeholder":"Used in the notification and outro"},
    {"id":"fullName","type":"string","label":"Name & last name","default":"Franklin Uche"},
    {"id":"location","type":"string","label":"Location (City, Country)","default":"Lagos, Nigeria"},
    {"id":"role","type":"string","label":"Role","default":"Community Lead"},
    {"id":"hobbies","type":"string","label":"Hobbies (one per line, up to 5)","default":"Playing football\nPlaying golf\nGardening"},
    {"id":"food","type":"string","label":"Favorite food","default":"Medium rare steak and rice"},
    {"id":"photo","type":"string","label":"Photo (path in the project or URL)","default":"assets/template/franklin.jpg"},
    {"id":"sfx","type":"string","label":"Sound bed: assets/template/sfx-mix-N.mp3, N = number of hobbies (1-5)","default":"assets/template/sfx-mix-3.mp3"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Welcome to the team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/frame-kit.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <link rel="stylesheet" href="lib/massive.css" />
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: Outfit, sans-serif;
      }
      #stage-bg {
        position: absolute;
        inset: 0;
        background: #0a0a0f;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="welcome-to-massive"
      data-start="0"
      data-duration="15.5"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage-bg" class="clip" data-start="0" data-duration="15.5" data-track-index="0"></div>

      <!-- Scenes: desktop sits under everything; each later beat layers on top. -->
      <div id="wm-desktop" class="clip scene" style="z-index: 1"
        data-composition-id="wm-desktop" data-composition-src="compositions/01-desktop.html"
        data-start="0" data-duration="15.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="wm-notification" class="clip scene" style="z-index: 2"
        data-composition-id="wm-notification" data-composition-src="compositions/02-notification.html"
        data-start="2.3" data-duration="2.7" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="wm-card" class="clip scene" style="z-index: 3"
        data-composition-id="wm-card" data-composition-src="compositions/03-card.html"
        data-start="4.4" data-duration="11.1" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="wm-outro" class="clip scene" style="z-index: 4"
        data-composition-id="wm-outro" data-composition-src="compositions/04-outro.html"
        data-start="11" data-duration="4.5" data-track-index="4" data-width="1920" data-height="1080"></div>

      <!-- UI sounds (Pixabay, see assets/template/sfx/CREDITS.md), pre-mixed into one bed that spans the whole
           video: pop x3 0.7/1.25/1.8, slack-knock 3.05, click-soft 3.95, one ping per hobby chip at 6.25 + i*0.22
           (each 2 semitones higher), sparkle 7.8 (XP bar fill), chime 11. sfx-mix-N.mp3 has N pings; the `sfx`
           variable picks the one matching the hobby count. Separate short clips freeze Firefox previews: the runtime holds the
           clock when a clip ends inside its window (Firefox drops readyState on ended). -->
      <audio id="sfx-bed" data-start="0" data-duration="15.5" data-track-index="10" data-volume="1" data-var-src="sfx" src="assets/template/sfx-mix-3.mp3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["welcome-to-massive"] = tl;
    </script>
  </body>
</html>
