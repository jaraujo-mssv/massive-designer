<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: Outfit, sans-serif;
          color: #faf4ec;
        }
        /* Slack profile window × character sheet. Centred: 1200×506 at (360, 247). */
        #root .card {
          position: absolute;
          left: 360px;
          top: 247px;
          width: 1200px;
          height: 506px;
          border-radius: 20px;
          background: #1a1d21;
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(215, 73, 57, 0.12);
          overflow: hidden;
        }
        /* macOS title bar: traffic lights on the left, no title. */
        #root .chrome {
          height: 44px;
          display: flex;
          align-items: center;
          gap: 9px;
          padding: 0 18px;
          border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        #root .chrome span {
          width: 14px;
          height: 14px;
          border-radius: 50%;
          box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25);
        }
        #root .chrome .close {
          background: #ff5f57;
        }
        #root .chrome .min {
          background: #febc2e;
        }
        #root .chrome .max {
          background: #28c840;
        }
        /* Lucide icons (lucide.dev, ISC). */
        #root svg.ic {
          width: 22px;
          height: 22px;
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #root .body {
          display: flex;
          gap: 40px;
          padding: 40px;
        }
        /* Left: portrait, as tall as the body (382px) with the ring and the badge's overhang. */
        #root .left {
          width: 356px;
          flex-shrink: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        #root .portrait {
          position: relative;
          width: 356px;
          height: 356px;
        }
        /* Rotating gradient ring, clipped to a rounded frame around the photo. */
        #root .ring-frame {
          position: absolute;
          inset: -8px;
          border-radius: 38px;
          overflow: hidden;
          box-shadow: 0 0 40px rgba(215, 73, 57, 0.35);
        }
        #root .ring {
          position: absolute;
          left: -50%;
          top: -50%;
          width: 200%;
          height: 200%;
          background: conic-gradient(from 0deg, #d74939, #ff8163, rgba(215, 73, 57, 0.1), #d74939);
        }
        #root .photo {
          position: absolute;
          inset: 0;
          width: 356px;
          height: 356px;
          object-fit: cover;
          border-radius: 32px;
          border: 4px solid #1a1d21;
        }
        #root .badge {
          position: absolute;
          left: 50%;
          bottom: -18px;
          margin-left: -80px;
          width: 160px;
          text-align: center;
          padding: 8px 0;
          border-radius: 999px;
          background: #b8321f;
          font-family: "JetBrains Mono", monospace;
          font-size: 17px;
          font-weight: 700;
          letter-spacing: 0.08em;
          box-shadow: 0 8px 24px rgba(215, 73, 57, 0.45);
        }
        /* Right: identity + stats */
        #root .right {
          flex: 1;
          min-width: 0;
        }
        #root .name {
          font-size: 64px;
          font-weight: 900;
          line-height: 1.2;
          padding-bottom: 4px;
          letter-spacing: -0.035em;
          white-space: nowrap;
        }
        /* Slack presence: green dot + "Available". */
        #root .presence {
          display: flex;
          align-items: center;
          gap: 10px;
          font-size: 20px;
          font-weight: 500;
          color: rgba(250, 244, 236, 0.75);
        }
        #root .online {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #2bac76;
          box-shadow: 0 0 0 4px rgba(43, 172, 118, 0.22);
        }
        #root .meta {
          margin-top: 20px;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 12px 22px;
          font-size: 21px;
        }
        #root .class-tag {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          padding: 6px 14px 6px 8px;
          border-radius: 10px;
          background: rgba(215, 73, 57, 0.14);
          border: 1px solid rgba(215, 73, 57, 0.45);
          color: #ff8163;
          font-weight: 600;
          white-space: nowrap;
        }
        #root .k {
          font-family: "JetBrains Mono", monospace;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 0.1em;
          color: rgba(250, 244, 236, 0.5);
        }
        #root .class-tag .k {
          padding: 3px 7px;
          border-radius: 6px;
          background: #b8321f;
          color: #fff;
        }
        #root .loc {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          min-width: 0;
          max-width: 100%;
          color: rgba(250, 244, 236, 0.75);
          white-space: nowrap;
        }
        #root .loc span {
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #root .divider {
          margin: 26px 0 22px;
          height: 1px;
          background: rgba(255, 255, 255, 0.1);
          transform-origin: left center;
        }
        #root .stat {
          display: grid;
          grid-template-columns: 44px 138px 1fr;
          align-items: center;
          gap: 14px;
          min-height: 58px;
        }
        #root .stat .tile {
          width: 44px;
          height: 44px;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(215, 73, 57, 0.14);
          color: #ff8163;
        }
        #root .stat .v {
          font-size: 24px;
          font-weight: 500;
          color: #faf4ec;
          white-space: nowrap;
        }
        /* Tenure: the big number counts up from 0. */
        #root .stat.tenure,
        #root .stat.years {
          min-height: 76px;
        }
        #root .tenure .v {
          font-size: 58px;
          font-weight: 800;
          letter-spacing: -0.03em;
          line-height: 1;
        }
        #root .tenure .v .yrs {
          color: #ff8163;
          font-variant-numeric: tabular-nums;
        }
        /* Year pips: one per year (up to 10), numbered, lit left to right. */
        #root .pips {
          display: flex;
          gap: 8px;
        }
        /* Unlit pips are dashed: the last visible one is next year, still to come. */
        #root .pip {
          position: relative;
          width: 44px;
          height: 44px;
          border-radius: 11px;
          border: 1.5px dashed rgba(250, 244, 236, 0.28);
          font-family: "JetBrains Mono", monospace;
          font-size: 16px;
          font-weight: 700;
          color: rgba(250, 244, 236, 0.35);
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .pip.off {
          display: none;
        }
        #root .pip b {
          position: absolute;
          inset: -1.5px;
          border-radius: 11px;
          background: linear-gradient(135deg, #d74939, #ff8163);
          box-shadow: 0 0 18px rgba(215, 73, 57, 0.55);
          color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        /* Achievement toast: drops in above the card. */
        #root .toast-row {
          position: absolute;
          left: 0;
          right: 0;
          top: 112px;
          display: flex;
          justify-content: center;
          pointer-events: none;
        }
        #root .toast {
          display: flex;
          align-items: center;
          gap: 18px;
          padding: 12px 30px 12px 12px;
          border-radius: 999px;
          background: #1a1d21;
          border: 1px solid rgba(215, 73, 57, 0.5);
          box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(215, 73, 57, 0.25);
          opacity: 0;
        }
        #root .toast .medal {
          width: 64px;
          height: 64px;
          border-radius: 50%;
          background: linear-gradient(135deg, #d74939, #ff8163);
          color: #fff;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        #root .toast .medal svg.ic {
          width: 32px;
          height: 32px;
        }
        #root .toast .k {
          color: #ff8163;
        }
        #root .toast .t {
          margin-top: 4px;
          font-size: 28px;
          font-weight: 700;
          white-space: nowrap;
        }
        #root .src {
          position: absolute;
          left: 0;
          top: 0;
          opacity: 0;
          white-space: pre;
          pointer-events: none;
        }
      </style>
      <div id="root" data-composition-id="wa-card" data-width="1920" data-height="1080" data-duration="11.1">
        <div class="src" data-var-text="years" data-layout-allow-overlap>3</div>
        <div class="card" data-layout-allow-occlusion>
          <div class="chrome"><span class="close"></span><span class="min"></span><span class="max"></span></div>
          <div class="body">
            <div class="left">
              <div class="portrait">
                <div class="ring-frame"><div class="ring" data-layout-allow-overflow></div></div>
                <img class="photo" data-var-src="photo" src="assets/template/franklin.jpg" alt="" />
                <div class="badge">ANNIVERSARY</div>
              </div>
            </div>
            <div class="right">
              <div class="name" data-var-text="fullName">Franklin Uche</div>
              <div class="presence"><span class="online"></span>Available</div>
              <div class="meta">
                <span class="class-tag"><span class="k">ROLE</span><span data-var-text="role">Community Lead</span></span>
              </div>
              <div class="divider"></div>
              <div class="stat tenure">
                <div class="tile"><svg class="ic" viewBox="0 0 24 24"><path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978" /><path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978" /><path d="M18 9h1.5a1 1 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z" /><path d="M6 9H4.5a1 1 0 0 1 0-5H6" /></svg></div>
                <span class="k">TIME AT MASSIVE</span>
                <div class="v"><span class="yrs">0</span> <span class="unit">years</span></div>
              </div>
              <div class="stat years">
                <div class="tile"><svg class="ic" viewBox="0 0 24 24"><path d="M8 2v4" /><path d="M16 2v4" /><rect width="18" height="18" x="3" y="4" rx="2" /><path d="M3 10h18" /><path d="m9 16 2 2 4-4" /></svg></div>
                <span class="k">YEARS</span>
                <div class="pips"><span class="pip">1<b>1</b></span><span class="pip">2<b>2</b></span><span class="pip">3<b>3</b></span><span class="pip">4<b>4</b></span><span class="pip">5<b>5</b></span><span class="pip">6<b>6</b></span><span class="pip">7<b>7</b></span><span class="pip">8<b>8</b></span><span class="pip">9<b>9</b></span><span class="pip">10<b>10</b></span></div>
              </div>
            </div>
          </div>
        </div>
        <div class="toast-row">
          <div class="toast">
            <div class="medal"><svg class="ic" viewBox="0 0 24 24"><path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978" /><path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978" /><path d="M18 9h1.5a1 1 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z" /><path d="M6 9H4.5a1 1 0 0 1 0-5H6" /></svg></div>
            <div>
              <div class="k">ACHIEVEMENT UNLOCKED</div>
              <div class="t"><span class="tn">3</span> <span class="unit">years</span> at Massive</div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="wa-card"]');
          const q = (s) => root.querySelector(s);
          const qa = (s) => [...root.querySelectorAll(s)];
          const src = q(".src");
          const name = q(".name");
          const yrs = q(".yrs");
          const units = qa(".unit");
          const pips = qa(".pip");
          const lit = pips.map((p) => p.querySelector("b"));

          // Years arrive as a variable, bound into .src after this script runs, so every update
          // re-reads it. Up to 10 pips show; past 10 the last one reads "10+".
          let years = 3;
          let syncedFor = null;
          const syncYears = () => {
            const raw = src.textContent.trim();
            if (raw === syncedFor) return;
            syncedFor = raw;
            years = Math.max(1, Math.round(Number(raw)) || 1);
            units.forEach((u) => (u.textContent = years === 1 ? "year" : "years"));
            q(".tn").textContent = String(years);
            // Lit pips for the years done, plus a dashed one for next year while there's room.
            pips.forEach((p, i) => p.classList.toggle("off", i >= Math.min(years + 1, 10)));
            const last = years > 10 ? "10+" : "10";
            pips[9].firstChild.textContent = last;
            lit[9].textContent = last;
          };

          // Long names shrink to fit the ~724px column by character count (Outfit 900
          // averages ~0.56em per glyph), down to 36px; past that they wrap to two lines.
          // Estimated rather than measured: timeline callbacks must not read layout.
          let fittedFor = null;
          const fitName = () => {
            const text = name.textContent.trim();
            if (text === fittedFor) return;
            fittedFor = text;
            const est = (px) => text.length * 0.56 * px;
            const size = Math.max(36, Math.min(64, Math.floor(724 / (text.length * 0.56))));
            name.style.fontSize = `${size}px`;
            name.style.whiteSpace = est(size) > 724 ? "normal" : "nowrap";
            name.style.lineHeight = est(size) > 724 ? "1.05" : "1.2";
          };

          // Count-up and pips depend on the years value, so they're placed in closed form from
          // the timeline's time: any seek lands on the same frame.
          const COUNT = [1.8, 0.8]; // start, duration (pop at 7.0 in the sound bed)
          const PIPS = [2.9, 1.2]; // one window for any number of pips (sparkle at 7.3)
          const NEXT = 4.3; // the dashed next-year pip fades in after the lit ones
          const clamp = (v) => Math.min(1, Math.max(0, v));
          const outCubic = (p) => 1 - (1 - p) ** 3;
          const backOut = (p, s = 2.2) => 1 + (s + 1) * (p - 1) ** 3 + s * (p - 1) ** 2;
          const place = (t) => {
            const c = outCubic(clamp((t - COUNT[0]) / COUNT[1]));
            yrs.textContent = String(Math.round(c * years));
            const n = Math.min(years, 10);
            pips.forEach((p, i) => (p.style.opacity = i === years ? String(clamp((t - NEXT) / 0.4)) : "1"));
            lit.forEach((b, i) => {
              if (i >= n) return;
              const p = clamp((t - PIPS[0] - (i * PIPS[1]) / n) / 0.3);
              b.style.opacity = String(clamp(p * 3));
              b.style.transform = `scale(${(0.5 + 0.5 * backOut(p)).toFixed(3)})`;
            });
          };

          const tl = gsap.timeline({ paused: true });
          tl.to(
            {},
            {
              duration: 11.1,
              onUpdate: () => {
                syncYears();
                fitName();
                place(tl.time());
              },
            },
            0,
          );

          // Open from the notification: the banner hands off from the top right.
          const card = q(".card");
          tl.fromTo(card, { x: 652, y: -440, scale: 0.5 }, { x: 0, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.15)" }, 0);
          tl.fromTo(card, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);

          // Portrait.
          tl.fromTo(q(".portrait"), { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.7);
          tl.fromTo(q(".ring"), { rotation: 0 }, { rotation: 253, duration: 10.4, ease: "none" }, 0.7);
          tl.fromTo(q(".badge"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(2)" }, 0.95);

          // Identity.
          const rise = (sel, t) => tl.fromTo(q(sel), { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, t);
          rise(".name", 1.0);
          rise(".presence", 1.1);
          rise(".class-tag", 1.2);
          tl.fromTo(q(".divider"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 1.5);

          // Tenure counts up (place), lands with a bump; then the year pips light (place).
          rise(".tenure", 1.6);
          tl.fromTo(q(".tenure .v"), { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", immediateRender: false }, 2.6);
          tl.to(q(".tenure .v"), { scale: 1, duration: 0.3, ease: "power2.out" }, 2.72);
          rise(".years", 2.6);

          // Achievement toast drops in above the card (arpeggio at 9.0).
          const toast = q(".toast");
          tl.fromTo(toast, { y: -140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.5)" }, 4.6);
          tl.fromTo(q(".toast .medal"), { rotation: -30, scale: 0.6 }, { rotation: 0, scale: 1, duration: 0.6, ease: "back.out(2.4)" }, 4.75);

          // Settle for the outro.
          tl.to(card, { y: -24, duration: 0.6, ease: "power2.inOut" }, 6.6);

          window.__timelines["wa-card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
