                <div class="relrow"><i data-icon="Download" data-size="17" data-color="#a0a0a0" data-sw="2"></i><div class="label">Storage</div><i data-icon="ChevronRight" data-size="15" data-color="#a0a0a0" data-sw="2"></i></div>

      </div>
      <script>
        ConsentKit.mount("wc-pc-uninstall", 545, (h) => {
          const { ease, at, pulse, paceOf } = ConsentKit;
          const desk = PcDesktop.build(h.$(".pc-desktop"), "wc-pc-uninstall");
          // PcScene.tsx UNINSTALL: the overflow opens on "uninstall" (75.04 s), Uninstall is
          // pressed on "Everything" and the row leaves on "goes".
          const U = { dots: 0.249, kill: 0.449, gone: 0.513, collapse: 0.05, idle: [520, 500] };
          const HOT = { dots: [926, 233], uninstall: [866, 349] };
          const RUN_SECONDS = 9.08;
          const APP_ROW_H = 66;
          const pace = paceOf(RUN_SECONDS);
          const stops = [
            { t: 0, at: U.idle },
            { t: U.dots, at: HOT.dots, click: true },
            { t: U.kill, at: HOT.uninstall, click: true },
          ];
          const dots = h.$(".dots");
          const menuEl = h.$(".menu");
          const kill = h.$(".item.kill");
          const count = h.$(".count");
          const wrap = h.$(".rowwrap");
          const collapse = h.$(".collapse");
          return (t) => {
            // Held through the press pulse so the item is seen going down.
            const menu = t >= U.dots && !(t >= U.kill + pace.press);
            const hot = t >= U.kill - pace.travel * 0.35;
            const press = pulse(t, U.kill, pace.press);
            const gone = ease(at(t, U.gone, U.gone + U.collapse));
            dots.style.background = menu ? "#383838" : "transparent";
            menuEl.style.opacity = menu ? 1 : 0;
            kill.style.background = press > 0 ? "#4a4a4a" : hot ? "#383838" : "transparent";
            count.textContent = gone >= 1 ? "0 apps found" : "1 app found";
            wrap.style.marginTop = `${12 * (1 - gone)}px`;
            if (gone > 0) {
              collapse.style.height = `${APP_ROW_H * (1 - gone)}px`;
              collapse.style.opacity = 1 - gone;
              collapse.style.overflow = "hidden";
            } else {
              collapse.style.height = "";
              collapse.style.opacity = "";
              collapse.style.overflow = "";
            }
            desk.set({ open: 1, cursor: desk.cursorFor(stops, t, RUN_SECONDS) });
          };
        });
      </script>
