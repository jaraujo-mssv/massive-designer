<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Why AEO Is the New SEO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/frame-kit.js"></script>
    <script src="js/aeo-slide.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <style>
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #f1ead8;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }
      #stage-bg {
        position: absolute;
        inset: 0;
        background: #f1ead8;
      }

      /* Slide chrome shared by every slide sub-composition. */
      .aeo .chrome {
        background-color: #f1ead8;
        overflow: hidden;
      }
      .aeo .grid {
        background-image:
          linear-gradient(to right, rgba(23, 22, 21, 0.045) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(23, 22, 21, 0.045) 1px, transparent 1px);
        background-size: 60px 60px;
        pointer-events: none;
      }
      .aeo .deco {
        position: absolute;
        opacity: 0.25;
        pointer-events: none;
      }
      .aeo .content {
        padding: 80px;
      }
      .aeo .eyebrow {
        color: #d54635;
        font-family: "JetBrains Mono", monospace;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .aeo .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .aeo .stat {
        transform-origin: left center;
      }
      .aeo .stat span.num {
        color: #d54635;
        font-family: Outfit, sans-serif;
        font-weight: 900;
        line-height: 0.86;
        letter-spacing: -0.05em;
        white-space: nowrap;
        display: inline-block;
      }
      .aeo .headline {
        display: flex;
        flex-wrap: wrap;
        row-gap: 6px;
      }
      .aeo .word {
        font-family: Outfit, sans-serif;
        font-weight: 900;
        line-height: 1.06;
        letter-spacing: -0.035em;
        color: #171615;
        margin-right: 16px;
        display: inline-block;
      }
      .aeo .word.accent {
        color: #d54635;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="why-aeo-is-the-new-seo"
      data-start="0"
      data-duration="18"
      data-fps="60"
      data-width="1080"
      data-height="1080"
    >
      <div id="stage-bg" class="clip" data-start="0" data-duration="18" data-track-index="0"></div>
      <div id="aeo-slide-01" class="clip scene aeo" style="z-index: 1"
        data-composition-id="aeo-slide-01" data-composition-src="compositions/slide-01.html"
        data-start="0" data-duration="4" data-track-index="1" data-width="1080" data-height="1080"></div>
      <div id="aeo-slide-02" class="clip scene aeo" style="z-index: 2"
        data-composition-id="aeo-slide-02" data-composition-src="compositions/slide-02.html"
        data-start="3.5" data-duration="4" data-track-index="2" data-width="1080" data-height="1080"></div>
      <div id="aeo-slide-03" class="clip scene aeo" style="z-index: 3"
        data-composition-id="aeo-slide-03" data-composition-src="compositions/slide-03.html"
        data-start="7" data-duration="4" data-track-index="1" data-width="1080" data-height="1080"></div>
      <div id="aeo-slide-04" class="clip scene aeo" style="z-index: 4"
        data-composition-id="aeo-slide-04" data-composition-src="compositions/slide-04.html"
        data-start="10.5" data-duration="4" data-track-index="2" data-width="1080" data-height="1080"></div>
      <div id="aeo-slide-05" class="clip scene aeo" style="z-index: 5"
        data-composition-id="aeo-slide-05" data-composition-src="compositions/slide-05.html"
        data-start="14" data-duration="4" data-track-index="1" data-width="1080" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["why-aeo-is-the-new-seo"] = tl;
    </script>
  </body>
</html>
