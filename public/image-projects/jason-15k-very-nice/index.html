<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Jason 15K: Very nice</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- A classic two-line meme: photo full bleed, top and bottom captions in Anton (assets/fonts, SIL OFL),
         white with a thick black outline. Captions wrap and stay centred if they're edited longer. -->
    <style>
      @font-face {
        font-family: "Anton";
        src: url("assets/fonts/Anton-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: block;
      }
      #canvas {
        width: 1080px;
        height: 1350px;
        background: #000;
      }
      /* The photo is pre-cropped to 4:5 around the subject (assets/very-nice.jpg); uploads fill from the top. */
      .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 0%;
      }
      .caption {
        position: absolute;
        left: 40px;
        right: 40px;
        text-align: center;
        font-family: "Anton", Impact, sans-serif;
        font-size: 128px;
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: #fff;
        /* Stroke under the fill, so the outline is thick without eating the letters. */
        -webkit-text-stroke: 28px #000;
        paint-order: stroke fill;
        text-shadow: 0 6px 0 #000;
      }
      .top {
        top: 34px;
      }
      .bottom {
        bottom: 46px;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <img class="photo" data-field-src="photo" src="assets/very-nice.jpg" alt="" />
      <div class="caption top" data-field="top">15,000 followers</div>
      <div class="caption bottom" data-field="bottom">very nice!</div>
    </div>
    <script>
      // Hold the first paint until Anton has loaded, so neither export catches the fallback face.
      window.onFields = async () => {
        await document.fonts.load('400 128px "Anton"');
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
