<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Speaker card</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- One of the event cards (events-meet-us, -speaker, -sf-dinner, -recap, -webinar), which share the corner
         brackets, the eyebrow, the labels and the footer logo. -->
    <style>
      #canvas {
        width: 1080px;
        height: 1350px;
      }

      /* ---- Event-card family ---- */
      .br {
        position: absolute;
        width: 44px;
        height: 44px;
        border: 0 solid var(--m-red);
      }
      .br.tl {
        left: 52px;
        top: 52px;
        border-top-width: 3px;
        border-left-width: 3px;
      }
      .br.tr {
        right: 52px;
        top: 52px;
        border-top-width: 3px;
        border-right-width: 3px;
      }
      .br.bl {
        left: 52px;
        bottom: 52px;
        border-bottom-width: 3px;
        border-left-width: 3px;
      }
      .br.bR {
        right: 52px;
        bottom: 52px;
        border-bottom-width: 3px;
        border-right-width: 3px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-red);
        white-space: nowrap;
      }
      .eyebrow::before {
        content: "";
        flex: none;
        width: 24px;
        height: 2px;
        background: var(--m-red);
      }
      .label {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-cream-dim);
      }
      .value {
        margin-top: 12px;
        font-size: 36px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .foot {
        position: absolute;
        left: 80px;
        bottom: 116px;
        height: 32px;
      }

      /* ---- This card ---- */
      .page {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 136px;
        bottom: 200px;
        display: flex;
        flex-direction: column;
      }
      .top {
        margin-top: 36px;
        display: flex;
        gap: 48px;
      }
      .photo {
        flex: none;
        width: 560px;
        height: 560px;
        border-radius: 20px;
        object-fit: cover;
        object-position: 50% 30%;
        background: var(--m-card);
      }
      .facts {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 6px 0 4px;
      }
      .facts .value {
        margin-top: 10px;
        font-size: 32px;
      }
      /* The talk, name and role sit at the foot of the page, whatever the talk's length. */
      .bottom {
        margin-top: auto;
        padding-top: 48px;
      }
      /* Fitted to two lines in onFields. */
      .talk {
        font-size: 96px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.04em;
        padding-bottom: 6px;
      }
      .name {
        margin-top: 36px;
        font-size: 48px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.025em;
        white-space: nowrap;
      }
      .role {
        margin-top: 6px;
        font-size: 30px;
        font-weight: 400;
        line-height: 1.3;
        color: var(--m-cream-mid);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div class="m-dotgrid"></div>
      <div class="br tl"></div>
      <div class="br tr"></div>
      <div class="br bl"></div>
      <div class="br bR"></div>

      <div class="page">
        <div class="eyebrow"><span data-field="eyebrow">Speaker</span></div>
        <div class="top">
          <img class="photo" data-field-src="photo" src="assets/jason-grad.jpg" alt="" />
          <div class="facts">
            <div>
              <div class="label">Event</div>
              <div class="value fit"><span data-field="event">Prague Crawl 2027</span></div>
            </div>
            <div>
              <div class="label">Date</div>
              <div class="value fit"><span data-field="date">May 13, 2027</span></div>
            </div>
            <div>
              <div class="label">Time</div>
              <div class="value fit"><span data-field="time">[Time]</span></div>
            </div>
            <div>
              <div class="label">Venue</div>
              <div class="value fit"><span data-field="venue">Spojka Events, Prague</span></div>
            </div>
          </div>
        </div>
        <div class="bottom">
          <div class="talk"><span data-field="talk">[Talk title]</span></div>
          <div class="name" data-field="name">Jason Grad</div>
          <div class="role" data-field="role">Co-founder &amp; CEO, Massive</div>
        </div>
      </div>

      <img class="foot" src="../_brand/logo-massive.svg" alt="Massive" />
    </div>

    <script src="../_lib/placeholders.js"></script>
    <script>
      // Shrink an element's font size from `from` until it fits its width and, when given, `lines` lines.
      const fit = (el, from, min, lines = null) => {
        const cs = getComputedStyle(el);
        const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
        const over = () =>
          el.scrollWidth > el.clientWidth + 1 ||
          (lines !== null &&
            Math.round((el.getBoundingClientRect().height - pad) / parseFloat(getComputedStyle(el).lineHeight)) > lines);
        let size = from;
        el.style.fontSize = `${size}px`;
        while (size > min && over()) {
          size -= 2;
          el.style.fontSize = `${size}px`;
        }
      };

      window.onFields = () => {
        massivePlaceholders();
        // The details share one size: each fits its column, then all take the smallest.
        const values = [...document.querySelectorAll(".value.fit")];
        values.forEach((el) => fit(el, 32, 26, 2));
        const size = Math.min(...values.map((el) => parseFloat(el.style.fontSize)));
        values.forEach((el) => (el.style.fontSize = `${size}px`));
        fit(document.querySelector(".talk"), 96, 56, 2);
        fit(document.querySelector(".name"), 48, 30);
        fit(document.querySelector(".role"), 30, 22);
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
