<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Welcome to Massive: Template (Franklin)</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- public/video-projects/welcome-to-massive held still in the Jason 15K Milestone card's portrait layout: the
         Slack desktop dimmed under the character-sheet card, the welcome line below, confetti frozen mid-burst.
         backdrop-filter is left out: it doesn't come through the export. -->
    <style>
      #canvas {
        width: 1080px;
        height: 1350px;
      }

      /* ---- Desktop (01-desktop), dimmed under the card ---- */
      .wallpaper {
        position: absolute;
        inset: -40px;
        background: #e9e7e4 url("assets/wallpaper.jpg") center / cover no-repeat;
      }
      .menubar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
        display: flex;
        align-items: center;
        gap: 34px;
        padding: 0 28px;
        background: rgba(10, 10, 15, 0.45);
        color: rgba(250, 244, 236, 0.92);
        font-size: 21px;
        font-weight: 500;
      }
      .menubar img {
        height: 17px;
      }
      .menubar .app {
        font-weight: 700;
      }
      .menubar .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 25px;
        font-variant-numeric: tabular-nums;
      }
      .menubar svg {
        width: 24px;
        height: 24px;
      }
      .dock {
        position: absolute;
        left: 167px;
        bottom: 24px;
        width: 746px;
        height: 134px;
        padding: 14px;
        display: flex;
        gap: 16px;
        border-radius: 38px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      .dock .tile {
        position: relative;
        width: 106px;
        height: 106px;
        flex-shrink: 0;
      }
      .dock .tile img {
        width: 106px;
        height: 106px;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
      }
      .dock .tile img.slack-icon {
        padding: 9px;
      }
      .running {
        position: absolute;
        left: 596px;
        bottom: 12px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(250, 244, 236, 0.85);
      }
      .dim {
        position: absolute;
        inset: 0;
        background: rgba(6, 6, 10, 0.62);
      }

      /* The card and the welcome line, centred between the menubar and the dock. The card's height depends on the
         hire (wrapping chips, a long food line), so the line follows it instead of sitting at a fixed top. */
      .stage {
        position: absolute;
        left: 0;
        right: 0;
        top: 50px;
        bottom: 158px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      /* ---- Card (03-card) in the Milestone card's portrait stack ---- */
      .card {
        position: relative;
        width: 780px;
        border-radius: 24px;
        background: rgba(26, 29, 33, 0.87);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(215, 73, 57, 0.12);
        overflow: hidden;
      }
      .chrome {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .chrome span {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25);
      }
      .chrome .close {
        background: #ff5f57;
      }
      .chrome .min {
        background: #febc2e;
      }
      .chrome .max {
        background: #28c840;
      }
      /* Lucide icons (lucide.dev, ISC). */
      svg.ic {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* Phosphor icons, fill weight (phosphoricons.com, MIT). */
      svg.ph {
        width: 26px;
        height: 26px;
        fill: currentColor;
      }
      .body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 46px 40px 40px;
      }
      .portrait {
        position: relative;
        width: 270px;
        height: 270px;
      }
      /* Gradient ring, clipped to a rounded frame around the photo; held where the video's spin ends. */
      .ring-frame {
        position: absolute;
        inset: -8px;
        border-radius: 36px;
        overflow: hidden;
        box-shadow: 0 0 40px rgba(215, 73, 57, 0.35);
      }
      .ring {
        position: absolute;
        left: -50%;
        top: -50%;
        width: 200%;
        height: 200%;
        background: conic-gradient(from 0deg, #d74939, #ff8163, rgba(215, 73, 57, 0.1), #d74939);
        transform: rotate(253deg);
      }
      .photo {
        position: absolute;
        inset: 0;
        width: 270px;
        height: 270px;
        object-fit: cover;
        border-radius: 30px;
        border: 4px solid #1a1d21;
      }
      .badge {
        position: absolute;
        left: 50%;
        bottom: -20px;
        margin-left: -100px;
        width: 200px;
        text-align: center;
        padding: 9px 0;
        border-radius: 999px;
        background: var(--m-red-deep);
        font-family: var(--m-mono);
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 8px 24px rgba(215, 73, 57, 0.45);
      }
      /* Fitted to the card's 700px column in onFields. */
      .name {
        margin-top: 46px;
        max-width: 700px;
        font-size: 76px;
        font-weight: 900;
        line-height: 1.15;
        padding-bottom: 4px;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }
      /* Slack presence: green dot + "Available". */
      .presence {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 500;
        color: var(--m-cream-mid);
      }
      .online {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #2bac76;
        box-shadow: 0 0 0 4px rgba(43, 172, 118, 0.22);
      }
      /* A fixed width, not shrink-to-fit: the browser export sets text a hair wider and would wrap the location. */
      .meta {
        margin-top: 22px;
        width: 700px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px 26px;
        font-size: 24px;
      }
      /* Role pill: the small Massive mark where the video has its ROLE label, then the role. */
      .org {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 7px 16px 7px 13px;
        border-radius: 10px;
        background: rgba(215, 73, 57, 0.14);
        border: 1px solid rgba(215, 73, 57, 0.45);
        color: var(--m-red-light);
        font-weight: 600;
        white-space: nowrap;
      }
      .org img {
        height: 15px;
      }
      /* Country pill: the role pill's shape in the chips' neutral colours, with the flag from _lib/flags.js. */
      .loc {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        padding: 7px 16px 7px 12px;
        border-radius: 10px;
        background: rgba(250, 244, 236, 0.07);
        border: 1px solid rgba(250, 244, 236, 0.18);
        color: var(--m-cream);
        font-weight: 600;
        white-space: nowrap;
      }
      .loc .flag {
        width: 28px;
        height: 21px;
        border-radius: 4px;
        object-fit: cover;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14);
      }
      .loc .flag.is-missing {
        display: none;
      }
      .k {
        font-family: var(--m-mono);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: rgba(250, 244, 236, 0.5);
      }
      .divider {
        align-self: stretch;
        margin: 32px 0 24px;
        height: 1px;
        background: rgba(255, 255, 255, 0.1);
      }
      .stat {
        align-self: stretch;
        display: grid;
        grid-template-columns: 50px 150px 1fr;
        align-items: center;
        gap: 14px;
        min-height: 60px;
      }
      .stat + .stat {
        margin-top: 12px;
      }
      .stat .tile {
        width: 50px;
        height: 50px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(215, 73, 57, 0.14);
        color: var(--m-red-light);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        padding: 7px 13px;
        border-radius: 999px;
        background: rgba(250, 244, 236, 0.07);
        border: 1px solid rgba(250, 244, 236, 0.18);
        font-size: 20px;
        font-weight: 500;
        white-space: nowrap;
      }
      .chip.empty {
        display: none;
      }
      .v {
        font-size: 23px;
        font-weight: 500;
        line-height: 1.3;
      }
      .xp {
        grid-template-columns: 50px 150px 1fr 56px;
      }
      .track {
        position: relative;
        height: 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--m-red), var(--m-red-light));
      }
      .num {
        font-family: var(--m-mono);
        font-size: 21px;
        font-weight: 700;
        color: var(--m-red-light);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      /* ---- Outro (04-outro): the wordmark over the welcome line, fitted to the frame in onFields ----
         Positioned so it paints above the card's drop shadow, which otherwise greys out the wordmark. */
      .outro {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .outro .logo {
        height: 28px;
      }
      .hello {
        font-size: 58px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .hello .who {
        color: var(--m-red-light);
      }
      .confetti {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <div class="wallpaper"></div>
      <div class="menubar">
        <img src="../_brand/icon-massive-white.svg" alt="Massive" />
        <span class="app">Slack</span>
        <span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
        <div class="right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0" /><path d="M1.42 9a16 16 0 0 1 21.16 0" /><path d="M8.53 16.11a6 6 0 0 1 6.95 0" /><line x1="12" x2="12.01" y1="20" y2="20" /></svg>
          
        </div>
      </div>
      <div class="dock">
        <div class="tile"><img src="assets/dock/safari.png" alt="Safari" /></div>
        <div class="tile"><img src="assets/dock/mail.png" alt="Mail" /></div>
        <div class="tile"><img src="assets/dock/facetime.png" alt="FaceTime" /></div>
        <div class="tile"><img class="slack-icon" src="assets/slack.svg" alt="Slack" /></div>
        <div class="tile"><img src="assets/dock/notes.png" alt="Notes" /></div>
        <div class="tile"><img src="assets/dock/app-store.png" alt="App Store" /></div>
      </div>
      <div class="running"></div>
      <div class="dim"></div>

      <div class="stage">
        <div class="card">
          <div class="chrome"><span class="close"></span><span class="min"></span><span class="max"></span></div>
          <div class="body">
            <div class="portrait">
              <div class="ring-frame"><div class="ring"></div></div>
              <img class="photo" data-field-src="photo" src="assets/franklin.jpg" alt="" />
              <div class="badge" data-field="badge">New hire</div>
            </div>
            <div class="name" data-field="name">Franklin Uche</div>
            <div class="presence"><span class="online"></span><span data-field="status">Available</span></div>
            <div class="meta">
              <span class="org"><img src="../_brand/icon-massive.svg" alt="Massive" /><span data-field="role">Community Lead</span></span>
              <span class="loc"><img class="flag" src="../_brand/flags/ng.svg" alt="" /><span data-field="country">Nigeria</span></span>
            </div>
            <div class="divider"></div>
            <div class="stat">
              <div class="tile"><svg class="ph" viewBox="0 0 256 256"><path d="M208,144a15.78,15.78,0,0,1-10.42,14.94L146,178l-19,51.62a15.92,15.92,0,0,1-29.88,0L78,178l-51.62-19a15.92,15.92,0,0,1,0-29.88L78,110l19-51.62a15.92,15.92,0,0,1,29.88,0L146,110l51.62,19A15.78,15.78,0,0,1,208,144ZM152,48h16V64a8,8,0,0,0,16,0V48h16a8,8,0,0,0,0-16H184V16a8,8,0,0,0-16,0V32H152a8,8,0,0,0,0,16Zm88,32h-8V72a8,8,0,0,0-16,0v8h-8a8,8,0,0,0,0,16h8v8a8,8,0,0,0,16,0V96h8a8,8,0,0,0,0-16Z" /></svg></div>
              <span class="k">ABILITIES</span>
              <div class="chips">
                <span class="chip">Playing football</span><span class="chip">Playing golf</span><span class="chip">Gardening</span><span class="chip empty"></span><span class="chip empty"></span>
              </div>
            </div>
            <div class="stat">
              <div class="tile"><svg class="ph" viewBox="0 0 256 256"><path d="M216,40V224a8,8,0,0,1-16,0V176H152a8,8,0,0,1-8-8,268.75,268.75,0,0,1,7.22-56.88c9.78-40.49,28.32-67.63,53.63-78.47A8,8,0,0,1,216,40Zm-96.11-1.31a8,8,0,1,0-15.78,2.63L111.89,88H88V40a8,8,0,0,0-16,0V88H48.11l7.78-46.68a8,8,0,1,0-15.78-2.63l-8,48A8.17,8.17,0,0,0,32,88a48.07,48.07,0,0,0,40,47.32V224a8,8,0,0,0,16,0V135.32A48.07,48.07,0,0,0,128,88a8.17,8.17,0,0,0-.11-1.31Z" /></svg></div>
              <span class="k">FUEL</span>
              <div class="v" data-field="food">Medium rare steak and rice</div>
            </div>
            <div class="stat xp">
              <div class="tile"><svg class="ic" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /></svg></div>
              <span class="k">ONBOARDING XP</span>
              <div class="track"><div class="fill"></div></div>
              <span class="num">100</span>
            </div>
          </div>
        </div>

        <div class="outro">
          <img class="logo" src="../_brand/logo-massive.svg" alt="Massive" />
          <div class="hello">Welcome to the team, <span class="who" data-field="firstName">Franklin</span>!</div>
        </div>
      </div>

      <div class="confetti" data-field-show="confetti"></div>
    </div>

    <script src="../_lib/confetti.js"></script>
    <script src="../_lib/flags.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const fit = (el, max, from, min) => {
        el.style.fontSize = `${from}px`;
        for (let size = from; el.scrollWidth > max && size > min; size -= 2) el.style.fontSize = `${size - 2}px`;
      };
      let burstY = null;

      window.onFields = async (values) => {
        // Hobbies arrive as one field, comma-separated (one per line also works), up to five chips.
        const hobbies = String(values.hobbies ?? "").split(/[,\n]/).map((s) => s.trim()).filter(Boolean);
        document.querySelectorAll(".chip").forEach((chip, i) => {
          chip.textContent = hobbies[i] ?? "";
          chip.classList.toggle("empty", !hobbies[i]);
        });

        // The country picks its flag; a name flags.js doesn't know hides it. Wait for a new one to load, so the
        // export doesn't catch it blank.
        const flag = $(".loc .flag");
        const src = massiveFlag(values.country);
        flag.classList.toggle("is-missing", !src);
        if (src && flag.getAttribute("src") !== src) {
          flag.setAttribute("src", src);
          await flag.decode().catch(() => {});
        }

        fit($(".name"), 700, 76, 48);
        fit($(".hello"), 960, 58, 40);

        // The achievement burst from behind the portrait, frozen 1.3 s in. The card's height varies, so aim at
        // wherever the portrait landed.
        const canvas = $("#canvas").getBoundingClientRect();
        const portrait = $(".portrait").getBoundingClientRect();
        const y = Math.round(portrait.top + portrait.height / 2 - canvas.top);
        if (y !== burstY) {
          burstY = y;
          massiveConfetti($(".confetti"), { mode: "burst", count: 120, at: 1.3, x: 540, y });
        }
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
