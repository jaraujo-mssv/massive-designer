<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <div id="root" data-composition-id="wc-consent-settled" data-width="1920" data-height="1080" data-duration="7.7">
        <div class="diagram-plate"><div class="grid-plate"></div></div>
      </div>
      <script>
        /*
         * ConsentSettled (sparktray brand/ui/ConsentSettled.tsx), beats 18-19 on one clock.
         * The green ring draws shut around the user through beat 18, then breathes through 19.
         * No accent anywhere: the film opens on orange flowing out and closes on green alone.
         */
        ConsentKit.mount("wc-consent-settled", 462, (h) => {
          const { at, ease, clamp01 } = ConsentKit;
          const { C, el } = DiagramKit;
          const BEAT_19 = 0.57;
          const MID = 150;
          const RING = 100;
          const CIRC = 2 * Math.PI * RING;
          const CONTENT = { x: 34, y: 34, w: 232, h: 232 };
          const PAD = 30;
          const BOX = { x: CONTENT.x - PAD, y: CONTENT.y - PAD, w: CONTENT.w + PAD * 2, h: CONTENT.h + PAD * 2 };
          const MARKS = [0, 0.25, 0.5, 0.75];

          const svg = DiagramKit.frame(h.root, BOX, "wc-settled");
          el("circle", { cx: MID, cy: MID, r: RING, stroke: C.hairline, "stroke-width": 1, fill: "none" }, svg);
          const ring = el(
            "circle",
            { cx: MID, cy: MID, r: RING, stroke: C.green, "stroke-width": 1.8, fill: "none", "stroke-dasharray": CIRC, transform: `rotate(-90 ${MID} ${MID})` },
            svg,
          );
          const marks = MARKS.map((m) => {
            const a = (m * 360 - 90) * (Math.PI / 180);
            const x = MID + RING * Math.cos(a);
            const y = MID + RING * Math.sin(a);
            const g = el("g", {}, svg);
            el("circle", { cx: x, cy: y, r: 7, fill: C.card, stroke: C.greenStroke, "stroke-width": 1 }, g);
            el("path", { d: `M${x - 3.2} ${y} l2.2 2.4 l4.4 -5`, stroke: C.green, "stroke-width": 1.6, "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" }, g);
            return { m, g };
          });
          el("circle", { cx: MID, cy: MID, r: 62, fill: svg.glow, opacity: 0.16, filter: svg.shadow }, svg);
          const core = el("circle", { cx: MID, cy: MID, r: 46, fill: C.nodeFill, stroke: C.greenStroke, "stroke-width": 1 }, svg);
          const person = el(
            "g",
            { transform: `translate(${MID},${MID}) scale(1.35)`, stroke: C.green, "stroke-width": 1.3, "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" },
            svg,
          );
          person.innerHTML = '<circle cx="0" cy="-6" r="6"/><path d="M-10 12c0-5 4-9 10-9s10 4 10 9"/>';

          return (t) => {
            const close = ease(at(t, 0.08, BEAT_19));
            const breath = t <= BEAT_19 ? 1 : 0.86 + 0.14 * Math.cos((t - BEAT_19) * Math.PI * 3.2);
            ring.setAttribute("opacity", breath);
            ring.setAttribute("stroke-dashoffset", CIRC * (1 - close));
            marks.forEach(({ m, g }) => g.setAttribute("opacity", clamp01((close - m) / 0.06) * breath));
            core.setAttribute("opacity", breath);
            person.setAttribute("opacity", breath);
          };
        });
      </script>
    </template>
  </body>
</html>
