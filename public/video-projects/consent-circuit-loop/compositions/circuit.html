<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #ccl-root {
          position: absolute;
          inset: 0;
        }
        #ccl-root svg {
          position: absolute;
          left: 80px;
          top: 36px;
          width: 1120px;
          height: auto;
          display: block;
        }
      </style>
      <div id="ccl-root" data-composition-id="ccl-circuit" data-width="1280" data-height="560" data-duration="4">
        <!-- Artwork copied from slide 02 of scripts/deck/consent-sourcing-v2.html; the
             moving parts (packets, pulses, rings) are added here and driven below. -->
        <svg viewBox="58 107 782 341" aria-hidden="true">
          <defs>
            <radialGradient id="ccl-glow"><stop offset="0" stop-color="#d74939" stop-opacity=".35" /><stop offset="1" stop-color="#d74939" stop-opacity="0" /></radialGradient>
            <radialGradient id="ccl-glowG"><stop offset="0" stop-color="#8be9a1" stop-opacity=".22" /><stop offset="1" stop-color="#8be9a1" stop-opacity="0" /></radialGradient>
            <radialGradient id="ccl-halo"><stop offset="0" stop-color="#ff8163" stop-opacity=".5" /><stop offset="1" stop-color="#ff8163" stop-opacity="0" /></radialGradient>
            <radialGradient id="ccl-haloG"><stop offset="0" stop-color="#8be9a1" stop-opacity=".45" /><stop offset="1" stop-color="#8be9a1" stop-opacity="0" /></radialGradient>
          </defs>
          <path id="ccl-line" d="M150 300 H750" stroke="rgba(255,129,99,.7)" stroke-width="3.6" stroke-dasharray="6 6" />
          <path id="ccl-arc" d="M750 262 Q450 20 150 262" fill="none" stroke="rgba(139,233,161,.7)" stroke-width="3.6" stroke-dasharray="6 6" />

          <!-- Bandwidth packets ride the line under the nodes; rewards ride the arc back. -->
          <g class="ccl-red"><circle r="16" fill="url(#ccl-halo)" /><circle r="8" fill="#ff8163" /></g>
          <g class="ccl-red"><circle r="16" fill="url(#ccl-halo)" /><circle r="8" fill="#ff8163" /></g>
          <g class="ccl-red"><circle r="16" fill="url(#ccl-halo)" /><circle r="8" fill="#ff8163" /></g>
          <g class="ccl-green"><circle r="15" fill="url(#ccl-haloG)" /><circle r="7" fill="#8be9a1" /></g>
          <g class="ccl-green"><circle r="15" fill="url(#ccl-haloG)" /><circle r="7" fill="#8be9a1" /></g>

          <!-- 01 user -->
          <g transform="translate(150,300)">
            <circle id="ccl-user-glow" r="52" fill="url(#ccl-glow)" opacity=".6" />
            <circle id="ccl-user-catch" r="38" fill="none" stroke="#8be9a1" stroke-width="2.55" opacity="0" />
            <circle r="38" fill="#0a0a0f" stroke="rgba(250,244,236,.3)" stroke-width="2.55" />
            <circle id="ccl-user-ring" r="38" fill="none" stroke="#d74939" stroke-width="2.55" stroke-dasharray="180 400" transform="rotate(-120)" />
            <g stroke="#ff8163" stroke-width="3.15" stroke-linecap="round" fill="none"><circle cy="-6" r="6" /><path d="M-10 12c0-5 4-9 10-9s10 4 10 9" /></g>
            <rect x="-36" y="56" width="72" height="28" rx="14" fill="#ff8163" /><text y="75" text-anchor="middle" font-family="Outfit" font-size="14" font-weight="700" letter-spacing="1.2" fill="#0a0a0f">USER</text>
            <text y="110" text-anchor="middle" font-family="Outfit" font-size="17" fill="rgba(250,244,236,.72)">Uses a free app</text>
          </g>
          <!-- 02 network -->
          <g transform="translate(450,300)">
            <circle id="ccl-net-glow" r="60" fill="url(#ccl-glow)" opacity=".8" />
            <circle id="ccl-net-pulse" r="46" fill="none" stroke="#ff8163" stroke-width="2.4" opacity="0" />
            <circle r="46" fill="#0a0a0f" stroke="#d74939" stroke-width="3.15" />
            <g id="ccl-net-rings" stroke="#d74939" stroke-width="2.1" opacity=".4" fill="none"><circle r="30" /><circle r="18" /></g>
            <g id="ccl-net-dots" fill="#ff8163"><circle cx="-16" cy="-8" r="3" /><circle cx="11" cy="14" r="3" /><circle cx="-18" cy="3" r="3" /><circle cx="24" cy="-18" r="3" /><circle cx="-20" cy="21" r="3" /><circle cx="29" cy="7" r="3" /><circle cx="4" cy="46" r="3" /><circle cx="-22" cy="-40" r="3" /><circle cx="25" cy="-39" r="3" /></g>
            <circle id="ccl-net-core" r="4" fill="#faf4ec" />
            <rect x="-52" y="64" width="104" height="28" rx="14" fill="#ff8163" /><text y="83" text-anchor="middle" font-family="Outfit" font-size="14" font-weight="700" letter-spacing="1.2" fill="#0a0a0f">NETWORK</text>
            <text y="118" text-anchor="middle" font-family="Outfit" font-size="17" fill="rgba(250,244,236,.72)">Uses idle bandwidth</text>
          </g>
          <!-- 03 reward -->
          <g transform="translate(750,300)">
            <circle id="ccl-reward-glow" r="52" fill="url(#ccl-glowG)" />
            <circle r="38" fill="#0a0a0f" stroke="rgba(139,233,161,.45)" stroke-width="2.55" />
            <circle id="ccl-reward-ring" r="38" fill="none" stroke="#8be9a1" stroke-width="2.55" stroke-dasharray="180 400" transform="rotate(60)" />
            <g id="ccl-gift" stroke="#8be9a1" stroke-width="3.15" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="-13" y="-4" width="26" height="16" rx="1.5" /><path d="M-13 4h26" /><path d="M0 -4v16" /><path d="M-8 -4c-3 -4 1 -9 4 -6s4 6 4 6c0 0 1 -9 4 -6s3 6 0 6" /></g>
            <rect x="-46" y="56" width="92" height="28" rx="14" fill="#8be9a1" /><text y="75" text-anchor="middle" font-family="Outfit" font-size="14" font-weight="700" letter-spacing="1.2" fill="#0a0a0f">REWARD</text>
            <text y="110" text-anchor="middle" font-family="Outfit" font-size="17" fill="rgba(250,244,236,.72)">App stays free</text>
          </g>
        </svg>
      </div>
      <script>
        (() => {
          // Everything is a function of the loop phase p = t / LOOP, and every motion
          // completes a whole number of cycles per loop, so frame 0 follows the last frame.
          const LOOP = 4;
          const RED = 3; // bandwidth packets on the line, evenly spaced
          const GREEN = 2; // reward packets on the arc
          const DASH_CYCLES = 16; // dash pattern (12 units) shifts this many times per loop

          const root = document.querySelector('[data-composition-id="ccl-circuit"]');
          const $ = (id) => root.querySelector("#" + id);
          const line = $("ccl-line");
          const arc = $("ccl-arc");
          const arcLen = arc.getTotalLength();
          const reds = [...root.querySelectorAll(".ccl-red")];
          const greens = [...root.querySelectorAll(".ccl-green")];
          const netDots = [...$("ccl-net-dots").children];
          const userGlow = $("ccl-user-glow");
          const userCatch = $("ccl-user-catch");
          const userRing = $("ccl-user-ring");
          const netGlow = $("ccl-net-glow");
          const netPulse = $("ccl-net-pulse");
          const netRings = $("ccl-net-rings");
          const netCore = $("ccl-net-core");
          const rewardGlow = $("ccl-reward-glow");
          const rewardRing = $("ccl-reward-ring");
          const gift = $("ccl-gift");

          const frac = (x) => ((x % 1) + 1) % 1;
          // Seconds since the most recent of `count` evenly spaced hits, the first at phase h.
          const since = (p, h, count) => (frac((p - h) * count) / count) * LOOP;
          // Quick rise, slow fall.
          const env = (s, decay = 0.45) => (s < 0.08 ? s / 0.08 : Math.exp(-(s - 0.08) / decay));
          const edgeFade = (u, w) => Math.min(1, u / w, (1 - u) / w);

          // Red packet i is at fraction u = frac(p + i / RED) of the line (x 150 → 750).
          // It reaches the network centre at u = .5 and the reward node's edge at u = 562/600.
          const RED_NET_HIT = 0.5;
          const RED_REWARD_HIT = 562 / 600;
          // Green packets travel the arc from the reward node back to the user.
          const GREEN_USER_HIT = 0.97;

          function render(t) {
            const p = frac(t / LOOP);

            const dash = -12 * DASH_CYCLES * p;
            line.setAttribute("stroke-dashoffset", dash);
            arc.setAttribute("stroke-dashoffset", dash);

            reds.forEach((g, i) => {
              const u = frac(p + i / RED);
              g.setAttribute("transform", `translate(${150 + 600 * u},300)`);
            });
            greens.forEach((g, i) => {
              const u = frac(p + i / GREEN);
              const pt = arc.getPointAtLength(u * arcLen);
              g.setAttribute("transform", `translate(${pt.x},${pt.y})`);
              g.setAttribute("opacity", edgeFade(u, 0.06));
            });

            userRing.setAttribute("transform", `rotate(${-120 + 360 * p})`);
            rewardRing.setAttribute("transform", `rotate(${60 + 360 * p})`);

            // Network: a ring ripples out as each packet passes through the centre.
            const sNet = since(p, RED_NET_HIT, RED);
            const ripple = Math.min(1, sNet / 0.9);
            netPulse.setAttribute("r", 46 + 30 * (1 - Math.pow(1 - ripple, 3)));
            netPulse.setAttribute("opacity", 0.7 * (1 - ripple));
            const eNet = env(sNet, 0.35);
            netGlow.setAttribute("opacity", 0.8 + 0.2 * eNet);
            netGlow.setAttribute("r", 60 + 8 * eNet);
            netRings.setAttribute("opacity", 0.4 + 0.35 * eNet);
            netCore.setAttribute("r", 4 + 2 * eNet);
            netDots.forEach((d, i) => {
              const tw = 0.5 + 0.5 * Math.sin(2 * Math.PI * (2 * p + i * 0.37));
              d.setAttribute("opacity", 0.35 + 0.65 * tw);
            });

            // Reward: glows and the gift bumps as bandwidth arrives.
            const eReward = env(since(p, RED_REWARD_HIT, RED));
            rewardGlow.setAttribute("r", 52 + 12 * eReward);
            rewardGlow.setAttribute("opacity", 1);
            gift.setAttribute("transform", `scale(${1 + 0.14 * eReward})`);

            // User: lights up green as each reward lands.
            const eUser = env(since(p, GREEN_USER_HIT, GREEN), 0.55);
            userGlow.setAttribute("opacity", 0.6 + 0.4 * eUser);
            userGlow.setAttribute("r", 52 + 8 * eUser);
            userCatch.setAttribute("r", 38 + 10 * eUser);
            userCatch.setAttribute("opacity", 0.6 * eUser);
          }

          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          render(0);
          tl.to(clock, { t: LOOP, duration: LOOP, ease: "none", onUpdate: () => render(clock.t) }, 0);
          window.__timelines["ccl-circuit"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
