<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Holiday greetings</title>
    <link rel="stylesheet" href="../_brand/massive.css" />
    <!-- public/video-projects/holiday-greetings held at its final frame, in the welcome card's portrait layout: the
         Slack desktop dimmed under the greeting card (motif panel on top, greeting below), the outro line under it.
         Every candle is lit and every seed is in; the honey drops only exist mid-fall and are left out.
         backdrop-filter is left out: it doesn't come through the export. -->
    <style>
      #canvas {
        width: 1080px;
        height: 1350px;
      }
      /* The holiday field picks one motif and one copy block; the other stays hidden. */
      #canvas[data-holiday="rosh-hashanah"] .only-hanukkah,
      #canvas[data-holiday="hanukkah"] .only-rh {
        display: none;
      }

      /* ---- Desktop (01-desktop), dimmed under the card ---- */
      .wallpaper {
        position: absolute;
        inset: -40px;
        background: #e9e7e4 url("assets/wallpaper.jpg") center / cover no-repeat;
      }
      .menubar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50px;
        display: flex;
        align-items: center;
        gap: 34px;
        padding: 0 28px;
        background: rgba(10, 10, 15, 0.45);
        color: rgba(250, 244, 236, 0.92);
        font-size: 21px;
        font-weight: 500;
      }
      .menubar img {
        height: 17px;
      }
      .menubar .app {
        font-weight: 700;
      }
      .menubar .right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 25px;
      }
      .menubar svg {
        width: 24px;
        height: 24px;
      }
      .dock {
        position: absolute;
        left: 167px;
        bottom: 24px;
        width: 746px;
        height: 134px;
        padding: 14px;
        display: flex;
        gap: 16px;
        border-radius: 38px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      .dock .tile {
        position: relative;
        width: 106px;
        height: 106px;
        flex-shrink: 0;
      }
      .dock .tile img {
        width: 106px;
        height: 106px;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
      }
      .dock .tile img.slack-icon {
        padding: 9px;
      }
      .running {
        position: absolute;
        left: 596px;
        bottom: 12px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(250, 244, 236, 0.85);
      }
      .dim {
        position: absolute;
        inset: 0;
        background: rgba(6, 6, 10, 0.62);
      }

      /* The card and the outro line, centred between the menubar and the dock. */
      .stage {
        position: absolute;
        left: 0;
        right: 0;
        top: 50px;
        bottom: 158px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      /* ---- Greeting card (03-card), re-laid for portrait ---- */
      .card {
        position: relative;
        width: 780px;
        border-radius: 24px;
        background: rgba(26, 29, 33, 0.87);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(215, 73, 57, 0.12);
        overflow: hidden;
      }
      .chrome {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .chrome span {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25);
      }
      .chrome .close {
        background: #ff5f57;
      }
      .chrome .min {
        background: #febc2e;
      }
      .chrome .max {
        background: #28c840;
      }
      .body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 40px 46px;
        text-align: center;
      }
      /* The motif panel, with the warm glow it ends on. */
      .panel {
        position: relative;
        width: 700px;
        height: 380px;
        border-radius: 24px;
        background: #121117;
        border: 1px solid rgba(215, 73, 57, 0.27);
        overflow: hidden;
      }
      .panel .warm {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, rgba(215, 73, 57, 0.32), rgba(215, 73, 57, 0) 70%);
      }
      .panel svg {
        position: absolute;
        left: 50%;
        top: 0;
        width: 440px;
        height: 382px;
        margin-left: -220px;
        overflow: visible;
      }
      .line {
        fill: none;
        stroke: #faf4ec;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* The greeting, under the panel. */
      .eyebrow {
        margin-top: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-red-light);
      }
      .eyebrow::before {
        content: "";
        width: 24px;
        height: 2px;
        background: var(--m-red);
      }
      .headline {
        margin-top: 18px;
        font-size: 92px;
        font-weight: 900;
        line-height: 0.98;
        letter-spacing: -0.04em;
        padding-bottom: 6px;
        text-wrap: balance;
      }
      .english {
        margin-top: 12px;
        font-size: 42px;
        font-weight: 300;
        letter-spacing: -0.02em;
        color: var(--m-red-light);
      }
      .wish {
        margin-top: 18px;
        max-width: 620px;
        font-size: 28px;
        line-height: 1.4;
        text-wrap: balance;
        color: var(--m-cream-mid);
      }

      /* ---- Outro (04-outro): the wordmark over the greeting line ----
           Positioned so it paints above the card's drop shadow. */
      .outro {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .outro .logo {
        height: 28px;
      }
      .hello {
        font-size: 58px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.03em;
        white-space: nowrap;
      }
      .hello .who {
        color: var(--m-red-light);
      }
    </style>
  </head>
  <body>
    <div id="canvas" data-holiday="hanukkah">
      <div class="wallpaper"></div>
      <div class="menubar">
        <img src="../_brand/icon-massive-white.svg" alt="Massive" />
        <span class="app">Slack</span>
        <span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span>
        <div class="right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0" /><path d="M1.42 9a16 16 0 0 1 21.16 0" /><path d="M8.53 16.11a6 6 0 0 1 6.95 0" /><line x1="12" x2="12.01" y1="20" y2="20" /></svg>
        </div>
      </div>
      <div class="dock">
        <div class="tile"><img src="assets/dock/safari.png" alt="Safari" /></div>
        <div class="tile"><img src="assets/dock/mail.png" alt="Mail" /></div>
        <div class="tile"><img src="assets/dock/facetime.png" alt="FaceTime" /></div>
        <div class="tile"><img class="slack-icon" src="assets/slack.svg" alt="Slack" /></div>
        <div class="tile"><img src="assets/dock/notes.png" alt="Notes" /></div>
        <div class="tile"><img src="assets/dock/app-store.png" alt="App Store" /></div>
      </div>
      <div class="running"></div>
      <div class="dim"></div>

      <div class="stage">
        <div class="card">
          <div class="chrome"><span class="close"></span><span class="min"></span><span class="max"></span></div>
          <div class="body">
            <div class="panel">
              <div class="warm"></div>

              <!-- Hanukkah: a hanukkiah with a raised centre shamash and eight candles, all lit. -->
              <svg class="only-hanukkah" viewBox="0 0 440 382">
                <defs>
                  <linearGradient id="hg-flame" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0" stop-color="#d74939" />
                    <stop offset="0.55" stop-color="#ff8163" />
                    <stop offset="1" stop-color="#ffd2bf" />
                  </linearGradient>
                  <radialGradient id="hg-halo">
                    <stop offset="0" stop-color="#ff8163" stop-opacity="0.55" />
                    <stop offset="1" stop-color="#ff8163" stop-opacity="0" />
                  </radialGradient>
                </defs>
                <g>
                  <path class="line" d="M156 344 H284 M176 344 L196 322 H244 L264 344" />
                  <path class="line" d="M220 322 V214" />
                  <path class="line" d="M30 206 H410" stroke-width="6" />
                  <path class="line" d="M220 206 V162" />
                </g>
                <g class="candles"></g>
              </svg>

              <!-- Rosh Hashanah: an apple, a honey dipper and a cut pomegranate with all eight seeds. -->
              <svg class="only-rh" viewBox="0 0 440 382">
                <defs>
                  <radialGradient id="hg-apple" cx="0.35" cy="0.3" r="0.9">
                    <stop offset="0" stop-color="#ff8163" />
                    <stop offset="0.6" stop-color="#d74939" />
                    <stop offset="1" stop-color="#9e2c1f" />
                  </radialGradient>
                </defs>
                <g transform="translate(150 250)">
                  <path d="M0,-62 C24,-86 84,-80 84,-14 C84,48 46,86 18,84 C8,83 4,78 0,78 C-4,78 -8,83 -18,84 C-46,86 -84,48 -84,-14 C-84,-80 -24,-86 0,-62 Z" fill="url(#hg-apple)" />
                  <ellipse cx="-42" cy="-26" rx="12" ry="22" fill="#faf4ec" opacity="0.22" transform="rotate(24 -42 -26)" />
                  <path class="line" d="M0,-62 C0,-78 4,-90 12,-100" />
                  <path class="line" d="M8,-88 C22,-106 46,-106 56,-96 C42,-80 22,-78 8,-88 Z" />
                </g>
                <g transform="translate(186 96)">
                  <path class="line" d="M14,-10 L118,-78" stroke-width="7" />
                  <ellipse cx="0" cy="0" rx="24" ry="17" fill="#ff8163" transform="rotate(-33)" />
                  <path class="line" d="M-14,-12 L-6,14 M-4,-16 L4,12 M6,-18 L14,8" stroke="#121117" stroke-width="3" />
                </g>
                <g transform="translate(338 282)">
                  <circle r="66" fill="rgba(215, 73, 57, 0.14)" class="line" />
                  <path class="line" d="M-16,-64 L-12,-82 L-5,-70 L0,-86 L5,-70 L12,-82 L16,-64" />
                  <circle r="50" fill="none" stroke="rgba(250, 244, 236, 0.22)" stroke-width="1.5" stroke-dasharray="4 6" />
                  <g class="seeds"></g>
                </g>
              </svg>
            </div>

            <div class="eyebrow"><span class="only-hanukkah">Hanukkah · Festival of lights</span><span class="only-rh">Rosh Hashanah · Jewish New Year</span></div>
            <div class="headline"><span class="only-hanukkah">Chag Urim Sameach</span><span class="only-rh">Shana Tova</span></div>
            <div class="english"><span class="only-hanukkah">Happy Hanukkah</span><span class="only-rh">Happy New Year</span></div>
            <div class="wish"><span class="only-hanukkah">Wishing you and your family eight bright nights.</span><span class="only-rh">Wishing you a sweet new year.</span></div>
          </div>
        </div>

        <div class="outro">
          <img class="logo" src="../_brand/logo-massive.svg" alt="Massive" />
          <div class="hello"><span class="only-hanukkah">Happy <span class="who">Hanukkah</span> from all of us!</span><span class="only-rh"><span class="who">Shana Tova</span> from all of us!</span></div>
        </div>
      </div>
    </div>

    <script>
      // The video's motifs at the end of their timeline: every flame at full size, every seed in.
      (() => {
        const NS = "http://www.w3.org/2000/svg";
        const svgEl = (tag, attrs, parent) => {
          const el = document.createElementNS(NS, tag);
          for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
          parent.appendChild(el);
          return el;
        };

        // Hanukkah: nine slots 44px apart; the shamash (slot 4) sits higher.
        const candles = document.querySelector(".candles");
        for (let slot = 0; slot < 9; slot++) {
          const x = 44 + slot * 44;
          const base = slot === 4 ? 162 : 206;
          const top = base - 8 - 58;
          const g = svgEl("g", {}, candles);
          svgEl("rect", { x: x - 13, y: base - 8, width: 26, height: 8, rx: 3, fill: "#faf4ec", opacity: 0.9 }, g);
          svgEl("rect", { x: x - 7, y: top, width: 14, height: 58, rx: 3, fill: "#faf4ec", opacity: 0.78 }, g);
          const f = svgEl("g", { transform: `translate(${x} ${top - 2})` }, candles);
          svgEl("circle", { cx: 0, cy: -14, r: 36, fill: "url(#hg-halo)", opacity: 0.9 }, f);
          svgEl("path", { d: "M0,-30 C9,-15 11,-6 11,1 A11,11 0 0 1 -11,1 C-11,-6 -9,-15 0,-30 Z", fill: "url(#hg-flame)" }, f);
          svgEl("path", { d: "M0,-14 C4,-7 5,-3 5,1 A5,5 0 0 1 -5,1 C-5,-3 -4,-7 0,-14 Z", fill: "#fff4ec", opacity: 0.85 }, f);
        }

        // Rosh Hashanah: eight seeds inside the cut pomegranate.
        const seeds = document.querySelector(".seeds");
        const SEEDS = [[-24, -26], [0, -32], [24, -26], [-34, 0], [-11, -4], [12, -2], [34, 2], [0, 26]];
        SEEDS.forEach(([x, y], i) => {
          const g = svgEl("g", { transform: `translate(${x} ${y})` }, seeds);
          svgEl("ellipse", { rx: 8, ry: 11, fill: "#ff8163", transform: `rotate(${((i * 47) % 60) - 30})` }, g);
          svgEl("ellipse", { cx: -2.5, cy: -4, rx: 2.5, ry: 3.5, fill: "#fff4ec", opacity: 0.7 }, g);
        });
      })();

      window.onFields = (values) => {
        document.getElementById("canvas").dataset.holiday = values.holiday === "rosh-hashanah" ? "rosh-hashanah" : "hanukkah";
      };
    </script>
    <script src="../_lib/image-kit.js"></script>
  </body>
</html>
