<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Free file scanning in OneLaunch (3D camera)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/frame-kit.js"></script>
    <script src="js/consent-kit.js"></script>
    <script src="js/taskbar-art.js"></script>
    <script src="js/pc-desktop.js"></script>
    <script src="js/onelaunch-ui.js"></script>
    <script src="js/captions-data.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/onelaunch-story.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <link rel="stylesheet" href="onelaunch.css" />
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--ol-cap);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      #ol-ground {
        position: absolute;
        inset: 0;
        background: #0a0a0f;
      }
    </style>
  </head>
  <body>
    <!-- Timing is generated: run `node timing.build.mjs` after editing SCRIPT.md or recording the voice. -->
    <div id="stage" data-composition-id="onelaunch-file-scanning-3d" data-start="0" data-duration="42.666667" data-fps="30" data-width="1920" data-height="1080">
      <div id="ol-ground" class="clip" data-start="0" data-duration="42.666667" data-track-index="0"></div>

      <!-- The screen recording: one continuous desktop, cut into scenes at the voice lines (js/onelaunch-story.js) -->
      <div id="s1-open" class="clip scene" data-composition-id="s1-open" data-composition-src="compositions/01-open.html"
        data-start="0" data-duration="3.533333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s2-offer" class="clip scene" data-composition-id="s2-offer" data-composition-src="compositions/02-offer.html"
        data-start="3.533333" data-duration="7.266667" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s3-consent" class="clip scene" data-composition-id="s3-consent" data-composition-src="compositions/03-consent.html"
        data-start="10.8" data-duration="10.633333" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s4-unlocked" class="clip scene" data-composition-id="s4-unlocked" data-composition-src="compositions/04-unlocked.html"
        data-start="21.433333" data-duration="5.666667" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s5-settings" class="clip scene" data-composition-id="s5-settings" data-composition-src="compositions/05-settings.html"
        data-start="27.1" data-duration="4.2" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s6-off" class="clip scene" data-composition-id="s6-off" data-composition-src="compositions/06-off.html"
        data-start="31.3" data-duration="4.466667" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s7-end" class="clip scene" data-composition-id="s7-end" data-composition-src="compositions/07-end.html"
        data-start="35.766667" data-duration="6.9" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- Subtitles over everything, for the whole film -->
      <div id="ol-captions" class="clip" data-composition-id="ol-captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="42.666667" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- Fades up from black over 4 frames; no fade at the end, because the last frame is the poster (posterFromEnd). -->
      <div id="ol-veil" class="clip ol-veil" data-start="0" data-duration="42.666667" data-track-index="3"></div>

      <audio id="ol-voice" src="assets/voice/take-2c886060.mp3" data-start="0" data-duration="40.133333" data-track-index="10" data-volume="1" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.05,"v":1}]}]}'></audio>
      <!-- Music bed at 0.07 (as in what-does-consent-look-like), 1.5 s fades. 160 s track, so it never ends inside its clip. -->
      <audio id="ol-music" src="assets/music/calm-lo-fi.mp3" data-start="0" data-duration="42.666667" data-track-index="11"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:1.5,&quot;v&quot;:0.07},{&quot;t&quot;:41.167,&quot;v&quot;:0.07},{&quot;t&quot;:42.666667,&quot;v&quot;:0}]}]}"></audio>
    </div>
    <script>
      (function () {
        const FPS = 30;
        // Length from the timing data, not the DOM (the Video tab's player strips data-duration at runtime).
        const frames = Math.round(window.OL_CAPTIONS.total * FPS);
        const veil = document.querySelector("#ol-veil");
        const tl = gsap.timeline({ paused: true });
        FrameKit.drive(tl, FPS, frames, (f) => {
          veil.style.opacity = 1 - FrameKit.interpolate(f, [0, 4], [0, 1], FrameKit.CLAMP);
        });
        window.__timelines["onelaunch-file-scanning-3d"] = tl;
      })();
    </script>
  </body>
</html>
