<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
        }
      </style>
      <!-- Frame 7, End card: OneLaunch × Massive, in the campaign's endcard layout and Massive's colours. One stack centred
           on the frame (shot + copy, then the claims, on the same centre line); it rises in over 0.85 s, then holds still
           (the last frame is the poster). -->
      <div id="root" data-composition-id="s7-end" data-width="1920" data-height="1080" data-duration="6.9">
        <div class="ol-end">
          <div class="ol-end-grid"></div>
          <div class="ol-end-stack">
          <div class="ol-end-row">
            <div class="ol-end-shot"></div>
            <div class="ol-end-copy">
              <h2 class="ol-end-h"><span>Free file scanning</span><span>in OneLaunch</span></h2>
              <div class="ol-lockup">
                <span class="ol-ol-logo" role="img" aria-label="OneLaunch logo"></span>
                <span class="ol-cw">OneLaunch</span><span class="ol-lx">×</span><span class="ol-mv" role="img" aria-label="Massive"></span>
              </div>
              <span class="ol-end-pill">Let's ship it</span>
            </div>
          </div>
          <div class="ol-end-claims">Opt-in only<i></i>Nothing pre-ticked<i></i>Off switch in Settings</div>
          </div>
        </div>
      </div>
      <script>
        OneLaunchStory.end("s7-end");
      </script>
    </template>
  </body>
</html>
