<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"holiday","type":"enum","label":"Holiday","default":"hanukkah","options":[{"value":"hanukkah","label":"Hanukkah"},{"value":"rosh-hashanah","label":"Rosh Hashanah"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Holiday greetings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/frame-kit.js"></script>
    <link rel="stylesheet" href="lib/frame-kit.css" />
    <link rel="stylesheet" href="lib/massive.css" />
    <style>
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0f;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: Outfit, sans-serif;
      }
      #stage-bg {
        position: absolute;
        inset: 0;
        background: #0a0a0f;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="holiday-greetings"
      data-start="0"
      data-duration="15.5"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage-bg" class="clip" data-start="0" data-duration="15.5" data-track-index="0"></div>

      <!-- Scenes: desktop sits under everything; each later beat layers on top. -->
      <div id="hg-desktop" class="clip scene" style="z-index: 1"
        data-composition-id="hg-desktop" data-composition-src="compositions/01-desktop.html"
        data-start="0" data-duration="15.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="hg-notification" class="clip scene" style="z-index: 2"
        data-composition-id="hg-notification" data-composition-src="compositions/02-notification.html"
        data-start="2.3" data-duration="2.7" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="hg-card" class="clip scene" style="z-index: 3"
        data-composition-id="hg-card" data-composition-src="compositions/03-card.html"
        data-start="4.4" data-duration="11.1" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="hg-outro" class="clip scene" style="z-index: 4"
        data-composition-id="hg-outro" data-composition-src="compositions/04-outro.html"
        data-start="11" data-duration="4.5" data-track-index="4" data-width="1920" data-height="1080"></div>

      <!-- UI sounds (Pixabay, see assets/template/sfx/CREDITS.md), pre-mixed into one bed that spans the whole
           video and serves every holiday: pop x3 0.7/1.25/1.8, slack-knock 3.05, click-soft 3.95, sparkle 5.8
           (shamash lights / honey drips), eight soft pings up a major scale at 6.4 + i*0.3 (candles light /
           pomegranate seeds pop), chime 11. Each motif puts its eight beats on those cues. Separate short clips
           freeze Firefox previews: the runtime holds the clock when a clip ends inside its window (Firefox drops
           readyState on ended). -->
      <audio id="sfx-bed" data-start="0" data-duration="15.5" data-track-index="10" data-volume="1" src="assets/template/sfx-holiday.mp3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["holiday-greetings"] = tl;
    </script>
  </body>
</html>
