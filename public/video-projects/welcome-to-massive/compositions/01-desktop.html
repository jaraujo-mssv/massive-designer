<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #root .wallpaper {
          position: absolute;
          inset: -40px;
          background:
            radial-gradient(ellipse 60% 55% at 18% 105%, rgba(215, 73, 57, 0.42), transparent 70%),
            radial-gradient(ellipse 45% 40% at 88% -5%, rgba(255, 129, 99, 0.22), transparent 70%),
            radial-gradient(ellipse 70% 60% at 60% 60%, rgba(60, 30, 45, 0.55), transparent 75%),
            linear-gradient(160deg, #0d0b12 0%, #120c11 55%, #0a0a0f 100%);
        }
        #root .wall-grid {
          position: absolute;
          inset: 0;
          background-image: radial-gradient(circle, rgba(250, 244, 236, 0.35) 1px, transparent 1px);
          background-size: 48px 48px;
          opacity: 0.08;
        }
        /* Menu bar */
        #root .menubar {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 36px;
          display: flex;
          align-items: center;
          gap: 26px;
          padding: 0 20px;
          background: rgba(10, 10, 15, 0.45);
          backdrop-filter: blur(24px);
          color: rgba(250, 244, 236, 0.92);
          font-size: 15px;
          font-weight: 500;
        }
        #root .menubar img {
          height: 13px;
        }
        #root .menubar .app {
          font-weight: 700;
        }
        #root .menubar .right {
          margin-left: auto;
          display: flex;
          align-items: center;
          gap: 18px;
          font-variant-numeric: tabular-nums;
        }
        #root .menubar svg {
          width: 17px;
          height: 17px;
        }
        /* Dock */
        #root .dock {
          position: absolute;
          left: 648px;
          bottom: 18px;
          width: 624px;
          height: 96px;
          padding: 10px;
          display: flex;
          gap: 12px;
          border-radius: 28px;
          background: rgba(255, 255, 255, 0.1);
          border: 1px solid rgba(255, 255, 255, 0.18);
          backdrop-filter: blur(30px);
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        #root .tile {
          position: relative;
          width: 76px;
          height: 76px;
          flex-shrink: 0;
          border-radius: 18px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #fff;
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        #root .tile svg {
          width: 38px;
          height: 38px;
          fill: none;
          stroke: currentColor;
          stroke-width: 1.8;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        #root .tile.slack {
          background: transparent;
          box-shadow: none;
        }
        #root .tile.slack img {
          width: 76px;
          height: 76px;
          filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
        }
        #root .cal {
          background: #f6f3ee;
          color: #1c1b1f;
          flex-direction: column;
          gap: 0;
        }
        #root .cal .mon {
          font-size: 13px;
          font-weight: 700;
          color: #b8321f;
          letter-spacing: 0.06em;
        }
        #root .cal .day {
          font-size: 36px;
          font-weight: 400;
          line-height: 1;
        }
        #root .running {
          position: absolute;
          left: 1044px;
          bottom: 10px;
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: rgba(250, 244, 236, 0.85);
        }
        #root .dim {
          position: absolute;
          inset: 0;
          background: rgba(6, 6, 10, 1);
          pointer-events: none;
        }
      </style>
      <div id="root" data-composition-id="wm-desktop" data-width="1920" data-height="1080" data-duration="12.5">
        <div class="wallpaper" data-layout-allow-overflow><div class="wall-grid"></div></div>

        <div class="menubar">
          <img src="assets/brand/logo-white.svg" alt="Massive" />
          <span data-layout-allow-occlusion class="app">Slack</span>
          <span data-layout-allow-occlusion>File</span><span data-layout-allow-occlusion>Edit</span><span data-layout-allow-occlusion>View</span><span data-layout-allow-occlusion>Go</span><span data-layout-allow-occlusion>Window</span><span data-layout-allow-occlusion>Help</span>
          <div class="right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0" /><path d="M1.42 9a16 16 0 0 1 21.16 0" /><path d="M8.53 16.11a6 6 0 0 1 6.95 0" /><line x1="12" x2="12.01" y1="20" y2="20" /></svg>
            <span data-layout-allow-occlusion>Thu Sep 25</span><span data-layout-allow-occlusion>9:41 AM</span>
          </div>
        </div>

        <div class="dock">
          <div class="tile" style="background: linear-gradient(160deg, #5aa7ff, #1f6fe0)"><svg viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></svg></div>
          <div class="tile" style="background: linear-gradient(160deg, #3ad1c3, #127a86)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" /></svg></div>
          <div class="tile" style="background: linear-gradient(160deg, #6ab8ff, #2b62d9)"><svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2" /><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" /></svg></div>
          <div class="tile cal"><span data-layout-allow-occlusion class="mon">SEP</span><span data-layout-allow-occlusion class="day">25</span></div>
          <div class="tile slack"><img class="slack-icon" src="assets/template/slack.svg" alt="Slack" /></div>
          <div class="tile" style="background: linear-gradient(160deg, #ffd96a, #f2b31d); color: #5a4300"><svg viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z" /><path d="M15 3v4a2 2 0 0 0 2 2h4" /></svg></div>
          <div class="tile" style="background: linear-gradient(160deg, #2c2c33, #111115)"><svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5" /><line x1="12" x2="20" y1="19" y2="19" /></svg></div>
        </div>
        <div class="running"></div>

        <div class="dim" data-layout-allow-occlusion></div>
      </div>
      <script>
        (() => {
          const root = document.querySelector('[data-composition-id="wm-desktop"]');
          const q = (s) => root.querySelector(s);
          const wallpaper = q(".wallpaper");
          const dock = q(".dock");
          const icon = q(".slack-icon");
          const tl = gsap.timeline({ paused: true });

          // Slow drift on the wallpaper for the whole video.
          tl.fromTo(wallpaper, { scale: 1.05 }, { scale: 1, duration: 12.5, ease: "none" }, 0);
          // Dock slides up.
          tl.fromTo(dock, { y: 140 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0.05);

          // macOS attention bounce: three hops, squash on each landing.
          [0.7, 1.25, 1.8].forEach((t) => {
            tl.to(icon, { y: -46, duration: 0.24, ease: "power2.out" }, t);
            tl.to(icon, { y: 0, duration: 0.22, ease: "power2.in" }, t + 0.24);
            tl.fromTo(
              icon,
              { scaleX: 1.12, scaleY: 0.84 },
              { scaleX: 1, scaleY: 1, duration: 0.16, ease: "power1.out", immediateRender: false },
              t + 0.46,
            );
          });
          tl.fromTo(q(".running"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 0.7);

          // The icon leaves the dock: 02-notification flies a copy from here.
          tl.to(icon, { opacity: 0, duration: 0.01 }, 2.3);
          tl.to(icon, { opacity: 1, duration: 0.3 }, 4.6);

          // Dim the desktop as the profile card opens.
          tl.fromTo(q(".dim"), { opacity: 0 }, { opacity: 0.62, duration: 0.5, ease: "power2.out" }, 4.4);

          window.__timelines["wm-desktop"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
